# Package manifest for the bootc .deb builder. Last forced rebuild: 2026-10-16.
# One entry per package. Consumed by the generic bootc-debs-builder workflow
# (setup computes dependency waves) and by the build-one-deb reusable workflow.
#   name       logical package name
#   upstream   apt package to repack (omit for from-source / custom packages)
#   deps       packages that must be built+installed first (creates a wave)
#   sources    paths under workflows/bootc-debs-builder/ hashed for change
#   deb-glob   output deb glob when it differs from <name>_*
#   env        non-secret KEY: VALUE exported for the build (also hashed)
#   secret-env ENV_VAR: SECRET_NAME injected from secrets (never hashed)
#   build      the exact build script, verbatim
packages:
  - name: firstboot-user-setup
    sources:
      - firstbootpostinstall
      - preinstall/output/firstboot-user-setup
    env:
      FIRSTBOOT_VER: "1.0.2"
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)

      cp -r "${SAVE_PWD}"/workflows/bootc-debs-builder/firstbootpostinstall/* \
        /output/firstboot-user-setup/

      chmod 755 \
        /output/firstboot-user-setup/usr/local/bin/firstboot-user-setup

      sed -i \
        -e "s|{{ VER }}|${FIRSTBOOT_VER}|g" \
        -e "s|, {{ DEPS }}||g" \
        /output/firstboot-user-setup/DEBIAN/control

      # Content check: our entrypoint is present, executable and valid shell.
      f=/output/firstboot-user-setup/usr/local/bin/firstboot-user-setup
      test -x "${f}" && bash -n "${f}" \
        || { echo "ERROR: firstboot-user-setup script broken" >&2; exit 1; }

      dpkg-deb --build /output/firstboot-user-setup \
        /debs/firstboot-user-setup_${FIRSTBOOT_VER}_all.deb

  # ===========================================================================
  # Kernel packages — SPLIT into ONE base image entry + ONE ARM-generic modules
  # entry + ONE modules entry per device. The kernel image (vmlinuz + common
  # modules) is compiled ONCE in the `linux-image` entry; `linux-modules-arm`
  # depends on it and builds the ARM-generic options (ARM64, CMDLINE, PL011,
  # MMC/USB/RTC subsystem cores) ONCE; each `linux-modules-<device>` entry then
  # depends on `linux-modules-arm` and rebuilds ONLY its per-device modules from
  # the arm overlay + its specific device overlay. This saves N-1 full kernel
  # rebuilds AND lets the builder skip a device entirely when that device's
  # overlay is unchanged (the monolithic entry rebuilt everything whenever ANY
  # overlay changed).
  #
  # Wave layout (computed by the setup job from the `deps:` fields):
  #   wave 0: linux-image             (no deps, full bindeb-pkg once)
  #   wave 1: linux-modules-arm,      (deps: [linux-image]; modules-only,
  #           linux-modules-generic,           run in parallel)
  #           linux-modules-x86_64)
  #   wave 2: linux-modules-rpi3,     (deps: [linux-modules-arm]; modules-only,
  #           linux-modules-rpi4,              run in parallel)
  #           linux-modules-rpi5,
  #           linux-modules-rk3588
  #
  # The modules packages are OPTIONAL — the base image (linux-image-common)
  # works without them. They carry device-specific SoC / Ethernet PHY / MMC /
  # USB / RTC drivers and must be installed alongside linux-image-common. The
  # ARM device modules (rpi3/rpi4/rpi5/rk3588) install transitively via apt:
  # linux-modules-<device> Depends on linux-modules-arm which Depends on
  # linux-image-common, so apt pulls the whole chain.
  # ===========================================================================

  # linux-image: the ONE full kernel build. Merges the BASE config
  # (kernel/config — filesystems, virtio, serial, disables, the common
  # networking/cgroup/namespace set) into the Debian defconfig, then
  # `make bindeb-pkg` produces the vmlinuz + common modules as
  # linux-image-common_<ver>_<arch>.deb. sources: lists ONLY kernel/config
  # so changing a per-device overlay does NOT invalidate this package's
  # cache (the common image is independent of the overlays).
  - name: linux-image
    deb-glob: "linux-image-common_*"
    sources:
      # Only the base config feeds this package's content hash. A per-device
      # overlay change must NOT trigger a full kernel rebuild — it only
      # rebuilds that device's modules entry.
      - ../../kernel/config
    env:
      # KCONFIG_VER is a rolling tag; the builder pins the exact Debian kernel
      # source via `apt-get source linux-image-$(dpkg --print-architecture)`,
      # so this is only the OUTPUT version label for the produced .deb.
      KCONFIG_VER: "1.0"
    build: |
      set -euo pipefail

      SAVE_PWD=$(pwd)
      DEB_ARCH=$(dpkg --print-architecture)
      case "${DEB_ARCH}" in amd64) ARCH=x86 ;; *) ARCH="${DEB_ARCH}" ;; esac
      BASE_CONFIG="${SAVE_PWD}/kernel/config"
      test -f "${BASE_CONFIG}" \
        || { echo "ERROR: kernel/config (base) missing" >&2; exit 1; }

      # Install kernel build deps (build-essential + the kernel's own
      # build-deps). libncurses-dev/bc are required by the kconfig merge.
      apt-get update
      apt-get install -y --no-install-recommends \
        build-essential libncurses-dev bison flex libssl-dev libelf-dev bc \
        rsync libudev-dev elfutils dpkg-dev \
        debhelper kmod libdw-dev

      # Download the Debian kernel source matching the installed kernel.
      cd /tmp
      apt-get source linux
      SRCDIR=$(find /tmp -maxdepth 1 -name 'linux-*' -type d | head -1)
      test -n "${SRCDIR}" \
        || { echo "ERROR: kernel source not downloaded" >&2; exit 1; }

      cd "${SRCDIR}"
      make mrproper

      # Start from the Debian config for this arch.
      # Prefer the .config saved by the linux-image build (uploaded in its
      # artifact). Starting from the same base as the kernel build guarantees
      # that CONFIG_FUNCTION_TRACER (and other core settings) match, so
      # modpost can resolve __fentry__ from Module.symvers.
      if test -f /tmp/prior/linux-kernel.config; then
        cp /tmp/prior/linux-kernel.config .config
      else
        cp /boot/config-$(uname -r 2>/dev/null || echo config) .config 2>/dev/null \
          || cp debian/config/config .config 2>/dev/null \
          || make defconfig
      fi

      # Merge the base config (filesystems, virtio, serial, disables — the
      # base for every device). merge_config.sh -m merges in place.
      scripts/kconfig/merge_config.sh -m .config "${BASE_CONFIG}"
      make olddefconfig
      # Save the final .config so module builds on other runners can start
      # from the same base (prevents CONFIG_FUNCTION_TRACER mismatch that
      # causes __fentry__ undefined symbol errors in modpost).
      cp .config "/debs/linux-kernel.config"

      # Build the kernel + modules as a Debian binary package. bindeb-pkg
      # produces linux-image-*.deb and linux-modules-*.deb in /tmp (one
      # above the source dir).
      # ARCH is set above from DEB_ARCH (x86 for amd64) so the kernel
      # Makefile reads it from the environment; no make argument needed.
      make -j"$(nproc)" bindeb-pkg

      # Find the produced image deb (exclude debug debs).
      COMMON_IMAGE_DEB=$(find /tmp -maxdepth 1 -name 'linux-image-*.deb' \
        ! -name 'linux-image-*-dbg*' | head -1)
      test -n "${COMMON_IMAGE_DEB}" \
        || { echo "ERROR: linux-image-common deb not built" >&2; exit 1; }

      BUILT_VER=$(dpkg-deb -f "${COMMON_IMAGE_DEB}" Version)

      cp "${COMMON_IMAGE_DEB}" "/debs/linux-image-common_${BUILT_VER}_${DEB_ARCH}.deb"
      test -s "/debs/linux-image-common_${BUILT_VER}_${DEB_ARCH}.deb" \
        || { echo "ERROR: output linux-image-common deb empty" >&2; exit 1; }

      # Find and copy the linux-headers deb (built alongside the image deb
      # by bindeb-pkg) to /debs/ so downstream layers can install headers.
      HEADERS_DEB=$(find /tmp -maxdepth 1 -name 'linux-headers-*.deb' \
        ! -name '*-dbg*' | head -1)
      if test -n "${HEADERS_DEB}"; then
        HEADERS_VER=$(dpkg-deb -f "${HEADERS_DEB}" Version)
        cp "${HEADERS_DEB}" "/debs/linux-headers_${HEADERS_VER}_${DEB_ARCH}.deb"
        test -s "/debs/linux-headers_${HEADERS_VER}_${DEB_ARCH}.deb" \
          || { echo "ERROR: output linux-headers deb empty" >&2; exit 1; }
      fi

      # Repack the linux-image-common deb with Provides + Conflicts on the
      # stock Debian linux-image metapackages so our custom common image
      # satisfies apt dependencies on linux-image-<arch> without coinstall
      # conflicts. Also Provides the KERNEL_VARIANT virtual names
      # (linux-image-stock-<arch>, linux-image-minimal-<arch>) so the
      # Containerfile.minimal `linux-image-${KERNEL_VARIANT}-${ARCH}` apt
      # install resolves to this custom kernel via the virtual package
      # mechanism (the stock Debian archive has no
      # linux-image-stock-<arch> package; only this Provides makes the name
      # resolvable).
      # Only the CURRENT arch is Provided/Conflicted: a deb built on arm64
      # must not Provide linux-image-amd64, otherwise apt refuses to install
      # it on an arm64 runner that also has the amd64 deb available in
      # /tmp/prior (the cross-arch Provides + Conflicts creates an unsolvable
      # solver conflict).
      REPACK_DIR=/tmp/linux-image-common-repack
      rm -rf "${REPACK_DIR}"
      dpkg-deb -R "/debs/linux-image-common_${BUILT_VER}_${DEB_ARCH}.deb" "${REPACK_DIR}"
      if grep -q '^Provides:' "${REPACK_DIR}/DEBIAN/control"; then
        sed -i "/^Provides:/s/\$/, linux-image-${DEB_ARCH}, linux-image-stock-${DEB_ARCH}, linux-image-minimal-${DEB_ARCH}/" \
          "${REPACK_DIR}/DEBIAN/control"
      else
        printf 'Provides: linux-image-%s, linux-image-stock-%s, linux-image-minimal-%s\n' \
          "${DEB_ARCH}" "${DEB_ARCH}" "${DEB_ARCH}" \
          >> "${REPACK_DIR}/DEBIAN/control"
      fi
      dpkg-deb -b "${REPACK_DIR}" \
        "/debs/linux-image-common_${BUILT_VER}_${DEB_ARCH}.deb"
      test -s "/debs/linux-image-common_${BUILT_VER}_${DEB_ARCH}.deb" \
        || { echo "ERROR: repacked linux-image-common deb empty" >&2; exit 1; }

      # Save Module.symvers so module builds can seed it directly. The
      # headers deb may not include it in all build configurations; an
      # explicit copy is more reliable than extracting from the deb.
      [ -f Module.symvers ] \
        && cp Module.symvers "/debs/linux-kernel-Module.symvers"

      # Free the ~10 GB kernel source tree now that all debs are copied to
      # /debs. Without this the runner's /tmp fills up and starves parallel
      # jobs (e.g. grub-efi-amd64-signed) of disk space.
      rm -rf "${SRCDIR}" /tmp/linux-*

  # linux-modules-arm: ARM-generic modules — the ARM base layer. Depends on
  # linux-image (the common kernel image built in wave 0). Builds ONLY modules
  # from kernel/config + modules-kernel/arm and packages them as
  # linux-modules-arm_<ver>_<arch>.deb. The ARM device modules (rpi3/rpi4/rpi5/
  # rk3588) depend on THIS package (transitively on linux-image via it) and add
  # their device-specific overlay on top of the arm overlay. The modules are
  # OPTIONAL — the base image works without them. This entry carries the
  # ARM64 core, the kernel command line, the PL011 UART, and the MMC/USB/RTC
  # subsystem cores shared by every ARM device.
  - name: linux-modules-arm
    when:
      arch: arm64
    deps:
      - linux-image
    sources:
      - ../../kernel/config
      - ../../modules-kernel/arm
      - preinstall/output/linux-modules-arm
    build: |
      set -euo pipefail
      DEVICE=arm
      SAVE_PWD=$(pwd)
      DEB_ARCH=$(dpkg --print-architecture)
      BASE_CONFIG="${SAVE_PWD}/kernel/config"
      OVERLAY="${SAVE_PWD}/modules-kernel/${DEVICE}"
      test -f "${BASE_CONFIG}" \
        || { echo "ERROR: kernel/config (base) missing" >&2; exit 1; }
      test -f "${OVERLAY}" \
        || { echo "ERROR: modules-kernel/${DEVICE} overlay missing" >&2; exit 1; }

      # The linux-image wave installed linux-image-common_<ver>_<arch>.deb
      # into the build container (via the deps install step). Derive the
      # exact version + kernel version string from it so the module source
      # download matches.
      # The workflow downloads ALL prior deb artifacts (both amd64 and arm64)
      # into /tmp/prior, so the bare linux-image-common_*.deb glob catches the
      # foreign-arch deb too and apt then fails with a Conflicts/Provides
      # collision (the common deb Provides+Conflicts linux-image-amd64 AND
      # linux-image-arm64). Filter on the runner's DEB_ARCH so only the
      # matching-arch deb is selected.
      COMMON_DEB=$(ls /tmp/prior/linux-image-common_*_${DEB_ARCH}.deb 2>/dev/null | head -1)
      test -n "${COMMON_DEB}" \
        || { echo "ERROR: linux-image-common deb not found in /tmp/prior" >&2; exit 1; }
      # Extract version + kernel version from the deb WITHOUT installing it:
      # installing the custom deb first makes `apt-get source linux` resolve to
      # the non-existent `linux-upstream` pseudo-source (the deb Provides
      # linux-image-<arch>, so apt picks the meta-source). Download the kernel
      # source BEFORE installing the custom deb.
      BUILT_VER=$(dpkg-deb -f "${COMMON_DEB}" Version)
      KVER=$(dpkg-deb -f "${COMMON_DEB}" Package | sed 's/^linux-image-//')

      # Install kernel build deps (build-essential + the kernel's own
      # build-deps). libncurses-dev/bc are required by the kconfig merge.
      apt-get update
      apt-get install -y --no-install-recommends \
        build-essential libncurses-dev bison flex libssl-dev libelf-dev bc \
        rsync libudev-dev elfutils dpkg-dev

      # Download the Debian kernel source matching the installed common
      # kernel (KVER pins the exact source version).
      cd /tmp
      # The Debian source package is always named `linux` regardless of the
      # binary package name (linux-image-<kver> resolves to the linux-upstream
      # pseudo-source which is NOT in the Debian archive). Wave 0 (linux-image)
      # uses the same `apt-get source linux` form; we match it here so the
      # module builds download the real Debian kernel source. This MUST run
      # BEFORE the custom linux-image-common deb is installed (see above).
      # Purge the pre-installed custom linux-image-common deb so apt-get source
      # does not resolve 'linux' to the linux-upstream pseudo-source. The
      # "Install dependency debs" step already installed it (transitively for
      # the device entries via linux-modules-arm -> linux-image-common), so we
      # must remove it before the source download resolves 'linux' to the real
      # Debian source package.
      apt-get purge -y linux-image-common || dpkg --purge linux-image-common || true
      apt-get autoremove -y || true
      apt-get source linux
      SRCDIR=$(find /tmp -maxdepth 1 -name 'linux-*' -type d | head -1)
      test -n "${SRCDIR}" \
        || { echo "ERROR: kernel source not downloaded" >&2; exit 1; }

      # Install the custom common deb AFTER the source download so apt-get
      # source does not resolve to linux-upstream.
      apt-get install -y "${COMMON_DEB}"

      cd "${SRCDIR}"
      # Translate the Debian-style DEB_ARCH (amd64) to the kernel's arch dir
      # name (x86_64): the kernel Makefile includes arch/$(ARCH)/Makefile,
      # and arch/amd64/ does not exist, so an unmodified ARCH=amd64 fails
      # with "arch/amd64/Makefile: No such file or directory".
      # Export KERNEL_ARCH BEFORE any make invocation (olddefconfig,
      # modules, modules_install) — the runner's inherited
      # ARCH=amd64 would otherwise make `make olddefconfig` look for
      # arch/amd64/Makefile and fail on the first command. For ARM the
      # kernel arch dir is arm64, matching DEB_ARCH (no translation needed).
      KERNEL_ARCH="${DEB_ARCH}"
      [ "${KERNEL_ARCH}" = "amd64" ] && KERNEL_ARCH="x86_64"
      unset ARCH
      export ARCH="${KERNEL_ARCH}"

      # Start from the Debian config for this arch, then merge the base
      # config THEN the arm overlay (overlay wins on conflicts — last
      # merge wins).
      # Prefer the .config saved by the linux-image build (uploaded in its
      # artifact). Starting from the same base as the kernel build guarantees
      # that CONFIG_FUNCTION_TRACER (and other core settings) match, so
      # modpost can resolve __fentry__ from Module.symvers.
      if test -f /tmp/prior/linux-kernel.config; then
        cp /tmp/prior/linux-kernel.config .config
      else
        cp /boot/config-$(uname -r 2>/dev/null || echo config) .config 2>/dev/null \
          || cp debian/config/config .config 2>/dev/null \
          || make defconfig
      fi
      scripts/kconfig/merge_config.sh -m .config "${BASE_CONFIG}" "${OVERLAY}"
      make olddefconfig

      # Seed Module.symvers from the linux-headers deb built alongside
      # linux-image so modpost can resolve kernel symbols in a modules-only
      # build (no vmlinux.o). Without it, modpost fails on modules that
      # reference built-in kernel symbols (__fentry__, __x86_return_thunk…).
      SYMVERS_SRC=""
      if [ -f /tmp/prior/linux-kernel-Module.symvers ]; then
        SYMVERS_SRC="/tmp/prior/linux-kernel-Module.symvers"
      else
        HEADERS_DEB=$(ls /tmp/prior/linux-headers_*_${DEB_ARCH}.deb 2>/dev/null | head -1)
        if [ -n "${HEADERS_DEB}" ]; then
          dpkg-deb -x "${HEADERS_DEB}" /tmp/headers-extract
          SYMVERS_SRC=$(find /tmp/headers-extract -name 'Module.symvers' | head -1)
        fi
      fi
      if [ -n "${SYMVERS_SRC}" ]; then
        cp "${SYMVERS_SRC}" Module.symvers
        # modules-only.symvers is the OUTPUT written by modpost; do not pre-seed it
      fi
      [ -d /tmp/headers-extract ] && rm -rf /tmp/headers-extract

      # Build only the modules (no vmlinuz, no full bindeb-pkg). This is
      # the N-1 rebuild saving: modules are an order of magnitude faster
      # than a full kernel build.
      # Filter Module.symvers to vmlinux-only exports before patching modpost.
      # The full Module.symvers includes inter-module exports (ehci-hcd, xhci-hcd,
      # etc.); if we feed those to modpost via -i it flags duplicate exports when
      # those same modules are rebuilt.  Only vmlinux symbols are "external" to
      # the module build; inter-module exports are discovered by scanning .ko files.
      if [ -f Module.symvers ]; then
        awk -F'\t' '$3 == "vmlinux"' Module.symvers > /tmp/vmlinux-only.symvers
      fi
      # Patch Makefile.modpost: add -i /tmp/vmlinux-only.symvers when vmlinux.o is
      # absent. In-tree modules-only builds skip this flag by default (only the
      # KBUILD_EXTMOD path reads it); without it modpost has no kernel symbol table
      # and reports 1400+ undefined-symbol errors.
      if [ -f scripts/Makefile.modpost ] && [ -f /tmp/vmlinux-only.symvers ] \
         && ! grep -q 'vmlinux-only.symvers' scripts/Makefile.modpost; then
        printf '\nifneq ($(wildcard /tmp/vmlinux-only.symvers),)\nmodpost-args += -i /tmp/vmlinux-only.symvers\nendif\n' \
          >> scripts/Makefile.modpost
      fi
      make -j"$(nproc)" modules

      # Install the modules into a DESTDIR packaging tree, then build a
      # Debian package from that tree. The modules dir name matches the
      # common image's /lib/modules/<KVER> so modprobe on the target
      # resolves them under the running kernel.
      DESTDIR="/output/linux-modules-${DEVICE}"
      rm -rf "${DESTDIR}"
      mkdir -p "${DESTDIR}/DEBIAN" "${DESTDIR}/lib/modules/${KVER}"
      # modules.builtin and modules.builtin.modinfo are generated during a full
      # kernel build; a modules-only build (make modules without vmlinux) may
      # not produce them. Provide empty stubs so modules_install succeeds.
      [ -f modules.builtin ] || touch modules.builtin
      [ -f modules.builtin.modinfo ] || touch modules.builtin.modinfo
      make modules_install INSTALL_MOD_PATH="${DESTDIR}" INSTALL_MOD_STRIP=1

      if [ "${MODULE_SIGNING_ACTIVE:-}" = "yes" ]; then
        printf '%s' "${MODULE_SIGNING_KEY}" > /tmp/mod_sign.pem
        printf '%s' "${MODULE_SIGNING_CERT}" > /tmp/mod_sign.x509
        find "${DESTDIR}/lib/modules" -name "*.ko" | while IFS= read -r ko; do
          scripts/sign-file sha512 /tmp/mod_sign.pem /tmp/mod_sign.x509 "${ko}"
        done
        rm -f /tmp/mod_sign.pem /tmp/mod_sign.x509
      fi

      cp "${SAVE_PWD}/workflows/bootc-debs-builder/preinstall/output/linux-modules-arm/DEBIAN/control" \
        "${DESTDIR}/DEBIAN/control"
      sed -i \
        -e "s|{{ VER }}|${BUILT_VER}|g" \
        -e "s|{{ ARCH }}|${DEB_ARCH}|g" \
        -e "s|{{ KVER }}|${KVER}|g" \
        "${DESTDIR}/DEBIAN/control"

      # Regenerate md5sums for the installed module files.
      ( cd "${DESTDIR}" && \
        find lib -type f | xargs md5sum | sed 's|lib/|/lib/|' \
        > DEBIAN/md5sums )

      # Build the modules deb.
      dpkg-deb --build "${DESTDIR}" \
        "/debs/linux-modules-${DEVICE}_${BUILT_VER}_${DEB_ARCH}.deb"

      # Content check: the output deb exists and is non-empty.
      test -s "/debs/linux-modules-${DEVICE}_${BUILT_VER}_${DEB_ARCH}.deb" \
        || { echo "ERROR: output linux-modules-${DEVICE} deb empty" >&2; exit 1; }

  # linux-modules-generic: the DEFAULT device class — an empty meta-package.
  # Depends on linux-image (the common kernel image built in wave 0). Produces
  # a valid `linux-modules-generic_<ver>_<arch>.deb` that carries NO modules;
  # its only purpose is to satisfy the `linux-modules-${DEVICE}` apt install
  # line in Containerfile.minimal when DEVICE=generic (the default), so the
  # install line always names a real package instead of relying on apt
  # silently ignoring an empty `linux-modules-` package name. The overlay in
  # modules-kernel/generic is a header-only stub (no CONFIG_ options), so the
  # build skips the kernel source download + module compilation entirely and
  # just assembles the empty .deb with a Depends on linux-image-common.
  - name: linux-modules-generic
    deps:
      - linux-image
    sources:
      - ../../kernel/config
      - ../../modules-kernel/generic
      - preinstall/output/linux-modules-generic
    build: |
      set -euo pipefail
      DEVICE=generic
      SAVE_PWD=$(pwd)
      DEB_ARCH=$(dpkg --print-architecture)
      BASE_CONFIG="${SAVE_PWD}/kernel/config"
      OVERLAY="${SAVE_PWD}/modules-kernel/${DEVICE}"
      test -f "${BASE_CONFIG}" \
        || { echo "ERROR: kernel/config (base) missing" >&2; exit 1; }
      test -f "${OVERLAY}" \
        || { echo "ERROR: modules-kernel/${DEVICE} overlay missing" >&2; exit 1; }

      # The linux-image wave installed linux-image-common_<ver>_<arch>.deb
      # into the build container (via the deps install step). Derive the exact
      # version from it so the empty generic package declares the matching
      # Depends constraint.
      # The workflow downloads ALL prior deb artifacts (both amd64 and arm64)
      # into /tmp/prior, so the bare linux-image-common_*.deb glob catches the
      # foreign-arch deb too and apt then fails with a Conflicts/Provides
      # collision (the common deb Provides+Conflicts linux-image-amd64 AND
      # linux-image-arm64). Filter on the runner's DEB_ARCH so only the
      # matching-arch deb is selected.
      COMMON_DEB=$(ls /tmp/prior/linux-image-common_*_${DEB_ARCH}.deb 2>/dev/null | head -1)
      test -n "${COMMON_DEB}" \
        || { echo "ERROR: linux-image-common deb not found in /tmp/prior" >&2; exit 1; }
      apt-get install -y "${COMMON_DEB}"
      BUILT_VER=$(dpkg-deb -f "${COMMON_DEB}" Version)

      # Assemble an EMPTY modules package. The generic overlay carries no
      # CONFIG_ options, so there is no kernel source download, no module
      # compilation — just the packaging tree with a control file declaring
      # Depends: linux-image-common. The empty /lib/modules/<KVER> dir is kept
      # so the package layout matches the other modules packages (dpkg-deb
      # accepts an empty payload dir).
      KVER=$(dpkg-deb -f "${COMMON_DEB}" Package | sed 's/^linux-image-//')
      DESTDIR="/output/linux-modules-${DEVICE}"
      rm -rf "${DESTDIR}"
      mkdir -p "${DESTDIR}/DEBIAN" "${DESTDIR}/lib/modules/${KVER}"

      cp "${SAVE_PWD}/workflows/bootc-debs-builder/preinstall/output/linux-modules-generic/DEBIAN/control" \
        "${DESTDIR}/DEBIAN/control"
      sed -i \
        -e "s|{{ VER }}|${BUILT_VER}|g" \
        -e "s|{{ ARCH }}|${DEB_ARCH}|g" \
        -e "s|{{ KVER }}|${KVER}|g" \
        "${DESTDIR}/DEBIAN/control"

      # No payload files -> no md5sums file (dpkg-deb accepts a package with
      # only a control file). Build the empty modules deb.
      dpkg-deb --build "${DESTDIR}" \
        "/debs/linux-modules-${DEVICE}_${BUILT_VER}_${DEB_ARCH}.deb"

      # Content check: the output deb exists and is non-empty.
      test -s "/debs/linux-modules-${DEVICE}_${BUILT_VER}_${DEB_ARCH}.deb" \
        || { echo "ERROR: output linux-modules-${DEVICE} deb empty" >&2; exit 1; }

  # linux-modules-arm-device: one template for all four ARM device-specific
  # module packages. The CI expands each variant into an independent build job
  # (see the manifest-expand action) and injects VARIANT from the variant key,
  # so this build script is written once.
  # Variants (all wave 2, deps: linux-modules-arm):
  #   linux-modules-rpi3 / linux-modules-rpi4
  #   linux-modules-rpi5 / linux-modules-rk3588
  - name: linux-modules-arm-device
    when:
      arch: arm64
    deps:
      - linux-modules-arm
    variants:
      rpi3: {}
      rpi4: {}
      rpi5: {}
      rk3588: {}
    variant-name-prefix: "linux-modules-"
    variant-env: DEVICE
    variant-source: "../../modules-kernel/{variant}"
    sources:
      - ../../kernel/config
      - ../../modules-kernel/arm
      - preinstall/output/linux-modules-arm-device
    build: |
      set -euo pipefail
      # DEVICE is injected by the CI from the variant key (rpi3/rpi4/rpi5/rk3588)
      SAVE_PWD=$(pwd)
      DEB_ARCH=$(dpkg --print-architecture)
      BASE_CONFIG="${SAVE_PWD}/kernel/config"
      ARM_OVERLAY="${SAVE_PWD}/modules-kernel/arm"
      OVERLAY="${SAVE_PWD}/modules-kernel/${DEVICE}"
      test -f "${BASE_CONFIG}" \
        || { echo "ERROR: kernel/config (base) missing" >&2; exit 1; }
      test -f "${ARM_OVERLAY}" \
        || { echo "ERROR: modules-kernel/arm overlay missing" >&2; exit 1; }
      test -f "${OVERLAY}" \
        || { echo "ERROR: modules-kernel/${DEVICE} overlay missing" >&2; exit 1; }

      # The linux-modules-arm wave installed linux-image-common_<ver>_<arch>.deb
      # + linux-modules-arm_<ver>_<arch>.deb into the build container (via the
      # transitive deps install step). Derive the exact version + kernel
      # version string from the common image deb so the module source
      # download matches.
      # The workflow downloads ALL prior deb artifacts (both amd64 and arm64)
      # into /tmp/prior, so the bare linux-image-common_*.deb glob catches the
      # foreign-arch deb too and apt then fails with a Conflicts/Provides
      # collision (the common deb Provides+Conflicts linux-image-amd64 AND
      # linux-image-arm64). Filter on the runner's DEB_ARCH so only the
      # matching-arch deb is selected.
      COMMON_DEB=$(ls /tmp/prior/linux-image-common_*_${DEB_ARCH}.deb 2>/dev/null | head -1)
      test -n "${COMMON_DEB}" \
        || { echo "ERROR: linux-image-common deb not found in /tmp/prior" >&2; exit 1; }
      # Extract version + kernel version from the deb WITHOUT installing it:
      # installing the custom deb first makes `apt-get source linux` resolve to
      # the non-existent `linux-upstream` pseudo-source (the deb Provides
      # linux-image-<arch>, so apt picks the meta-source). Download the kernel
      # source BEFORE installing the custom deb.
      BUILT_VER=$(dpkg-deb -f "${COMMON_DEB}" Version)
      KVER=$(dpkg-deb -f "${COMMON_DEB}" Package | sed 's/^linux-image-//')

      # Install kernel build deps (build-essential + the kernel's own
      # build-deps). libncurses-dev/bc are required by the kconfig merge.
      apt-get update
      apt-get install -y --no-install-recommends \
        build-essential libncurses-dev bison flex libssl-dev libelf-dev bc \
        rsync libudev-dev elfutils dpkg-dev

      # Download the Debian kernel source matching the installed common
      # kernel (KVER pins the exact source version).
      cd /tmp
      # The Debian source package is always named `linux` regardless of the
      # binary package name (linux-image-<kver> resolves to the linux-upstream
      # pseudo-source which is NOT in the Debian archive). Wave 0 (linux-image)
      # uses the same `apt-get source linux` form; we match it here so the
      # module builds download the real Debian kernel source. This MUST run
      # BEFORE the custom linux-image-common deb is installed (see above).
      # Purge the pre-installed custom linux-image-common deb so apt-get source
      # does not resolve 'linux' to the linux-upstream pseudo-source. The
      # "Install dependency debs" step already installed it (transitively for
      # the device entries via linux-modules-arm -> linux-image-common), so we
      # must remove it before the source download resolves 'linux' to the real
      # Debian source package.
      apt-get purge -y linux-image-common || dpkg --purge linux-image-common || true
      apt-get autoremove -y || true
      apt-get source linux
      SRCDIR=$(find /tmp -maxdepth 1 -name 'linux-*' -type d | head -1)
      test -n "${SRCDIR}" \
        || { echo "ERROR: kernel source not downloaded" >&2; exit 1; }

      # Install the custom common deb AFTER the source download so apt-get
      # source does not resolve to linux-upstream.
      apt-get install -y "${COMMON_DEB}"

      cd "${SRCDIR}"
      # Translate the Debian-style DEB_ARCH (amd64) to the kernel's arch dir
      # name (x86_64): the kernel Makefile includes arch/$(ARCH)/Makefile,
      # and arch/amd64/ does not exist, so an unmodified ARCH=amd64 fails
      # with "arch/amd64/Makefile: No such file or directory".
      # Export KERNEL_ARCH BEFORE any make invocation (olddefconfig,
      # modules, modules_install) — the runner's inherited
      # ARCH=amd64 would otherwise make `make olddefconfig` look for
      # arch/amd64/Makefile and fail on the first command. For ARM the
      # kernel arch dir is arm64, matching DEB_ARCH (no translation needed).
      KERNEL_ARCH="${DEB_ARCH}"
      [ "${KERNEL_ARCH}" = "amd64" ] && KERNEL_ARCH="x86_64"
      unset ARCH
      export ARCH="${KERNEL_ARCH}"

      # Start from the Debian config for this arch, then merge the base
      # config THEN the arm overlay THEN the device overlay (last merge wins
      # on conflicts — device overlay wins over arm, arm wins over base).
      # Prefer the .config saved by the linux-image build (uploaded in its
      # artifact). Starting from the same base as the kernel build guarantees
      # that CONFIG_FUNCTION_TRACER (and other core settings) match, so
      # modpost can resolve __fentry__ from Module.symvers.
      if test -f /tmp/prior/linux-kernel.config; then
        cp /tmp/prior/linux-kernel.config .config
      else
        cp /boot/config-$(uname -r 2>/dev/null || echo config) .config 2>/dev/null \
          || cp debian/config/config .config 2>/dev/null \
          || make defconfig
      fi
      scripts/kconfig/merge_config.sh -m .config "${BASE_CONFIG}" "${ARM_OVERLAY}" "${OVERLAY}"
      make olddefconfig

      # Seed Module.symvers from the linux-headers deb built alongside
      # linux-image so modpost can resolve kernel symbols in a modules-only
      # build (no vmlinux.o). Without it, modpost fails on modules that
      # reference built-in kernel symbols (__fentry__, __x86_return_thunk…).
      SYMVERS_SRC=""
      if [ -f /tmp/prior/linux-kernel-Module.symvers ]; then
        SYMVERS_SRC="/tmp/prior/linux-kernel-Module.symvers"
      else
        HEADERS_DEB=$(ls /tmp/prior/linux-headers_*_${DEB_ARCH}.deb 2>/dev/null | head -1)
        if [ -n "${HEADERS_DEB}" ]; then
          dpkg-deb -x "${HEADERS_DEB}" /tmp/headers-extract
          SYMVERS_SRC=$(find /tmp/headers-extract -name 'Module.symvers' | head -1)
        fi
      fi
      if [ -n "${SYMVERS_SRC}" ]; then
        cp "${SYMVERS_SRC}" Module.symvers
        # modules-only.symvers is the OUTPUT written by modpost; do not pre-seed it
      fi
      [ -d /tmp/headers-extract ] && rm -rf /tmp/headers-extract

      # Build only the modules (no vmlinuz, no full bindeb-pkg). This is
      # the N-1 rebuild saving: modules are an order of magnitude faster
      # than a full kernel build.
      # Filter Module.symvers to vmlinux-only exports before patching modpost.
      # The full Module.symvers includes inter-module exports (ehci-hcd, xhci-hcd,
      # etc.); if we feed those to modpost via -i it flags duplicate exports when
      # those same modules are rebuilt.  Only vmlinux symbols are "external" to
      # the module build; inter-module exports are discovered by scanning .ko files.
      if [ -f Module.symvers ]; then
        awk -F'\t' '$3 == "vmlinux"' Module.symvers > /tmp/vmlinux-only.symvers
      fi
      # Patch Makefile.modpost: add -i /tmp/vmlinux-only.symvers when vmlinux.o is
      # absent. In-tree modules-only builds skip this flag by default (only the
      # KBUILD_EXTMOD path reads it); without it modpost has no kernel symbol table
      # and reports 1400+ undefined-symbol errors.
      if [ -f scripts/Makefile.modpost ] && [ -f /tmp/vmlinux-only.symvers ] \
         && ! grep -q 'vmlinux-only.symvers' scripts/Makefile.modpost; then
        printf '\nifneq ($(wildcard /tmp/vmlinux-only.symvers),)\nmodpost-args += -i /tmp/vmlinux-only.symvers\nendif\n' \
          >> scripts/Makefile.modpost
      fi
      make -j"$(nproc)" modules

      # Install the modules into a DESTDIR packaging tree, then build a
      # Debian package from that tree. The modules dir name matches the
      # common image's /lib/modules/<KVER> so modprobe on the target
      # resolves them under the running kernel.
      DESTDIR="/output/linux-modules-${DEVICE}"
      rm -rf "${DESTDIR}"
      mkdir -p "${DESTDIR}/DEBIAN" "${DESTDIR}/lib/modules/${KVER}"
      # modules.builtin and modules.builtin.modinfo are generated during a full
      # kernel build; a modules-only build (make modules without vmlinux) may
      # not produce them. Provide empty stubs so modules_install succeeds.
      [ -f modules.builtin ] || touch modules.builtin
      [ -f modules.builtin.modinfo ] || touch modules.builtin.modinfo
      make modules_install INSTALL_MOD_PATH="${DESTDIR}" INSTALL_MOD_STRIP=1

      if [ "${MODULE_SIGNING_ACTIVE:-}" = "yes" ]; then
        printf '%s' "${MODULE_SIGNING_KEY}" > /tmp/mod_sign.pem
        printf '%s' "${MODULE_SIGNING_CERT}" > /tmp/mod_sign.x509
        find "${DESTDIR}/lib/modules" -name "*.ko" | while IFS= read -r ko; do
          scripts/sign-file sha512 /tmp/mod_sign.pem /tmp/mod_sign.x509 "${ko}"
        done
        rm -f /tmp/mod_sign.pem /tmp/mod_sign.x509
      fi

      cp "${SAVE_PWD}/workflows/bootc-debs-builder/preinstall/output/linux-modules-arm-device/DEBIAN/control" \
        "${DESTDIR}/DEBIAN/control"
      sed -i \
        -e "s|{{ DEVICE }}|${DEVICE}|g" \
        -e "s|Version: {{ VER }}|Version: ${BUILT_VER}+r1|g" \
        -e "s|{{ VER }}|${BUILT_VER}|g" \
        -e "s|{{ ARCH }}|${DEB_ARCH}|g" \
        "${DESTDIR}/DEBIAN/control"

      # Regenerate md5sums for the installed module files.
      ( cd "${DESTDIR}" && \
        find lib -type f | xargs md5sum | sed 's|lib/|/lib/|' \
        > DEBIAN/md5sums )

      # Build the modules deb.
      dpkg-deb --build "${DESTDIR}" \
        "/debs/linux-modules-${DEVICE}_${BUILT_VER}+r1_${DEB_ARCH}.deb"

      # Content check: the output deb exists and is non-empty.
      test -s "/debs/linux-modules-${DEVICE}_${BUILT_VER}+r1_${DEB_ARCH}.deb" \
        || { echo "ERROR: output linux-modules-${DEVICE} deb empty" >&2; exit 1; }

  # linux-modules-x86_64: device-specific modules for x86_64 PCs / servers /
  # VMs (NVMe, AHCI, physical NIC drivers, USB host controllers as modules).
  # Same shape as the other device entries. x86_64 is NOT ARM, so it depends
  # on linux-image directly (wave 1) rather than on linux-modules-arm.
  - name: linux-modules-x86_64
    when:
      arch: amd64
    # DEVICE is set to x86-64 (hyphen) inside the build so the generated deb
    # name is linux-modules-x86-64 (Debian forbids underscores in package names).
    # deb-glob overrides the default PACKAGE_* glob so build-deb.sh finds it.
    deb-glob: "linux-modules-x86-64_*"
    deps:
      - linux-image
    sources:
      - ../../kernel/config
      - ../../modules-kernel/x86_64
      - preinstall/output/linux-modules-x86-64
    build: |
      set -euo pipefail
      DEVICE=x86-64
      SAVE_PWD=$(pwd)
      DEB_ARCH=$(dpkg --print-architecture)
      BASE_CONFIG="${SAVE_PWD}/kernel/config"
      # The overlay directory uses underscores (filesystem name); DEVICE uses
      # hyphens so the generated Debian package name is valid (no underscores).
      OVERLAY="${SAVE_PWD}/modules-kernel/x86_64"
      test -f "${BASE_CONFIG}" \
        || { echo "ERROR: kernel/config (base) missing" >&2; exit 1; }
      test -f "${OVERLAY}" \
        || { echo "ERROR: modules-kernel/x86_64 overlay missing" >&2; exit 1; }

      # The workflow downloads ALL prior deb artifacts (both amd64 and arm64)
      # into /tmp/prior, so the bare linux-image-common_*.deb glob catches the
      # foreign-arch deb too and apt then fails with a Conflicts/Provides
      # collision (the common deb Provides+Conflicts linux-image-amd64 AND
      # linux-image-arm64). Filter on the runner's DEB_ARCH so only the
      # matching-arch deb is selected.
      COMMON_DEB=$(ls /tmp/prior/linux-image-common_*_${DEB_ARCH}.deb 2>/dev/null | head -1)
      test -n "${COMMON_DEB}" \
        || { echo "ERROR: linux-image-common deb not found in /tmp/prior" >&2; exit 1; }
      # Extract version + kernel version from the deb WITHOUT installing it:
      # installing the custom deb first makes `apt-get source linux` resolve to
      # the non-existent `linux-upstream` pseudo-source (the deb Provides
      # linux-image-<arch>, so apt picks the meta-source). Download the kernel
      # source BEFORE installing the custom deb.
      BUILT_VER=$(dpkg-deb -f "${COMMON_DEB}" Version)
      KVER=$(dpkg-deb -f "${COMMON_DEB}" Package | sed 's/^linux-image-//')

      apt-get update
      apt-get install -y --no-install-recommends \
        build-essential libncurses-dev bison flex libssl-dev libelf-dev bc \
        rsync libudev-dev elfutils dpkg-dev

      cd /tmp
      # The Debian source package is always named `linux` regardless of the
      # binary package name (linux-image-<kver> resolves to the linux-upstream
      # pseudo-source which is NOT in the Debian archive). Wave 0 (linux-image)
      # uses the same `apt-get source linux` form; we match it here so the
      # module builds download the real Debian kernel source. This MUST run
      # BEFORE the custom linux-image-common deb is installed (see above).
      # Purge the pre-installed custom linux-image-common deb so apt-get source
      # does not resolve 'linux' to the linux-upstream pseudo-source. The
      # "Install dependency debs" step already installed it (transitively for
      # the device entries via linux-modules-arm -> linux-image-common), so we
      # must remove it before the source download resolves 'linux' to the real
      # Debian source package.
      apt-get purge -y linux-image-common || dpkg --purge linux-image-common || true
      apt-get autoremove -y || true
      apt-get source linux
      SRCDIR=$(find /tmp -maxdepth 1 -name 'linux-*' -type d | head -1)
      test -n "${SRCDIR}" \
        || { echo "ERROR: kernel source not downloaded" >&2; exit 1; }

      # Install the custom common deb AFTER the source download so apt-get
      # source does not resolve to linux-upstream.
      apt-get install -y "${COMMON_DEB}"

      cd "${SRCDIR}"
      # Translate the Debian-style DEB_ARCH (amd64) to the kernel's arch dir
      # name (x86_64): the kernel Makefile includes arch/$(ARCH)/Makefile,
      # and arch/amd64/ does not exist, so an unmodified ARCH=amd64 fails
      # with "arch/amd64/Makefile: No such file or directory".
      # Export KERNEL_ARCH BEFORE any make invocation (olddefconfig,
      # modules, modules_install) — the runner's inherited
      # ARCH=amd64 would otherwise make `make olddefconfig` look for
      # arch/amd64/Makefile and fail on the first command.
      KERNEL_ARCH="${DEB_ARCH}"
      [ "${KERNEL_ARCH}" = "amd64" ] && KERNEL_ARCH="x86_64"
      unset ARCH
      export ARCH="${KERNEL_ARCH}"
      # Prefer the .config saved by the linux-image build (uploaded in its
      # artifact). Starting from the same base as the kernel build guarantees
      # that CONFIG_FUNCTION_TRACER (and other core settings) match, so
      # modpost can resolve __fentry__ from Module.symvers.
      if test -f /tmp/prior/linux-kernel.config; then
        cp /tmp/prior/linux-kernel.config .config
      else
        cp /boot/config-$(uname -r 2>/dev/null || echo config) .config 2>/dev/null \
          || cp debian/config/config .config 2>/dev/null \
          || make defconfig
      fi
      scripts/kconfig/merge_config.sh -m .config "${BASE_CONFIG}" "${OVERLAY}"
      make olddefconfig

      # linux-modules-x86_64 uses an overlay that intentionally promotes some
      # drivers from built-in (vmlinux) to loadable modules (USB_EHCI_HCD,
      # USB_XHCI_HCD, etc.). Those symbols appear as vmlinux exports in
      # Module.symvers (from linux-image's config), so feeding that symvers
      # to modpost creates "exported twice. Previous export was in vmlinux"
      # conflicts. Skip the vmlinux-only symvers feed for this package and use
      # KBUILD_MODPOST_WARN=1: the symbols ARE in vmlinux at runtime, modpost
      # simply cannot verify them without the matching vmlinux.o when the
      # build config differs from linux-image.
      make -j"$(nproc)" modules KBUILD_MODPOST_WARN=1

      DESTDIR="/output/linux-modules-${DEVICE}"
      rm -rf "${DESTDIR}"
      mkdir -p "${DESTDIR}/DEBIAN" "${DESTDIR}/lib/modules/${KVER}"
      # modules.builtin and modules.builtin.modinfo are generated during a full
      # kernel build; a modules-only build (make modules without vmlinux) may
      # not produce them. Provide empty stubs so modules_install succeeds.
      [ -f modules.builtin ] || touch modules.builtin
      [ -f modules.builtin.modinfo ] || touch modules.builtin.modinfo
      make modules_install INSTALL_MOD_PATH="${DESTDIR}" INSTALL_MOD_STRIP=1

      if [ "${MODULE_SIGNING_ACTIVE:-}" = "yes" ]; then
        printf '%s' "${MODULE_SIGNING_KEY}" > /tmp/mod_sign.pem
        printf '%s' "${MODULE_SIGNING_CERT}" > /tmp/mod_sign.x509
        find "${DESTDIR}/lib/modules" -name "*.ko" | while IFS= read -r ko; do
          scripts/sign-file sha512 /tmp/mod_sign.pem /tmp/mod_sign.x509 "${ko}"
        done
        rm -f /tmp/mod_sign.pem /tmp/mod_sign.x509
      fi

      cp "${SAVE_PWD}/workflows/bootc-debs-builder/preinstall/output/linux-modules-x86-64/DEBIAN/control" \
        "${DESTDIR}/DEBIAN/control"
      sed -i \
        -e "s|{{ VER }}|${BUILT_VER}|g" \
        -e "s|{{ ARCH }}|${DEB_ARCH}|g" \
        -e "s|{{ KVER }}|${KVER}|g" \
        "${DESTDIR}/DEBIAN/control"

      ( cd "${DESTDIR}" && \
        find lib -type f | xargs md5sum | sed 's|lib/|/lib/|' \
        > DEBIAN/md5sums )

      dpkg-deb --build "${DESTDIR}" \
        "/debs/linux-modules-${DEVICE}_${BUILT_VER}_${DEB_ARCH}.deb"
      test -s "/debs/linux-modules-${DEVICE}_${BUILT_VER}_${DEB_ARCH}.deb" \
        || { echo "ERROR: output linux-modules-${DEVICE} deb empty" >&2; exit 1; }

  - name: ifupdown2
    upstream: ifupdown2
    sources:
      - ifupdown2postinstall
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)

      apt update
      cd /tmp
      apt-get download ifupdown2

      mkdir -p /output/ifupdown2
      dpkg-deb -R /tmp/ifupdown2_*.deb /output/ifupdown2

      ORIG_VER=$(dpkg-deb -f /tmp/ifupdown2_*.deb Version)

      cp -r "${SAVE_PWD}"/workflows/bootc-debs-builder/ifupdown2postinstall/* \
        /output/ifupdown2/

      # Regenerate md5sums after content modification
      find /output/ifupdown2 -not -path '*/DEBIAN/*' -type f \
        | xargs md5sum \
        | sed "s|/output/ifupdown2/||" \
        > /output/ifupdown2/DEBIAN/md5sums

      # Preserve +pmx suffix for pve-manager version check
      sed -i "s/^Version: .*/Version: 1:${ORIG_VER}+bootc3/" \
        /output/ifupdown2/DEBIAN/control
      chmod +x /output/ifupdown2/usr/sbin/ifupdown2-autoconf \
        /output/ifupdown2/usr/sbin/domain-set

      # Content check: version bumped and our helpers present + executable.
      grep -qF "Version: 1:${ORIG_VER}+bootc3" \
        /output/ifupdown2/DEBIAN/control \
        || { echo "ERROR: ifupdown2 version not rewritten" >&2; exit 1; }
      for s in ifupdown2-autoconf domain-set; do
        test -s "/output/ifupdown2/usr/sbin/${s}" \
          && test -x "/output/ifupdown2/usr/sbin/${s}" \
          || { echo "ERROR: ifupdown2 ${s} missing/not exec" >&2; exit 1; }
      done

      dpkg-deb --build /output/ifupdown2 \
        /debs/ifupdown2_${ORIG_VER}+bootc3_all.deb

  - name: systemd-timesyncd
    upstream: systemd-timesyncd
    sources:
      - timesyncpostinstall
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)

      apt update
      cd /tmp
      apt-get download systemd-timesyncd

      mkdir -p /output/systemd-timesyncd
      dpkg-deb -R systemd-timesyncd_*.deb /output/systemd-timesyncd

      ORIG_VER=$(dpkg-deb -f systemd-timesyncd_*.deb Version)
      ARCH=$(dpkg-deb -f systemd-timesyncd_*.deb Architecture)

      cp -r "${SAVE_PWD}"/workflows/bootc-debs-builder/timesyncpostinstall/* \
        /output/systemd-timesyncd/

      # Regenerate md5sums after content modification
      find /output/systemd-timesyncd -not -path '*/DEBIAN/*' -type f \
        | xargs md5sum \
        | sed "s|/output/systemd-timesyncd/||" \
        > /output/systemd-timesyncd/DEBIAN/md5sums

      sed -i "s/^Version: .*/Version: 1:${ORIG_VER}+bootc1/" \
        /output/systemd-timesyncd/DEBIAN/control

      # Content check: version rewritten in control.
      grep -qF "Version: 1:${ORIG_VER}+bootc1" \
        /output/systemd-timesyncd/DEBIAN/control \
        || { echo "ERROR: systemd-timesyncd version not rewritten" >&2; exit 1; }

      dpkg-deb --build /output/systemd-timesyncd \
        /debs/systemd-timesyncd_${ORIG_VER}+bootc1_${ARCH}.deb

  # grub-efi-amd64-signed is x86_64-only by nature (it builds the amd64 EFI
  # GRUB binary signed for Secure Boot). On an arm64 runner the package is
  # SKIPPED via the `when:` arch gate below, so the arm64 build does not fail
  # on a missing SB_SIGNING_KEY or an amd64-only configure target. The main
  # (non-minimal) Containerfile is x86_64-only and always runs this package
  # on an amd64 runner — zero regression.
  - name: grub-efi-amd64-signed
    when:
      # Build only when the runner's native arch is amd64. The build-env image
      # exports ARCH=$(dpkg --print-architecture) for this gate.
      arch: amd64
    sources:
      - preinstall/output/grub-efi-amd64-signed
    env:
      GRUB_VER: "1+2.12+9+fedora44"
      GRUB_FEDORA_BRANCH: fedora-44
      GRUB_PINNED_COMMIT: "5e9e7e44eddcab0174decc12c3799825e600639f"
    secret-env:
      SB_SIGNING_KEY: SB_SIGNING_KEY
      SB_SIGNING_CERT: SB_SIGNING_CERT
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      ARCH=$(dpkg --print-architecture)
      trap 'rm -f /tmp/sb.key /tmp/sb.crt' EXIT

      git clone --branch "${GRUB_FEDORA_BRANCH}" \
        https://github.com/rhboot/grub2.git /build/grub2-fedora
      cd /build/grub2-fedora
      git checkout "${GRUB_PINNED_COMMIT}"

      ./bootstrap

      # --program-transform-name renames the userspace tools grub-* -> grub2-*.
      # The Fedora source's own mkconfig scripts call grub2-probe/grub2-mkrelpath
      # internally and bootupd invokes grub2-editenv/install/mkconfig, so the
      # grub2 naming is the native, consistent one here (matching the EFI binary
      # we build from the same tree). We drop Debian's grub-common entirely.
      ./configure \
        --target=x86_64 \
        --with-platform=efi \
        --prefix=/usr \
        --sysconfdir=/etc \
        --disable-werror \
        --program-transform-name='s,grub,grub2,' \
        MAKEINFO=true

      make -j$(nproc)

      # Install the full grub userspace (grub2-* tools + x86_64-efi modules +
      # fonts + locale) into the deb. Previously the package shipped only the
      # signed EFI binary, so the installed system had no grub tooling at all and
      # bootupd could never self-update. This is the core of the fix.
      make -j$(nproc) install \
        DESTDIR=/output/grub-efi-amd64-signed \
        MAKEINFO=true

      GRUB_MODULES=" \
        all_video boot blscfg btrfs blsuki \
        cat configfile cryptodisk \
        echo ext2 f2fs fat font \
        gcry_rijndael gcry_rsa gcry_serpent \
        gcry_sha256 gcry_twofish gcry_whirlpool \
        gfxmenu gfxterm gzio \
        halt hfsplus http increment iso9660 \
        jpeg loadenv loopback linux lvm luks luks2 \
        memdisk mdraid09 mdraid1x minicmd net \
        normal part_apple part_msdos part_gpt \
        password_pbkdf2 pgp png reboot regexp \
        search search_fs_uuid search_fs_file \
        search_label serial sleep \
        squash4 syslinuxcfg \
        test tftp version video xfs zstd \
        efi_netfs efifwsetup efinet lsefi lsefimmap connectefi bli \
        backtrace chain tpm usb usbserial_common \
        usbserial_pl2303 usbserial_ftdi usbserial_usbdebug \
        keylayouts at_keyboard"

      mkdir -p \
        /output/grub-efi-amd64-signed/usr/lib/grub/x86_64-efi-signed

      ./grub-mkimage \
        -O x86_64-efi \
        -o /output/grub-efi-amd64-signed/usr/lib/grub/x86_64-efi-signed/grubx64.efi.signed \
        -d grub-core \
        -p /EFI/debian \
        ${GRUB_MODULES}

      cd /output/grub-efi-amd64-signed/
      ln -sf DEBIAN debian

      sed -i \
        -e "s|{{ VER }}|${GRUB_VER}|g" \
        DEBIAN/control
      rm -f debian

      # Sign the GRUB EFI binary with the Secure Boot signing key
      # Create key files with restrictive permissions immediately (umask 077
      # in a subshell) so they are never world-readable between creation and
      # the former chmod 600 call.
      (umask 077; echo "${SB_SIGNING_KEY}"  | base64 -d > /tmp/sb.key)
      (umask 077; echo "${SB_SIGNING_CERT}" | base64 -d > /tmp/sb.crt)

      sbsign \
        --key  /tmp/sb.key \
        --cert /tmp/sb.crt \
        --output /output/grub-efi-amd64-signed/usr/lib/grub/x86_64-efi-signed/grubx64.efi.signed \
        /output/grub-efi-amd64-signed/usr/lib/grub/x86_64-efi-signed/grubx64.efi.signed

      # Verify signature
      sbverify \
        --cert /tmp/sb.crt \
        /output/grub-efi-amd64-signed/usr/lib/grub/x86_64-efi-signed/grubx64.efi.signed \
        || { echo "ERROR: GRUB EFI signature verification failed" >&2; exit 1; }

      # Include the certificate in the package for MOK enrollment on target machines
      mkdir -p /output/grub-efi-amd64-signed/usr/share/debian-bootc
      cp /tmp/sb.crt \
        /output/grub-efi-amd64-signed/usr/share/debian-bootc/sb_signing.crt

      # Stage the signed grub where bootupd reads EFI components at install time
      # (/usr/lib/efi/<name>/<version>/EFI, cf. bootupd v0.2.35 src/efi.rs). We
      # place it under both EFI/debian (the NVRAM/vendor path bootupd points
      # efibootmgr at) and EFI/BOOT (the removable-media path): when firmware
      # boots \EFI\BOOT\BOOTX64.EFI (shim) with no NVRAM entry — e.g. a fresh VM —
      # shim only looks for grubx64.efi in its OWN directory (rhboot/shim
      # README.fallback), so grub must sit next to it there too. Paths match
      # workflows/image-tests/tests.yml.
      for _sub in debian BOOT; do
        install -Dm0644 \
          /output/grub-efi-amd64-signed/usr/lib/grub/x86_64-efi-signed/grubx64.efi.signed \
          "/output/grub-efi-amd64-signed/usr/lib/efi/grub2/${GRUB_VER}/EFI/${_sub}/grubx64.efi"
      done

      # BIOS (i386-pc) platform. bootupd's BIOS component runs
      # `grub2-install --target i386-pc` guarded on /usr/lib/grub/i386-pc, so
      # build and install that platform's modules too (a second, out-of-tree
      # build so the in-tree EFI build above is untouched). This makes legacy
      # BIOS boot actually work rather than being silently skipped. Ref: bootupd
      # v0.2.35 src/bios.rs (check_grub_modules / run_grub_install).
      # The source tree is already configured in-tree for EFI above; grub refuses
      # a second configure until it is cleaned. The EFI binary is already built,
      # signed and staged, so distclean then reconfigure the same tree for
      # i386-pc in-tree.
      make -C /build/grub2-fedora distclean
      cd /build/grub2-fedora
      ./configure \
        --target=i386 \
        --with-platform=pc \
        --prefix=/usr \
        --sysconfdir=/etc \
        --disable-werror \
        --program-transform-name='s,grub,grub2,' \
        MAKEINFO=true
      make -j$(nproc)
      make -j$(nproc) install \
        DESTDIR=/output/grub-efi-amd64-signed \
        MAKEINFO=true
      cd "${SAVE_PWD}"

      rm -f /tmp/sb.key /tmp/sb.crt

      # Content checks: the grub2 userspace and BOTH platform module sets are
      # present, and grub is staged where bootupd reads it (the signed EFI binary
      # is already verified by sbverify above).
      _o=/output/grub-efi-amd64-signed
      test -x "${_o}/usr/bin/grub2-editenv" \
        && test -x "${_o}/usr/sbin/grub2-install" \
        && test -d "${_o}/usr/lib/grub/x86_64-efi" \
        && test -d "${_o}/usr/lib/grub/i386-pc" \
        || { echo "ERROR: grub userspace/modules incomplete" >&2; exit 1; }
      compgen -G "${_o}/usr/lib/efi/grub2/*/EFI/debian/grubx64.efi" >/dev/null \
        && compgen -G "${_o}/usr/lib/efi/grub2/*/EFI/BOOT/grubx64.efi" >/dev/null \
        || { echo "ERROR: grub not staged for bootupd" >&2; exit 1; }

      chmod 755 /output/grub-efi-amd64-signed/DEBIAN/postinst
      dpkg-deb --build /output/grub-efi-amd64-signed \
        /debs/grub-efi-amd64-signed_${GRUB_VER}_${ARCH}.deb

  # grub-efi-arm64-signed mirrors grub-efi-amd64-signed for the arm64 EFI
  # GRUB binary. It produces grubaa64.efi (arm64-efi target) signed for
  # Secure Boot. No BIOS i386-pc step — arm64 is EFI-only.
  - name: grub-efi-arm64-signed
    when:
      arch: arm64
    sources:
      - preinstall/output/grub-efi-arm64-signed
    env:
      GRUB_VER: "1+2.12+9+fedora44"
      GRUB_FEDORA_BRANCH: fedora-44
      GRUB_PINNED_COMMIT: "5e9e7e44eddcab0174decc12c3799825e600639f"
    secret-env:
      SB_SIGNING_KEY: SB_SIGNING_KEY
      SB_SIGNING_CERT: SB_SIGNING_CERT
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      ARCH=$(dpkg --print-architecture)
      trap 'rm -f /tmp/sb.key /tmp/sb.crt' EXIT

      git clone --branch "${GRUB_FEDORA_BRANCH}" \
        https://github.com/rhboot/grub2.git /build/grub2-fedora
      cd /build/grub2-fedora
      git checkout "${GRUB_PINNED_COMMIT}"

      ./bootstrap

      ./configure \
        --target=aarch64 \
        --with-platform=efi \
        --prefix=/usr \
        --sysconfdir=/etc \
        --disable-werror \
        --program-transform-name='s,grub,grub2,' \
        MAKEINFO=true

      make -j$(nproc)

      make -j$(nproc) install \
        DESTDIR=/output/grub-efi-arm64-signed \
        MAKEINFO=true

      GRUB_MODULES=" \
        all_video boot blscfg btrfs blsuki \
        cat configfile cryptodisk \
        echo ext2 f2fs fat font \
        gcry_rijndael gcry_rsa gcry_serpent \
        gcry_sha256 gcry_twofish gcry_whirlpool \
        gfxmenu gfxterm gzio \
        halt hfsplus http increment iso9660 \
        jpeg loadenv loopback linux lvm luks luks2 \
        memdisk mdraid09 mdraid1x minicmd net \
        normal part_apple part_msdos part_gpt \
        password_pbkdf2 pgp png reboot regexp \
        search search_fs_uuid search_fs_file \
        search_label serial sleep \
        squash4 syslinuxcfg \
        test tftp version video xfs zstd \
        efi_netfs efifwsetup efinet lsefi lsefimmap connectefi \
        backtrace chain tpm"

      mkdir -p \
        /output/grub-efi-arm64-signed/usr/lib/grub/arm64-efi-signed

      ./grub-mkimage \
        -O arm64-efi \
        -o /output/grub-efi-arm64-signed/usr/lib/grub/arm64-efi-signed/grubaa64.efi.signed \
        -d grub-core \
        -p /EFI/debian \
        ${GRUB_MODULES}

      cd /output/grub-efi-arm64-signed/
      ln -sf DEBIAN debian

      sed -i \
        -e "s|{{ VER }}|${GRUB_VER}|g" \
        DEBIAN/control
      rm -f debian

      (umask 077; echo "${SB_SIGNING_KEY}"  | base64 -d > /tmp/sb.key)
      (umask 077; echo "${SB_SIGNING_CERT}" | base64 -d > /tmp/sb.crt)

      sbsign \
        --key  /tmp/sb.key \
        --cert /tmp/sb.crt \
        --output /output/grub-efi-arm64-signed/usr/lib/grub/arm64-efi-signed/grubaa64.efi.signed \
        /output/grub-efi-arm64-signed/usr/lib/grub/arm64-efi-signed/grubaa64.efi.signed

      sbverify \
        --cert /tmp/sb.crt \
        /output/grub-efi-arm64-signed/usr/lib/grub/arm64-efi-signed/grubaa64.efi.signed \
        || { echo "ERROR: GRUB EFI signature verification failed" >&2; exit 1; }

      mkdir -p /output/grub-efi-arm64-signed/usr/share/debian-bootc
      cp /tmp/sb.crt \
        /output/grub-efi-arm64-signed/usr/share/debian-bootc/sb_signing.crt

      # Stage where bootupd reads EFI components: EFI/debian (NVRAM vendor path)
      # and EFI/BOOT (removable-media fallback). BOOTAA64.EFI is the arm64
      # fallback name (analogous to BOOTX64.EFI on amd64).
      for _sub in debian BOOT; do
        install -Dm0644 \
          /output/grub-efi-arm64-signed/usr/lib/grub/arm64-efi-signed/grubaa64.efi.signed \
          "/output/grub-efi-arm64-signed/usr/lib/efi/grub2/${GRUB_VER}/EFI/${_sub}/grubaa64.efi"
      done
      # Provide the standard fallback name for firmware that looks for BOOTAA64.EFI.
      install -Dm0644 \
        /output/grub-efi-arm64-signed/usr/lib/grub/arm64-efi-signed/grubaa64.efi.signed \
        "/output/grub-efi-arm64-signed/usr/lib/efi/grub2/${GRUB_VER}/EFI/BOOT/BOOTAA64.EFI"

      rm -f /tmp/sb.key /tmp/sb.crt

      _o=/output/grub-efi-arm64-signed
      test -x "${_o}/usr/bin/grub2-editenv" \
        && test -x "${_o}/usr/sbin/grub2-install" \
        && test -d "${_o}/usr/lib/grub/arm64-efi" \
        || { echo "ERROR: grub userspace/modules incomplete" >&2; exit 1; }
      compgen -G "${_o}/usr/lib/efi/grub2/*/EFI/debian/grubaa64.efi" >/dev/null \
        && compgen -G "${_o}/usr/lib/efi/grub2/*/EFI/BOOT/grubaa64.efi" >/dev/null \
        || { echo "ERROR: grubaa64.efi not staged for bootupd" >&2; exit 1; }

      chmod 755 /output/grub-efi-arm64-signed/DEBIAN/postinst
      dpkg-deb --build /output/grub-efi-arm64-signed \
        /debs/grub-efi-arm64-signed_${GRUB_VER}_${ARCH}.deb

  - name: bootupd
    sources:
      - preinstall/output/bootupd
      - patches/bootupd-0.2.35-dpkg.patch
    env:
      CARGO_HOME: "/build/rust"
      RUSTUP_HOME: "/build/rust"
      BOOTUPD_VER: "v0.2.35"
      BOOTUPD_VENDOR_SHA256: "7ada7d0c9d1facb4c5a138e1b014191971b8e97a2fca690b86357e9888584e8b"
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      ARCH=$(dpkg --print-architecture)
      rm -rf /build/vendor && mkdir /build/vendor

      git clone --depth=1 --branch "${BOOTUPD_VER}" \
        https://github.com/coreos/bootupd.git /build/bootupd

      # Debian port: bootupd upstream reads the rpm database for bootloader
      # package metadata (packagesystem::query_files); Debian has none. Patch it
      # to fall back to dpkg so the BIOS component's generate-update-metadata
      # works here instead of crashing. The rpm path stays intact for Fedora.
      git -C /build/bootupd apply \
        "${SAVE_PWD}/workflows/bootc-debs-builder/patches/bootupd-0.2.35-dpkg.patch"

      curl --retry 3 -fsSL \
        "https://github.com/coreos/bootupd/releases/download/${BOOTUPD_VER}/bootupd-${BOOTUPD_VER#v}-vendor.tar.zstd" \
        -o /tmp/bootupd-vendor.tar.zstd
      printf '%s  /tmp/bootupd-vendor.tar.zstd\n' "${BOOTUPD_VENDOR_SHA256}" \
        | sha256sum -c -
      tar --zstd -x -C /build/ -f /tmp/bootupd-vendor.tar.zstd

      . ${RUSTUP_HOME}/env
      cargo build --release --manifest-path /build/bootupd/Cargo.toml

      # Content check on the applied dpkg patch: the patch adds a unit test that
      # exercises query_files_dpkg against a real dpkg-owned file, so a patch that
      # compiles but behaves wrong fails HERE. Require it to actually run (>=1
      # passed) so a vacuous "0 tests" can't pass silently. On failure the build
      # aborts; CI then keeps the last-good bootupd deb and opens an issue instead
      # of shipping a broken package.
      chk=$(cargo test --release --manifest-path /build/bootupd/Cargo.toml \
        query_files_dpkg 2>&1) || { printf '%s\n' "${chk}"; exit 1; }
      printf '%s\n' "${chk}"
      printf '%s\n' "${chk}" \
        | grep -qE 'test result: ok\. [1-9][0-9]* passed' \
        || { echo "ERROR: dpkg patch content check did not run" >&2; exit 1; }

      make -C /build/bootupd install-all DESTDIR=/output/bootupd

      cd /output/bootupd/
      ln -sf DEBIAN debian

      dpkg-shlibdeps \
        -O /build/bootupd/target/release/bootupd \
        | sed 's/shlibs:Depends=//' > /tmp/bootupd-deps

      DEPS="$(cat /tmp/bootupd-deps), util-linux"
      GRUB_ARCH="${ARCH}"
      sed -i \
        -e "s|{{ VER }}|${BOOTUPD_VER#v}|g" \
        -e "s|{{ DEPS }}|${DEPS}|g" \
        -e "s|{{ ARCH }}|${ARCH}|g" \
        -e "s|{{ GRUB_ARCH }}|${GRUB_ARCH}|g" \
        /output/bootupd/DEBIAN/control

      # Content check: the built bootupd binary exists (its patched dpkg
      # behaviour is validated by cargo test above).
      _b=$(find /output/bootupd -type f -name bootupd | head -1)
      test -n "${_b}" && test -s "${_b}" \
        || { echo "ERROR: bootupd binary missing from output" >&2; exit 1; }

      rm -f /output/bootupd/debian
      dpkg-deb --build /output/bootupd /debs/bootupd_${BOOTUPD_VER#v}_${ARCH}.deb

  - name: libcomposefs
    sources:
      - preinstall/output/libcomposefs
    env:
      COMPOSEFS_VER: "v1.0.8"
    build: |
      set -euo pipefail
      ARCH=$(dpkg --print-architecture)
      git clone --depth=1 --branch "${COMPOSEFS_VER}" \
        https://github.com/composefs/composefs.git /build/composefs

      meson setup \
        --prefix=/usr \
        --libdir=/usr/lib \
        --buildtype=plain \
        /build/composefs-build \
        /build/composefs

      meson compile -C /build/composefs-build

      # Install to DESTDIR for packaging
      DESTDIR=/output/libcomposefs meson install -C /build/composefs-build

      # Install to system so ostree build finds it
      meson install -C /build/composefs-build

      cd /output/libcomposefs/
      ln -sf DEBIAN debian

      # Generate shlibs
      SO=$(find /output/libcomposefs/usr/lib -name "libcomposefs.so.*" ! -type l | head -1)
      SONAME=$(objdump -p $SO | awk '/SONAME/{print $2}')
      LIBBASE=$(echo $SONAME | sed 's/\.so\..*//')
      SOVERSION=$(echo $SONAME | sed 's/.*\.so\.//')
      echo "${LIBBASE} ${SOVERSION} libcomposefs" > /output/libcomposefs/DEBIAN/shlibs

      # Content check: the shared library built and its SONAME resolved.
      test -s "${SO}" && test -n "${SONAME}" \
        || { echo "ERROR: libcomposefs.so not built or SONAME unresolved" >&2; exit 1; }

      sed -i \
        -e "s|{{ VER }}|${COMPOSEFS_VER#v}|g" \
        -e "s|{{ ARCH }}|${ARCH}|g" \
        DEBIAN/control

      rm -f debian
      dpkg-deb --build /output/libcomposefs \
        /debs/libcomposefs_${COMPOSEFS_VER#v}_${ARCH}.deb

      # Install into the build environment so dpkg-shlibdeps can resolve libcomposefs
      # when building the ostree package in the next step.
      apt install -y /debs/libcomposefs_${COMPOSEFS_VER#v}_${ARCH}.deb

  - name: ostree
    deps:
      - libcomposefs
    deb-glob: "libostree_*"
    sources:
      - preinstall/output/ostree
      - ostreepostinstall
    env:
      CARGO_HOME: "/build/rust"
      RUSTUP_HOME: "/build/rust"
      OSTREE_VER: "2026.1"
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      ARCH=$(dpkg --print-architecture)
      rm -rf /build/vendor && mkdir /build/vendor

      curl -fsSL \
        https://github.com/ostreedev/ostree/releases/download/v${OSTREE_VER}/libostree-${OSTREE_VER}.tar.xz \
        | tar -xJ -C /build
      cd /build/libostree-${OSTREE_VER}

      ./configure --prefix=/usr --sysconfdir=/etc \
        --disable-gtk-doc --disable-man \
        --with-composefs \
        --with-systemdsystemunitdir=/usr/lib/systemd/system \
        --with-systemdsystemgeneratordir=/usr/lib/systemd/system-generators \
        --with-dracut

      make -j$(nproc)
      make -j$(nproc) install DESTDIR=/output/ostree

      # Verify and fail loudly if missing
      test -d /output/ostree/usr/lib/dracut/modules.d/50ostree \
        || { echo "ERROR: 50ostree dracut module missing from build output" >&2; exit 1; }
      test -f /output/ostree/usr/lib/systemd/system-generators/ostree-system-generator \
        || { echo "ERROR: ostree-system-generator missing from build output" >&2; exit 1; }

      cd /output/ostree/
      ln -sf DEBIAN debian

      dpkg-shlibdeps \
        -l/output/ostree/usr/lib \
        -O $(find . -name "libostree-1.so*" ! -name "*.la" | head -1) \
        | sed 's/shlibs:Depends=//' > /tmp/ostree-deps

      SO=$(find /output/ostree/usr/lib -name "libostree-1.so.*" ! -name "*.la" ! -type l | head -1)
      SONAME=$(objdump -p $SO | awk '/SONAME/{print $2}')
      LIBBASE=$(echo $SONAME | sed 's/\.so\..*//')
      SOVERSION=$(echo $SONAME | sed 's/.*\.so\.//')
      echo "${LIBBASE} ${SOVERSION} libostree" > /output/ostree/DEBIAN/shlibs

      # Content check: the libostree shared object built (complements the dracut
      # module and system-generator checks above).
      test -s "${SO}" && test -n "${SONAME}" \
        || { echo "ERROR: libostree.so not built or SONAME unresolved" >&2; exit 1; }

      DEPS=$(cat /tmp/ostree-deps)
      sed -i \
        -e "s|{{ VER }}|${OSTREE_VER}|g" \
        -e "s|{{ DEPS }}|${DEPS}|g" \
        -e "s|{{ ARCH }}|${ARCH}|g" \
        /output/ostree/DEBIAN/control
      cp -r "${SAVE_PWD}"/workflows/bootc-debs-builder/ostreepostinstall/* /output/ostree/

      rm -f /output/ostree/debian
      dpkg-deb --build /output/ostree /debs/libostree_${OSTREE_VER}_${ARCH}.deb
      apt install -y /debs/libostree_${OSTREE_VER}_${ARCH}.deb

  - name: bootc
    deps:
      - ostree
    sources:
      - preinstall/output/bootc
      - bootcpostinstall
    env:
      CARGO_HOME: "/build/rust"
      RUSTUP_HOME: "/build/rust"
      BOOTC_VER: "v1.16.2"
      BOOTC_VENDOR_SHA256: "53d759ca521144a675af67e68d23c3f5f18dca784e4e900052d0cfdc4467732b"
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      ARCH=$(dpkg --print-architecture)
      rm -rf /build/vendor && mkdir /build/vendor

      git clone --depth=1 --branch "${BOOTC_VER}" \
        https://github.com/bootc-dev/bootc.git /build/bootc

      curl -fsSL \
        "https://github.com/bootc-dev/bootc/releases/download/${BOOTC_VER}/bootc-${BOOTC_VER#v}-vendor.tar.zstd" \
        -o /tmp/bootc-vendor.tar.zstd
      printf '%s  /tmp/bootc-vendor.tar.zstd\n' "${BOOTC_VENDOR_SHA256}" \
        | sha256sum -c -
      tar --zstd -x -C /build/ -f /tmp/bootc-vendor.tar.zstd

      . ${RUSTUP_HOME}/env
      cargo build --release --manifest-path /build/bootc/Cargo.toml

      make -j$(nproc) -C /build/bootc manpages DESTDIR=/output/bootc
      make -C /build/bootc install-all DESTDIR=/output/bootc

      cd /output/bootc/
      ln -sf DEBIAN debian

      dpkg-shlibdeps \
        -l/output/ostree/usr/lib \
        -l/output/bootc/usr/lib \
        -S/output/ostree \
        -O /build/bootc/target/release/bootc \
        | sed 's/shlibs:Depends=//' > /tmp/bootc-deps

      DEPS=$(cat /tmp/bootc-deps)
      sed -i \
        -e "s|{{ VER }}|${BOOTC_VER#v}|g" \
        -e "s|{{ DEPS }}|${DEPS}|g" \
        -e "s|{{ ARCH }}|${ARCH}|g" \
        /output/bootc/DEBIAN/control
      cp -r "${SAVE_PWD}"/workflows/bootc-debs-builder/bootcpostinstall/* /output/bootc/

      chmod 755 \
        /output/bootc/DEBIAN/postinst \
        /output/bootc/usr/local/bin/bootc-finalize \
        /output/bootc/etc/kernel/postinst.d/zz-bootc-finalize

      # Content check: the bootc binary built and our finalize helper +
      # autonomous kernel hook are valid. The hook is what makes the kernel
      # relocation propagate to any downstream image with no Containerfile
      # change, so a broken hook must fail the build.
      test -s /build/bootc/target/release/bootc \
        || { echo "ERROR: bootc binary not built" >&2; exit 1; }
      bash -n /output/bootc/usr/local/bin/bootc-finalize \
        || { echo "ERROR: bootc-finalize script broken" >&2; exit 1; }
      sh -n /output/bootc/etc/kernel/postinst.d/zz-bootc-finalize \
        || { echo "ERROR: zz-bootc-finalize kernel hook broken" >&2; exit 1; }
      test -x /output/bootc/etc/kernel/postinst.d/zz-bootc-finalize \
        || { echo "ERROR: zz-bootc-finalize kernel hook not executable" >&2; exit 1; }

      rm -f /output/bootc/debian
      dpkg-deb --build /output/bootc /debs/bootc_${BOOTC_VER#v}_${ARCH}.deb

  # ===========================================================================
  # fisherman — Go CLI backend for bootc OS installation.
  # CGO_ENABLED=0 → fully static binary, no libc dependency.
  # go.sum is empty (zero external deps); build is pure stdlib + internal pkgs.
  # Pinned to a specific commit; bump FISHERMAN_COMMIT + FISHERMAN_VER together.
  # ===========================================================================
  - name: fisherman
    sources:
      - preinstall/output/fisherman
    env:
      FISHERMAN_COMMIT: "4dc8f1cca20e9808c123ed95e572f9106a9be18e"
      FISHERMAN_VER: "0.3.0+git4dc8f1c"
    build: |
      set -euo pipefail
      ARCH=$(dpkg --print-architecture)
      GOARCH="${ARCH}"

      # Install Go from Debian (Trixie ships golang-go >= 1.22 which fisherman
      # requires; fail fast with a version check before touching the source).
      apt-get update
      apt-get install -y --no-install-recommends golang-go
      go_ver=$(go version | awk '{print $3}' | sed 's/go//')
      go_major=$(printf '%s' "${go_ver}" | cut -d. -f1)
      go_minor=$(printf '%s' "${go_ver}" | cut -d. -f2)
      if [ "${go_major}" -lt 1 ] || { [ "${go_major}" -eq 1 ] && [ "${go_minor}" -lt 22 ]; }; then
        echo "ERROR: Go ${go_ver} < 1.22 (fisherman requires go 1.22)" >&2; exit 1
      fi
      go version

      # Clone fisherman at the pinned commit. Full clone (no --depth=1) so a
      # bare commit SHA can be checked out regardless of branch position.
      git clone https://github.com/tuna-os/fisherman.git /build/fisherman-src
      git -C /build/fisherman-src checkout "${FISHERMAN_COMMIT}"

      # Build — CGO_ENABLED=0 gives a fully static binary.
      CGO_ENABLED=0 GOARCH="${GOARCH}" go build \
        -C /build/fisherman-src/fisherman \
        -ldflags "-s -w -X main.version=${FISHERMAN_VER}" \
        -o /tmp/fisherman-bin \
        ./cmd/fisherman

      # Stage the binary and polkit policy into the output tree.
      install -Dm755 /tmp/fisherman-bin \
        /output/fisherman/usr/local/bin/fisherman
      install -Dm644 \
        /build/fisherman-src/data/polkit/org.tunaos.Installer.policy \
        /output/fisherman/usr/share/polkit-1/actions/org.tunaos.Installer.policy

      # Validate: binary runs and reports version.
      /output/fisherman/usr/local/bin/fisherman version 2>/dev/null \
        | grep -q "fisherman" \
        || { echo "ERROR: fisherman version check failed" >&2; exit 1; }

      sed -i \
        -e "s|{{ VER }}|${FISHERMAN_VER}|g" \
        -e "s|{{ ARCH }}|${ARCH}|g" \
        /output/fisherman/DEBIAN/control

      dpkg-deb --build /output/fisherman \
        "/debs/fisherman_${FISHERMAN_VER}_${ARCH}.deb"

      test -s "/debs/fisherman_${FISHERMAN_VER}_${ARCH}.deb" \
        || { echo "ERROR: fisherman deb empty or missing" >&2; exit 1; }

  # ===========================================================================
  # bootc-installer — GTK4/Libadwaita/Python3 graphical frontend for fisherman.
  # Meson build with blueprint-compiler for the .blp UI sources.
  # Architecture-independent (Python + GResources), but tied to the fisherman
  # dep which IS arch-specific, so we build on the target arch runner.
  # ===========================================================================
  - name: bootc-installer
    deps:
      - fisherman
    sources:
      - preinstall/output/bootc-installer
    env:
      BOOTC_INSTALLER_COMMIT: "0290d4fb469a3a6fd8114a28f1eb429db8b6e2e5"
      BOOTC_INSTALLER_VER: "3.0.0+git0290d4f+bootc4"
    build: |
      set -euo pipefail
      ARCH=$(dpkg --print-architecture)

      # Build deps: meson/ninja are in the buildenv; add blueprint-compiler and
      # the GTK4/Adwaita/GnomeDesktop/GWeather dev headers for meson introspection.
      apt-get update
      apt-get install -y --no-install-recommends \
        blueprint-compiler \
        libgtk-4-dev \
        libadwaita-1-dev \
        libgnome-desktop-4-dev \
        libgweather-4-dev \
        libnm-dev \
        appstream \
        desktop-file-utils

      # Clone at the pinned commit (shallow not possible with a bare commit SHA).
      git clone https://github.com/frostyard/bootc-installer.git /build/bootc-installer-src
      git -C /build/bootc-installer-src checkout "${BOOTC_INSTALLER_COMMIT}"

      # The fisherman submodule contains data/images/ (distribution logos) that
      # bootc-installer.gresource.xml references at build time. Initialize it so
      # those image files are available. The fisherman binary itself is NOT built
      # (build-fisherman=false) — we package it separately — but the data dir is needed.
      git -C /build/bootc-installer-src submodule update --init fisherman

      # Override images.json with our DaemonCores recipe so bootc-installer
      # shows our images rather than the upstream defaults.
      cp /build/bootc-installer-src/recipe.json \
        /build/bootc-installer-src/fisherman/data/images.json

      # Build with meson. build-fisherman=false: we package fisherman separately.
      meson setup \
        --prefix=/usr \
        -Dbuild-fisherman=false \
        /build/bootc-installer-build \
        /build/bootc-installer-src

      meson compile -C /build/bootc-installer-build

      # Install to DESTDIR for packaging.
      DESTDIR=/output/bootc-installer \
        meson install -C /build/bootc-installer-build

      # Content check: the installed launcher and GResource bundle exist.
      test -x /output/bootc-installer/usr/bin/bootc-installer \
        || { echo "ERROR: bootc-installer launcher missing" >&2; exit 1; }
      _res=$(find /output/bootc-installer/usr -name "*.gresource" | head -1)
      test -n "${_res}" && test -s "${_res}" \
        || { echo "ERROR: bootc-installer GResource bundle missing" >&2; exit 1; }

      sed -i \
        -e "s|{{ VER }}|${BOOTC_INSTALLER_VER}|g" \
        /output/bootc-installer/DEBIAN/control

      cd /output/bootc-installer
      # dpkg-deb has a tar buffer-reuse bug that corrupts filenames starting at
      # entry ~172 when the package has many locale files (the Turkish locale dir
      # `tr/` gets the prior entry's `tl/` buffer prefix, breaking the tar).
      # Assemble the deb manually with system tar + ar to bypass that code path.
      find . -not -path './DEBIAN' -not -path './DEBIAN/*' -type f \
        | LC_ALL=C sort | xargs md5sum \
        | sed 's|^\([0-9a-f]*\)  \./|\1  |' \
        > ./DEBIAN/md5sums
      tar --owner=0 --group=0 --numeric-owner \
        --exclude=./DEBIAN -czf /tmp/data.tar.gz .
      tar --owner=0 --group=0 --numeric-owner \
        -czf /tmp/control.tar.gz -C ./DEBIAN .
      printf '2.0\n' > /tmp/debian-binary
      ar qc "/debs/bootc-installer_${BOOTC_INSTALLER_VER}_all.deb" \
        /tmp/debian-binary /tmp/control.tar.gz /tmp/data.tar.gz

      test -s "/debs/bootc-installer_${BOOTC_INSTALLER_VER}_all.deb" \
        || { echo "ERROR: bootc-installer deb empty or missing" >&2; exit 1; }

