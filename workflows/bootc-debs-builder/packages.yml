# Package manifest for the bootc .deb builder. Last forced rebuild: 2026-10-16.
# One entry per package. Consumed by the generic bootc-debs-builder workflow
# (setup computes dependency waves) and by the build-one-deb reusable workflow.
#   name       logical package name
#   upstream   apt package to repack (omit for from-source / custom packages)
#   deps       packages that must be built+installed first (creates a wave)
#   sources    paths under workflows/bootc-debs-builder/ hashed for change
#   deb-glob   output deb glob when it differs from <name>_*
#   ccache     true = restore/save a compiler object cache across runs (kernel builds)
#   env        non-secret KEY: VALUE exported for the build (also hashed)
#   secret-env ENV_VAR: SECRET_NAME injected from secrets (never hashed)
#   build      the exact build script, verbatim
#
# Package CLASSES (format of DaemonCores-VE f88ad30): entries with a
# `variants:` block (same mechanism as the kernel entries) expand one build
# script across every package of the class — zero duplicated YAML. The
# manifest-expand action (DaemonCores-CI) resolves each variant into a plain
# package entry named <class-name>-<variant> (name = prefix + key).
#
# Shared deb logic: DaemonCores-CI scripts/deb_helpers.sh, imported
# implicitly once per build by build-deb.sh (build-deb/build-deb.sh sources
# it and exports CI_SCRIPTS) — no helper import appears in the build blocks;
# strict mode (-euo pipefail) is enforced by the builder. The overlay model:
# package dirs mirror the deb tree (variant-source: "{variant}" hashes each
# mirror). HELPERS_VER is hashed per class entry; bump it whenever
# deb_helpers.sh changes (other repository, invisible to the content hash).
packages:
  # ===========================================================================
  # Kernel packages — the PROFILE kernel estate ONLY (owner order 05/11:
  # the GÉNÉRIQUE baseline kernels are DELETED — the linux-image entry with
  # its 8 generic variants (x64v1 plain, -x64v2..v4, the 3 arm flavours and
  # -16k) is gone; kernels = ONLY linux-image-profile below).
  # PAGE SIZE = PER ARCHITECTURE, never per device (owner order 05/11 18:3x):
  # the default page size lives INSIDE the arch entries — armv8.2-lse and
  # armv9-sve2 are 16 KB (ARM64_16K_PAGES=y, Cortex-A76+ class: TLB-pressure
  # gains on multi-GB LLM), armv8.0 stays 4 KB AUTOMATICALLY (its Cortex-A53
  # class does not support the 16 KB granule — TGran16 absent). x86_64
  # falls back automatically too: the mainline x86 tree carries no 16 KB
  # base page at all (PAGE_SHIFT 12 is fixed; the pages/* overlays are the
  # arm64 ARM64_*_PAGES Kconfig choice), so its builds merge no page overlay
  # — the fallback is DETECTED, never hand-picked. Device names (rpi3/rpi5/rk3588/...) NEVER
  # appear in a kernel entry; they live only in the device MODULE overlays
  # (kernel-src/modules/embeded/*.cfg, the linux-modules-arm-device debs).
  # The kernel (vmlinuz + common modules) and the per-flavour headers are
  # compiled here; no separate page-size entry exists anywhere.
  # ===========================================================================
  # linux-image-profile — the TWO kernel PROFILES of the unified
  # estate (owner FINAL architecture, 2026-11-05; VM placement CORRECTED
  # owner 05/11 15:1x): 7 flavours × 2 profiles = 14 deb lanes, ALL on this
  # debian side. The flavours are the lane's own matrix (x64v1..v4 amd64,
  # armv8.0 / armv8.2-lse / armv9-sve2 arm64). VM has NOTHING to do with the
  # GPU overlays — the GPU tree is only modules/gpu/{ia,gaming} (ia compute
  # = DC off; gaming display = DC on, and gaming stays a MODULE-level set):
  #   - IA  (AI compute hosts): the gpu/ia overlay merged LAST in the kernel
  #     config — CONFIG_DRM_AMD_DC off + HSA/KFD on — and the THP=always pin
  #     STANDS (the x86-common/base ALWAYS pin wins the merge).
  #   - VM  (PVE hosts): NO gpu overlay AT ALL (VM ≠ GPU, jamais eu). The
  #     VM profile delta = kconfig only: the THP NEVER fragment
  #     (kernel-src/kconfig/thp/never.cfg — the hugepage decision belongs to
  #     the GUEST via PVE memory 2M/1G, host THP=never) + the hypervisor
  #     opts already folded in the base config (the virtio/paravirt block).
  #     It carries plain amdgpu (no DC pin either way).
  # Naming is EXPLICIT per profile, never merged: expanded entry names
  # linux-image-<profile>-<flavour>, deb names
  # linux-image-common-<profile>-<flavour>, kernel build-tree paths
  # /usr/lib/linux-kernel-build-<profile>-<flavour> (no unpack collision),
  # packages daemoncores-kernel-<profile>-<KVER>. The RELEASE string stays
  # the plain flavour string (7.2.15-<flavour>-xanmod1 — no -pve, no
  # -<profile>) so the vermagic is identical across the estate; the profile
  # identity lives in the PACKAGING only (owner 05/11 midi). The profile
  # packages provide the virtual linux-image-<KVER> (satisfying the zfs
  # module pair Depends) and conflict with the plain kernel deb and the
  # sibling profile — one kernel of one release string per host.
  # gaming is NOT a profile of this lane: the gaming concept stays a
  # MODULE-level set only (the gpu-gaming debs) — never a gaming-kernel.
  # Headers + build tree (owner 05/11: the baseline lane is DELETED): the
  # per-flavour linux-headers deb is republished by THIS class, one per
  # (profile, flavour) — the release string is shared across the profiles of
  # a flavour, so the headers Package name carries the profile prefix
  # (linux-headers-<profile>-<KVER>) to stay distinct in the APT pool; the
  # Module.symvers + .config build tree already ships inside the kernel deb
  # (per-profile, no collision). The profile delta touches amdgpu/THP only
  # (the zfs/nvidia module ABI of the two builds is identical):
  # linux-modules-* Depends on the virtual linux-image-<KVER> (= version),
  # which EVERY profile build Provides — one module pair installs under
  # either profile of a flavour. The kernel build vercount follows the lane
  # pin: KERNEL_BUILD_VER untouched (owner order: no cache rebump).
  - name: linux-image-profile
    ccache: true
    variant-name-prefix: linux-image-
    variant-env: PROFILE_FLAVOUR
    env:
      # Kernel build primitives changed (10/11: kernel_dryrun_patches, the
      # election gate, landed in kernel_helpers.sh).
      HELPERS_VER: 8
      # ENTRY-LEVEL PAGE SIZE DEFAULT = 16 KB EVERYWHERE (owner order
      # 05/11 18:4x) — including amd64; the 4 KB is ONLY the AUTOMATIC
      # fallback of an arch that cannot carry the 16 KB granule (armv8.0,
      # Cortex-A53 class), declared by that arch's variants below, never
      # hand-picked. x86_64 mainline exposes no 16 KB base page at all
      # (PAGE_SHIFT 12 fixed; the pages/* overlays are the arm64
      # ARM64_*_PAGES Kconfig choice), so the amd64 build merges no page
      # overlay and falls back automatically — documented, not chosen.
      KERNEL_PAGES: "16k"
      KERNEL_SIGNING_ENFORCE: "no"
      # KERNEL VERSION = THE ELECTION, NEVER A CONSTANT (owner order
      # 2026-11-10): the `track:` resolution elects the newest kernel.org
      # stable/longterm release whose FULL patch set (the engine's shared +
      # pve + linux-tree gpu manifests) passes the fuzz-0 dry-run on the
      # real tarball tree — the latest-passing-gate. The retired
      # TEMPORARY KERNEL PIN (2026-11-04, the bore sibling run 41762298671)
      # is gone FOR GOOD together with its `series:` anchor: a patch that
      # dry-runs but does not compile is a documented K-PORT, never a pin.
      # The tarball digest is read from kernel.org sha256sums.asc at each
      # build (it is the election's own verification, not a pin).
    track:
      KERNEL_VER:
        kernel-org: stable
        require-patches: engine
        digests:
          KERNEL_SHA256: "linux-{version}.tar.xz"
    deb-glob: "linux-image-common-*"
    sources:
      # The IA gpu overlay and the profile THP fragments of this repo: a
      # profile change rebuilds only the touched profile's variants. (VM
      # carries NO gpu data — VM ≠ GPU, owner correction 05/11 15:1x.)
      - kernel-src/modules/gpu/ia
      - kernel-src/kconfig/thp
    secret-env:
      SB_SIGNING_KEY: SB_SIGNING_KEY
      SB_SIGNING_CERT: SB_SIGNING_CERT
    variants:
      # ---- IA profile: the AI compute kernel (DC off, THP always) --------
      "ia-x64v1":
        when: {arch: amd64}
        deb-glob: "linux-image-common-ia-x64v1_*"
        env: {KERNEL_PROFILE: ia, KERNEL_ARCH_LEVEL: x64v1, KERNEL_SUFFIX: "-ia-x64v1"}
      "ia-x64v2":
        when: {arch: amd64}
        deb-glob: "linux-image-common-ia-x64v2_*"
        env: {KERNEL_PROFILE: ia, KERNEL_ARCH_LEVEL: x64v2, KERNEL_SUFFIX: "-ia-x64v2"}
      "ia-x64v3":
        when: {arch: amd64}
        deb-glob: "linux-image-common-ia-x64v3_*"
        env: {KERNEL_PROFILE: ia, KERNEL_ARCH_LEVEL: x64v3, KERNEL_SUFFIX: "-ia-x64v3"}
      "ia-x64v4":
        when: {arch: amd64}
        deb-glob: "linux-image-common-ia-x64v4_*"
        env: {KERNEL_PROFILE: ia, KERNEL_ARCH_LEVEL: x64v4, KERNEL_SUFFIX: "-ia-x64v4"}
      "ia-armv8.0":
        when: {arch: arm64}
        deb-glob: "linux-image-common-ia-armv8.0_*"
        env: {KERNEL_PROFILE: ia, KERNEL_ARCH_LEVEL: armv8.0, KERNEL_SUFFIX: "-ia-armv8.0", KERNEL_PAGES: "4k"}
      "ia-armv8.2-lse":
        when: {arch: arm64}
        deb-glob: "linux-image-common-ia-armv8.2-lse_*"
        env: {KERNEL_PROFILE: ia, KERNEL_ARCH_LEVEL: armv8.2-lse, KERNEL_SUFFIX: "-ia-armv8.2-lse"}
      "ia-armv9-sve2":
        when: {arch: arm64}
        deb-glob: "linux-image-common-ia-armv9-sve2_*"
        env: {KERNEL_PROFILE: ia, KERNEL_ARCH_LEVEL: armv9-sve2, KERNEL_SUFFIX: "-ia-armv9-sve2"}
      # ---- VM profile: the PVE-host kernel (NO gpu overlay — VM ≠ GPU,
      # owner 05/11 15:1x; the profile delta = the THP NEVER fragment +
      # the hypervisor opts folded in the base config) --------------------
      "vm-x64v1":
        when: {arch: amd64}
        deb-glob: "linux-image-common-vm-x64v1_*"
        env: {KERNEL_PROFILE: vm, KERNEL_ARCH_LEVEL: x64v1, KERNEL_SUFFIX: "-vm-x64v1"}
      "vm-x64v2":
        when: {arch: amd64}
        deb-glob: "linux-image-common-vm-x64v2_*"
        env: {KERNEL_PROFILE: vm, KERNEL_ARCH_LEVEL: x64v2, KERNEL_SUFFIX: "-vm-x64v2"}
      "vm-x64v3":
        when: {arch: amd64}
        deb-glob: "linux-image-common-vm-x64v3_*"
        env: {KERNEL_PROFILE: vm, KERNEL_ARCH_LEVEL: x64v3, KERNEL_SUFFIX: "-vm-x64v3"}
      "vm-x64v4":
        when: {arch: amd64}
        deb-glob: "linux-image-common-vm-x64v4_*"
        env: {KERNEL_PROFILE: vm, KERNEL_ARCH_LEVEL: x64v4, KERNEL_SUFFIX: "-vm-x64v4"}
      "vm-armv8.0":
        when: {arch: arm64}
        deb-glob: "linux-image-common-vm-armv8.0_*"
        env: {KERNEL_PROFILE: vm, KERNEL_ARCH_LEVEL: armv8.0, KERNEL_SUFFIX: "-vm-armv8.0", KERNEL_PAGES: "4k"}
      "vm-armv8.2-lse":
        when: {arch: arm64}
        deb-glob: "linux-image-common-vm-armv8.2-lse_*"
        env: {KERNEL_PROFILE: vm, KERNEL_ARCH_LEVEL: armv8.2-lse, KERNEL_SUFFIX: "-vm-armv8.2-lse"}
      "vm-armv9-sve2":
        when: {arch: arm64}
        deb-glob: "linux-image-common-vm-armv9-sve2_*"
        env: {KERNEL_PROFILE: vm, KERNEL_ARCH_LEVEL: armv9-sve2, KERNEL_SUFFIX: "-vm-armv9-sve2"}
    build: |
      set -euo pipefail

      SAVE_PWD=$(pwd)
      DEB_ARCH=$(dpkg --print-architecture)
      case "${DEB_ARCH}" in amd64) ARCH=x86 ;; *) ARCH="${DEB_ARCH}" ;; esac
      BASE_CONFIG="${CI_KERNEL_SHARED}/config"
      test -f "${BASE_CONFIG}" \
        || { echo "ERROR: engine kernel-shared/config (base) missing" >&2; exit 1; }
      # PROFILE delta of this variant (ia | vm) — merged after the base
      # config, the profile is the final word of the merge. IA = the gpu/ia
      # overlay (AMD64 only — the arm64 flavours carry no amdgpu); VM = the
      # THP NEVER kconfig fragment ONLY (VM ≠ GPU, owner correction 05/11
      # 15:1x; the hypervisor opts — virtio/paravirt — are folded in the
      # base config, never a gpu file).
      PROFILE_GPU_DIR="${GITHUB_WORKSPACE:-$(pwd)}/workflows/bootc-debs-builder/kernel-src/modules/gpu/${KERNEL_PROFILE}"
      case "${KERNEL_PROFILE}" in
        vm) PROFILE_THP="${GITHUB_WORKSPACE:-$(pwd)}/workflows/bootc-debs-builder/kernel-src/kconfig/thp/never.cfg" ;;
        *)  PROFILE_THP="${GITHUB_WORKSPACE:-$(pwd)}/workflows/bootc-debs-builder/kernel-src/kconfig/thp/always.cfg" ;;
      esac
      test -f "${PROFILE_THP}" \
        || { echo "ERROR: profile THP fragment kernel-src/kconfig/thp/${KERNEL_PROFILE} missing" >&2; exit 1; }
      case "${DEB_ARCH}:${KERNEL_PROFILE}" in
        amd64:ia)
          test -d "${PROFILE_GPU_DIR}" \
            || { echo "ERROR: profile overlay kernel-src/modules/gpu/${KERNEL_PROFILE} missing" >&2; exit 1; }
          PROFILE_GPU_CFGS=("${PROFILE_GPU_DIR}"/*.cfg)
          test -s "${PROFILE_GPU_CFGS[0]}" \
            || { echo "ERROR: profile overlay ${KERNEL_PROFILE} carries no .cfg fragment" >&2; exit 1; }
          ;;
      esac

      apt-get update
      apt-get install -y --no-install-recommends \
        build-essential libncurses-dev bison flex libssl-dev libelf-dev bc \
        rsync libudev-dev elfutils dpkg-dev \
        debhelper kmod libdw-dev curl xz-utils python3

      kernel_fetch_source "${KERNEL_VER}" "${KERNEL_SHA256}"

      # Same unified series as the baseline linux-image build: shared set,
      # the GPU driver patch sets, then the PVE additive series — the
      # profile kernels carry the SAME patch provenance; the dry-run
      # all-or-nothing fuzz-0 semantics live inside the helper.
      kernel_apply_patches \
        "${CI_KERNEL_SHARED}/patches-shared.yml" \
        "${DEB_ARCH}" "${KERNEL_VER}" "${SRCDIR}"
      for GPU_DRIVER in amd intel; do
        GPU_PATCH_YML="${CI_KERNEL_SHARED}/patches-gpu/${GPU_DRIVER}.yml"
        [[ -f "${GPU_PATCH_YML}" ]] \
          || { echo "ERROR: engine patches-gpu/${GPU_DRIVER}.yml missing" >&2; exit 1; }
        kernel_apply_patches "${GPU_PATCH_YML}" \
          "${DEB_ARCH}" "${KERNEL_VER}" "${SRCDIR}"
      done
      PVE_PATCHES_YML="${CI_KERNEL_SHARED}/patches-pve.yml"
      [[ -f "${PVE_PATCHES_YML}" ]] \
        || { echo "ERROR: engine patches-pve.yml missing (the PVE additive series)" >&2; exit 1; }
      kernel_apply_patches "${PVE_PATCHES_YML}" \
        "${DEB_ARCH}" "${KERNEL_VER}" "${SRCDIR}"

      cd "${SRCDIR}"
      make mrproper
      make defconfig

      CONFIG_FILES=()
      if [ "${DEB_ARCH}" = "amd64" ]; then
        # Same fragment order as the baseline: shared x86 base, GPU sets,
        # flavour fragment, PVE deltas fragment (base appended after still
        # wins its arch built-ins).
        SHARED_KCFG="${CI_KERNEL_SHARED}/kconfig-shared"
        CONFIG_FILES+=("${SHARED_KCFG}/x86-common.cfg")
        case "${KERNEL_GPU:-all}" in
          all) CONFIG_FILES+=("${SHARED_KCFG}/gpu/amd.cfg" "${SHARED_KCFG}/gpu/intel.cfg" "${SHARED_KCFG}/gpu/nvidia.cfg") ;;
          none) ;;
          *) for PVE_GPU in ${KERNEL_GPU}; do CONFIG_FILES+=("${SHARED_KCFG}/gpu/${PVE_GPU}.cfg"); done ;;
        esac
        [[ -s "${SHARED_KCFG}/${KERNEL_ARCH_LEVEL:-}.cfg" ]] && \
          CONFIG_FILES+=("${SHARED_KCFG}/${KERNEL_ARCH_LEVEL:-}.cfg")
      fi
      CONFIG_FILES+=("${BASE_CONFIG}")
      # THE PROFILE, LAST: IA amd64 = gpu/ia (DC off, compute); THP follows
      # the profile fragment itself (ia = ALWAYS pin, vm = NEVER — real
      # kconfig lines, appended after the base so the profile wins).
      if [ "${DEB_ARCH}" = "amd64" ] && [ "${KERNEL_PROFILE}" = ia ]; then
        for PROFILE_CFG in "${PROFILE_GPU_DIR}"/*.cfg; do
          CONFIG_FILES+=("${PROFILE_CFG}")
        done
      fi
      CONFIG_FILES+=("${PROFILE_THP}")
      if [ "${DEB_ARCH}" = "arm64" ]; then
        PAGES_OVERLAY="${CI_KERNEL_SHARED}/pages/${KERNEL_PAGES}"
        test -f "${PAGES_OVERLAY}" \
          || { echo "ERROR: engine kernel-shared/pages/${KERNEL_PAGES} overlay missing" >&2; exit 1; }
        CONFIG_FILES+=("${PAGES_OVERLAY}")
        # The arm flavour fragment merges AFTER the pages overlay: the
        # pages/16k fragment carries its own CONFIG_LOCALVERSION="-16k"
        # (no flavour in it) which would otherwise be the final word —
        # armv8.2-lse and armv9-sve2 would merge THE SAME release string
        # 7.2.15-16k at different bytes and refuse the pool inclusion
        # (the run-41794169405 class). The page-size pins stay set (the
        # fragment only appends its LOCALVERSION on top after the merge).
        case "${KERNEL_ARCH_LEVEL:-}" in
          armv8.0|armv8.2-lse|armv9-sve2)
            test -f "${CI_KERNEL_SHARED}/kconfig-shared/${KERNEL_ARCH_LEVEL}.cfg" \
              || { echo "ERROR: arm flavour fragment ${KERNEL_ARCH_LEVEL}.cfg missing from the engine export" >&2; exit 1; }
            CONFIG_FILES+=("${CI_KERNEL_SHARED}/kconfig-shared/${KERNEL_ARCH_LEVEL}.cfg")
            ;;
        esac
      fi

      kernel_merge_config "${SRCDIR}" "${CONFIG_FILES[@]}"
      kernel_signing_setup
      make olddefconfig
      kernel_signing_verify

      python3 "${CI_SCRIPTS}/check_kconfig.py" --tree . "${CONFIG_FILES[@]}"
      python3 "${CI_SCRIPTS}/check_kconfig.py" --tree . --config .config \
        "${CONFIG_FILES[@]}" \
        || echo "::warning::kernel config options not present in the final .config"

      # PROFILE PROOF (olddefconfig silently drops an unmet option): the
      # profile pins MUST hold in the final .config. IA amd64 = the DC-off
      # pin (the merged gpu/ia overlay is the last word on the DC symbol);
      # VM (every arch) = the THP NEVER pin — VM carries NO gpu delta, the
      # never proves the VM fragment won over the base ALWAYS pin.
      if [ "${DEB_ARCH}" = "amd64" ] && [ "${KERNEL_PROFILE}" = ia ]; then
        grep -q '^# CONFIG_DRM_AMD_DC is not set$' "${SRCDIR}/.config" \
          || { echo "ERROR: ${KERNEL_PROFILE} profile merge lost the DC-off pin" >&2; exit 1; }
      fi
      if [ "${KERNEL_PROFILE}" = vm ]; then
        grep -q '^# CONFIG_TRANSPARENT_HUGEPAGE is not set$' "${SRCDIR}/.config" \
          || { echo "ERROR: vm profile merge lost the THP-never pin" >&2; exit 1; }
      fi
      # PAGE-SIZE PROOF (owner 05/11 18:4x): the final .config carries the
      # page size the ARCH decided — the 16 KB entry default, or the 4 KB
      # arch-incompatible fallback armv8.0 signals; the x86 build merges no
      # page overlay at all (its automatic fallback, the arm64-only symbols
      # staying out of the merge).
      if [ "${DEB_ARCH}" = arm64 ]; then
        case "${KERNEL_PAGES}" in
          16k) grep -q '^CONFIG_ARM64_16K_PAGES=y$' "${SRCDIR}/.config" \
                || { echo "ERROR: ${KERNEL_PROFILE}-${KERNEL_ARCH_LEVEL} lost the 16k page size" >&2; exit 1; } ;;
          4k)  grep -q '^CONFIG_ARM64_4K_PAGES=y$' "${SRCDIR}/.config" \
                || { echo "ERROR: ${KERNEL_PROFILE}-armv8.0 lost the 4k fallback" >&2; exit 1; } ;;
        esac
      fi
      cp .config /tmp/linux-kernel.config

      KDEB_PKGVERSION="${KERNEL_VER}-1" \
      KCFLAGS="$(kernel_flavour_kcflags "${KERNEL_ARCH_LEVEL:-}")" \
      make -j"$(nproc)" bindeb-pkg

      COMMON_IMAGE_DEB=$(find /tmp -maxdepth 1 -name 'linux-image-*.deb' \
        ! -name 'linux-image-*-dbg*' | head -1)
      test -n "${COMMON_IMAGE_DEB}" \
        || { echo "ERROR: profile linux-image deb not built" >&2; exit 1; }
      BUILT_VER=$(dpkg-deb -f "${COMMON_IMAGE_DEB}" Version)
      cp "${COMMON_IMAGE_DEB}" \
        "/debs/linux-image-common${KERNEL_SUFFIX:-}_${BUILT_VER}_${DEB_ARCH}.deb"
      test -s "/debs/linux-image-common${KERNEL_SUFFIX:-}_${BUILT_VER}_${DEB_ARCH}.deb" \
        || { echo "ERROR: output profile linux-image-common deb empty" >&2; exit 1; }
      # Headers NOT republished here: the linux-image lane above remains the
      # per-flavour headers publisher (the profile delta is amdgpu-only;
      # the module ABI is identical across the three builds of a flavour).

      REPACK_DIR=/tmp/linux-image-common-repack
      rm -rf "${REPACK_DIR}"
      dpkg-deb -R "/debs/linux-image-common${KERNEL_SUFFIX:-}_${BUILT_VER}_${DEB_ARCH}.deb" "${REPACK_DIR}"

      KERNEL_IMAGES=("${REPACK_DIR}"/boot/vmlinuz-*)
      test -f "${KERNEL_IMAGES[0]}" \
        || { echo "ERROR: no /boot/vmlinuz-* in the profile kernel deb" >&2; exit 1; }
      for img in "${KERNEL_IMAGES[@]}"; do
        kernel_sign_efi "${img}"
      done

      # The build tree path carries the profile+flavour suffix: two
      # flavours of one profile install side by side the same way the
      # baseline ones do.
      test -f /tmp/linux-kernel.config \
        || { echo "ERROR: profile kernel build produced no .config" >&2; exit 1; }
      test -f Module.symvers \
        || { echo "ERROR: profile kernel build produced no Module.symvers" >&2; exit 1; }
      KERNEL_BUILD_DIR="usr/lib/linux-kernel-build${KERNEL_SUFFIX:-}"
      mkdir -p "${REPACK_DIR}/${KERNEL_BUILD_DIR}"
      cp /tmp/linux-kernel.config "${REPACK_DIR}/${KERNEL_BUILD_DIR}/config"
      cp Module.symvers "${REPACK_DIR}/${KERNEL_BUILD_DIR}/Module.symvers"

      ORIG_PKG=$(sed -n 's/^Package: //p' "${REPACK_DIR}/DEBIAN/control")
      KVER="${ORIG_PKG#linux-image-}"
      # Explicit packaging identity: daemoncores-kernel-<profile>-<KVER> —
      # the release string itself stays the plain flavour string (the
      # vermagic is identical across the estate; the PACKAGING distinguishes.
      OTHER_PROFILE=vm; [ "${KERNEL_PROFILE}" = vm ] && OTHER_PROFILE=ia
      KERNEL_PKG="daemoncores-kernel-${KERNEL_PROFILE}-${KVER}"
      # Drop Provides/Conflicts/Replaces INCLUDING multiline continuations
      # (continuations start with a space and survive a plain /d sed — that
      # dup-Provides crashed dpkg-deb on daemoncores-kernel-{ia,vm}, run
      # 42622490165).
      awk '
        /^(Provides|Conflicts|Replaces):/ { skip = 1; next }
        skip && /^ / { next }
        { skip = 0; print }
      ' "${REPACK_DIR}/DEBIAN/control" > "${REPACK_DIR}/DEBIAN/control.new" \
        && mv "${REPACK_DIR}/DEBIAN/control.new" "${REPACK_DIR}/DEBIAN/control"
      sed -i "s/^Package: .*/Package: ${KERNEL_PKG}/" \
        "${REPACK_DIR}/DEBIAN/control"
      # Provide BOTH the minimal-image switch name AND the virtual
      # linux-image-<KVER> (the plain release name the module pairs depend
      # on). Conflicts keep exactly ONE build of a release string per host:
      # the plain kernel deb and the sibling profile.
      # ONE line per control field (dpkg-deb rejects a repeated field — the
      # printf emitted two Provides:, run 42632521818) — values comma-joined.
      printf 'Provides: %s, linux-image-%s (= %s)\nConflicts: %s, daemoncores-kernel-%s-%s, daemoncores-kernel-%s-%s\nReplaces: daemoncores-kernel-%s-%s\n' \
        "linux-image-minimal${KERNEL_SUFFIX:-}-${DEB_ARCH}" \
        "${KVER}" \
        "${BUILT_VER}" \
        "${ORIG_PKG}" \
        "${KERNEL_PROFILE}" "${KVER}" "${OTHER_PROFILE}" "${KVER}" \
        "${KERNEL_PROFILE}" "${KVER}" \
        >> "${REPACK_DIR}/DEBIAN/control"
      dpkg-deb -b "${REPACK_DIR}" \
        "/debs/linux-image-common${KERNEL_SUFFIX:-}_${BUILT_VER}_${DEB_ARCH}.deb"
      test -s "/debs/linux-image-common${KERNEL_SUFFIX:-}_${BUILT_VER}_${DEB_ARCH}.deb" \
        || { echo "ERROR: repacked profile linux-image-common deb empty" >&2; exit 1; }

      # HEADERS REPUBLISH (owner 05/11: the baseline linux-image lane is
      # deleted, this class is the ONLY headers publisher). bindeb-pkg built
      # the headers alongside the image; repack them under the
      # profile-prefixed name linux-headers-<profile>-<KVER> — the release
      # string is shared across the profiles of a flavour, so the plain
      # linux-headers-<KVER> name would collide in the pool with the sibling
      # profile of the same release at different bytes (the
      # run-41794169405 class of failure). The zfs-module-pve lane resolves
      # them from the published index by the `-<flavour>-xanmod1` suffix.
      HEADERS_DEB=$(find /tmp -maxdepth 1 -name 'linux-headers-*.deb' \
        ! -name '*-dbg*' | head -1)
      if test -n "${HEADERS_DEB}"; then
        HDR_VER=$(dpkg-deb -f "${HEADERS_DEB}" Version)
        HDR_RPKG=$(dpkg-deb -f "${HEADERS_DEB}" Package | sed 's/^linux-headers-//')
        HDR_RPKG="linux-headers-${KERNEL_PROFILE}-${HDR_RPKG}"
        HREPACK=/tmp/linux-headers-repack
        rm -rf "${HREPACK}"
        dpkg-deb -R "${HEADERS_DEB}" "${HREPACK}"
        sed -i "s/^Package: .*/Package: ${HDR_RPKG}/" "${HREPACK}/DEBIAN/control"
        HDR_FN="${HDR_RPKG}_${HDR_VER}_${DEB_ARCH}.deb"
        dpkg-deb -b "${HREPACK}" "/debs/${HDR_FN}"
        test -s "/debs/${HDR_FN}" \
          || { echo "ERROR: repacked profile headers deb empty" >&2; exit 1; }
        rm -rf "${HREPACK}"
      fi

      rm -rf "${SRCDIR}" /tmp/linux-*

  # linux-modules-arm-device: one template for all ARM device-specific module
  # packages (one per SoC FAMILY, not per board — a fragment covers every
  # board of its SoC generation: rpi3 also serves the Pi Zero 2 W
  # (BCM2710A1), rk3566 serves RK3566/RK3568, h616 serves the sun50i family
  # H616/H613/H6/A64, imx8m serves 8MQ/8MM/8MP, mt8183 serves the
  # MT8167-8183 Chromebook class). The CI expands each variant into an
  # independent build job (see the manifest-expand action) and injects
  # VARIANT from the variant key, so this build script is written once.
  # Variants (all wave 1): linux-modules-rpi3 / -rpi4 / -rk3399 / -h616 /
  # -imx8m / -mt8183 depend on linux-image, linux-modules-rpi5 / -rk3588 /
  # -rk3566 on linux-image-16k.
  # Each starts from the .config shipped in its kernel deb (base — arch options
  # folded in — + page size) and merges only its own device overlay.
  - name: linux-modules-arm-device
    ccache: true
    when:
      arch: arm64
    # The kernel a device builds against is picked BY ARCHITECTURE CLASS
    # (owner order 05/11 18:3x — page size per ARCH, never per device):
    # the Cortex-A53/A72-class devices (Pi 3/4, RK3399, H616, i.MX8M,
    # MT8183, and RK356x whose A55 carries no 16 KB granule) ride the
    # armv8.0 flavour (4 KB automatically), the Cortex-A76-class devices
    # (Pi 5, RK3588) ride armv8.2-lse (16 KB by arch default). KERNEL_SUFFIX
    # names the exact profile kernel deb the modules are built against
    # (seed = the IA profile; the runtime Depends is the virtual
    # linux-image-<KVER> which either profile Provides — MODVERSIONS=n,
    # one module ABI per release string).
    variants:
      rpi3:
        deps:
          - linux-image-ia-armv8.0
        env:
          KERNEL_SUFFIX: "-ia-armv8.0"
      rpi4:
        deps:
          - linux-image-ia-armv8.0
        env:
          KERNEL_SUFFIX: "-ia-armv8.0"
      rpi5:
        deps:
          - linux-image-ia-armv8.2-lse
        env:
          KERNEL_SUFFIX: "-ia-armv8.2-lse"
      rk3588:
        deps:
          - linux-image-ia-armv8.2-lse
        env:
          KERNEL_SUFFIX: "-ia-armv8.2-lse"
      # RK356x family (RK3566/RK3568): Cortex-A55 = armv8.0 class, 4 KB by
      # architecture — the old-devices wave (page size = per arch).
      rk3566:
        deps:
          - linux-image-ia-armv8.0
        env:
          KERNEL_SUFFIX: "-ia-armv8.0"
      # RK3399: pre-RK3588 generation, armv8.0 class (4 KB).
      rk3399:
        deps:
          - linux-image-ia-armv8.0
        env:
          KERNEL_SUFFIX: "-ia-armv8.0"
      # Allwinner sun50i family (H616/H613/H6/A64): A53-class, armv8.0.
      h616:
        deps:
          - linux-image-ia-armv8.0
        env:
          KERNEL_SUFFIX: "-ia-armv8.0"
      # NXP i.MX8M family (8MQ/8MM/8MP): A53-class, armv8.0.
      imx8m:
        deps:
          - linux-image-ia-armv8.0
        env:
          KERNEL_SUFFIX: "-ia-armv8.0"
      # MediaTek MT8167-MT8183 family (kukui/jacuzzi Chromebooks): A53-class,
      # armv8.0.
      mt8183:
        deps:
          - linux-image-ia-armv8.0
        env:
          KERNEL_SUFFIX: "-ia-armv8.0"
    variant-name-prefix: "linux-modules-"
    variant-env: DEVICE
    env:
      # Kernel build primitives come from DaemonCores-CI scripts/
      # kernel_helpers.sh (sourced by deb_helpers.sh in the same bash):
      # bump when those helpers change (8/11-10: the dry-run election gate
      # kernel_dryrun_patches landed in the helpers).
      HELPERS_VER: 8
      # KERNEL VERSION = THE ELECTION (owner order 2026-11-10): the same
      # `track:` resolution as the linux-image entry — deterministic (same
      # manifests, same floor), so the device-module debs are electable in
      # step with the image they build against.
    track:
      KERNEL_VER:
        kernel-org: stable
        require-patches: engine
        digests:
          KERNEL_SHA256: "linux-{version}.tar.xz"
    sources:
      - preinstall/output/linux-modules-arm-device
      # The device fragments of this repo (per-DEVICE overlay of the build):
      # their content is hashed here — a fragment change rebuilds only that
      # device's modules entry (KERNEL FINAL v2: the device data of the bootc
      # lane lives in this repository).
      - kernel-src/modules
    build: |
      set -euo pipefail
      # DEVICE is injected by the CI from the variant key (rpi3/rpi4/rpi5/rk3588)
      # DEVICE overlay (owner KERNEL FINAL v2, 2026-11-03): the device module
      # fragments live IN THIS REPO (kernel-src/modules/embeded/<device>.cfg)
      # — built uniquely on the debian-bootc lane; VE consumes the device modules debs through
      # the APT repo. The engine export keeps only the common set (patches,
      # kconfig, base config, pages).
      SAVE_PWD=$(pwd)
      DEB_ARCH=$(dpkg --print-architecture)
      OVERLAY="${GITHUB_WORKSPACE:-$(pwd)}/workflows/bootc-debs-builder/kernel-src/modules/embeded/${DEVICE}.cfg"
      test -f "${OVERLAY}" \
        || { echo "ERROR: device module overlay kernel-src/modules/embeded/${DEVICE}.cfg missing" >&2; exit 1; }

      # The engine shared set is the canonical patch data (arbitration
      # 2026-11-03 13:05): the builder exports PATCHES_JSON only from the
      # manifest's native `patches:` list (none in production, same
      # arbitration), so the module lane resolves it from the SAME engine
      # export the kernel lane consumes — never a carbon copy of the data.
      # The class filter of the helper picks only this tree's patches per
      # call (kernel vs module).
      test -f "${CI_KERNEL_SHARED}/patches-shared.yml" \
        || { echo "ERROR: engine kernel-shared/patches-shared.yml missing" >&2; exit 1; }
      PATCHES_JSON=$(yq -o=json -I=0 '.patches' "${CI_KERNEL_SHARED}/patches-shared.yml")
      export PATCHES_JSON
      # Bootstrap shared by the kernel module entries: locate the kernel deb,
      # download the kernel source, seed .config (kernel_prepare).
      # The seeded .config is the kernel's own (base + arm overlay + pages), so
      # only the device overlay is merged on top.
      kernel_prepare
      # kernel_prepare derives KVER from the Package field of the seed deb;
      # the profile kernel deb is daemoncores-kernel-<profile>-<KVER>, so
      # strip the profile prefix: KVER stays the plain release string of the
      # modprobe tree (7.2.15-<flavour>-xanmod1) and of the virtual Depends.
      case "${KVER}" in ia-*|vm-*) KVER="${KVER#*-}" ;; esac
      # The standard kernel helper merges the device overlay in place
      # (append + olddefconfig) — same final .config as merge_config.sh -m.
      kernel_merge_config "${SRCDIR}" "${OVERLAY}"
      # Sign the modules with the CI key at modules_install, or turn the
      # automatic signing off when no key is configured.
      kernel_signing_setup
      make olddefconfig

      # Seed Module.symvers from the same deb, at
      # /usr/lib/linux-kernel-build/Module.symvers. This is a modules-only build
      # with no vmlinux.o, so without that symbol table modpost cannot verify
      # the built-in kernel symbols the modules reference (__fentry__,
      # __x86_return_thunk…) and fails with tens of thousands of
      # undefined-symbol errors.
      test -f "${SEED_DIR}/usr/lib/linux-kernel-build${KERNEL_SUFFIX:-}/Module.symvers" \
        || { echo "ERROR: ${COMMON_DEB} carries no Module.symvers" >&2; exit 1; }
      cp "${SEED_DIR}/usr/lib/linux-kernel-build${KERNEL_SUFFIX:-}/Module.symvers" Module.symvers
      # modules-only.symvers is the OUTPUT written by modpost; do not pre-seed it

      # Build only the modules (no vmlinuz, no full bindeb-pkg). This is
      # the N-1 rebuild saving: modules are an order of magnitude faster
      # than a full kernel build.
      # Filter Module.symvers to vmlinux-only exports before patching modpost.
      # The full Module.symvers includes inter-module exports (ehci-hcd, xhci-hcd,
      # etc.); if we feed those to modpost via -i it flags duplicate exports when
      # those same modules are rebuilt.  Only vmlinux symbols are "external" to
      # the module build; inter-module exports are discovered by scanning .ko files.
      if [ -f Module.symvers ]; then
        awk -F'\t' '$3 == "vmlinux"' Module.symvers > /tmp/vmlinux-only.symvers
      fi
      # Patch Makefile.modpost: add -i /tmp/vmlinux-only.symvers when vmlinux.o is
      # absent. In-tree modules-only builds skip this flag by default (only the
      # KBUILD_EXTMOD path reads it); without it modpost has no kernel symbol table
      # and reports 1400+ undefined-symbol errors.
      if [ -f scripts/Makefile.modpost ] && [ -f /tmp/vmlinux-only.symvers ] \
         && ! grep -q 'vmlinux-only.symvers' scripts/Makefile.modpost; then
        printf '\nifneq ($(wildcard /tmp/vmlinux-only.symvers),)\nmodpost-args += -i /tmp/vmlinux-only.symvers\nendif\n' \
          >> scripts/Makefile.modpost
      fi
      make -j"$(nproc)" modules

      # Install the modules into a DESTDIR packaging tree, then build a
      # Debian package from that tree. The modules dir name matches the
      # common image's /lib/modules/<KVER> so modprobe on the target
      # resolves them under the running kernel.
      DESTDIR="/output/linux-modules-${DEVICE}"
      rm -rf "${DESTDIR}"
      mkdir -p "${DESTDIR}/DEBIAN" "${DESTDIR}/lib/modules/${KVER}"
      # modules.builtin and modules.builtin.modinfo are generated during a full
      # kernel build; a modules-only build (make modules without vmlinux) may
      # not produce them. Provide empty stubs so modules_install succeeds.
      [ -f modules.builtin ] || touch modules.builtin
      [ -f modules.builtin.modinfo ] || touch modules.builtin.modinfo
      make modules_install INSTALL_MOD_PATH="${DESTDIR}" INSTALL_MOD_STRIP=1

      # Remove all files already shipped by the kernel deb so this device
      # package only carries device-specific modules and dpkg does not refuse
      # to install two packages that own the same path. This includes .ko files
      # AND kernel metadata files (modules.builtin, modules.alias, modules.dep,
      # etc.) that make modules_install generates identically for every package.
      dpkg-deb --fsys-tarfile "${COMMON_DEB}" | tar t | sed 's|^\./||' \
        | while IFS= read -r f; do
            target="${DESTDIR}/${f}"
            # Must be an if, not `[ -f ] && rm`: the test is not the last
            # command of the loop body by accident — a bare `&&` chain leaves
            # the loop's exit status at 1 the moment a listed path is absent
            # from DESTDIR (routine: the kernel deb carries files this device
            # package does not build), and set -e + pipefail then kill the
            # whole script right after modules_install with no error.
            #
            # The test must also accept symlinks, for any link the kernel deb
            # ships too.
            # Directories must stay excluded: rm -f on one would fail and
            # abort the script under set -e.
            if [ -f "${target}" ] || [ -L "${target}" ]; then
              rm -f "${target}"
            fi
          done

      # modules_install leaves /lib/modules/<ver>/{build,source} behind as
      # symlinks into this CI build tree. The kernel deb (bindeb-pkg) does not
      # ship them, so the loop above never removes them, and every device
      # package would then own the same path: dpkg refuses to unpack two of
      # them ("trying to overwrite '/lib/modules/<ver>/build', which is also in
      # package linux-modules-<other>"). They are dangling in the image anyway.
      rm -f "${DESTDIR}/lib/modules/${KVER}/build" \
        "${DESTDIR}/lib/modules/${KVER}/source"

      cp "${SAVE_PWD}/workflows/bootc-debs-builder/preinstall/output/linux-modules-arm-device/DEBIAN/control" \
        "${DESTDIR}/DEBIAN/control"
      sed -i \
        -e "s|{{ DEVICE }}|${DEVICE}|g" \
        -e "s|Version: {{ VER }}|Version: ${BUILT_VER}+r1|g" \
        -e "s|{{ VER }}|${BUILT_VER}|g" \
        -e "s|{{ KVER }}|${KVER}|g" \
        -e "s|{{ ARCH }}|${DEB_ARCH}|g" \
        "${DESTDIR}/DEBIAN/control"

      # Regenerate md5sums for the installed module files.
      ( cd "${DESTDIR}" && \
        find lib -type f | xargs md5sum | sed 's|lib/|/lib/|' \
        > DEBIAN/md5sums )

      # Build the modules deb.
      dpkg-deb --build "${DESTDIR}" \
        "/debs/linux-modules-${DEVICE}_${BUILT_VER}+r1_${DEB_ARCH}.deb"

      # Content check: the output deb exists and is non-empty.
      test -s "/debs/linux-modules-${DEVICE}_${BUILT_VER}+r1_${DEB_ARCH}.deb" \
        || { echo "ERROR: output linux-modules-${DEVICE} deb empty" >&2; exit 1; }


  # linux-modules-gpu — THE FUSED GPU MODULE SET (owner order 05/11 19:2x +
  # corrections 19:3x): ONE deb per (usage set ia|gaming, flavour) carrying
  # EVERY brand the arch can run. AMD64: amdgpu (the profile DC pin) +
  # i915/xe + the NVIDIA OPEN kernel modules built INSIDE the set deb — the
  # separate linux-modules-nvidia pair is absorbed/dead; the NVIDIA userspace
  # is NEVER one of our debs (it comes from NVIDIA's own signed repository at
  # the derived-image step, owner 19:3x) and there is NO ARM NVIDIA (no -arm
  # loader variant, amd64-only fusion — owner 19:3x(b)). OWNER 09/11: NO
  # ARM64 GPU SET AT ALL — no dGPU exists on ARM, the arm64 lane never
  # builds a gpu deb (the device rpi/rk/mt8183 modules stay); the
  # loader-policy deb
  # (-nvidia variants, amd64 only) carries ONLY the per-profile NVIDIA
  # modprobe conf on top of its sibling merged set: every version pins
  # through that one sibling. The sets build against the IA-profile kernel
  # of their flavour (dep linux-image-ia-<flav>; DC on/off by the set
  # overlay): the set deb Replaces the exact files the seed profile kernel
  # owns (daemoncores-kernel-ia-<KVER>), the way the DC pin per set is
  # proofed; a VM-profile host carries no gpu set (VM != GPU, jamais eu).
  - name: linux-modules-gpu
    variants:
      ia-x64v1:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v1
        env: {GPU_SET: ia, GPU_FLAV: x64v1, SEED_SUFFIX: "-ia-x64v1"}
      ia-x64v2:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v2
        env: {GPU_SET: ia, GPU_FLAV: x64v2, SEED_SUFFIX: "-ia-x64v2"}
      ia-x64v3:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v3
        env: {GPU_SET: ia, GPU_FLAV: x64v3, SEED_SUFFIX: "-ia-x64v3"}
      ia-x64v4:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v4
        env: {GPU_SET: ia, GPU_FLAV: x64v4, SEED_SUFFIX: "-ia-x64v4"}
      # NVIDIA variants: the loader policy only, AMD64 ONLY (owner 19:3x(b) +
      # 09/11: the ARM64 GPU SETS ARE GONE — no dGPU exists on ARM, the
      # arm64 lane builds NO gpu deb at all (the rpi/rk/mt8183 device
      # modules stay); the loader variants amd64 only — no ARM NVIDIA).
      gaming-x64v1:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v1
        env: {GPU_SET: gaming, GPU_FLAV: x64v1, SEED_SUFFIX: "-ia-x64v1"}
      gaming-x64v2:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v2
        env: {GPU_SET: gaming, GPU_FLAV: x64v2, SEED_SUFFIX: "-ia-x64v2"}
      gaming-x64v3:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v3
        env: {GPU_SET: gaming, GPU_FLAV: x64v3, SEED_SUFFIX: "-ia-x64v3"}
      gaming-x64v4:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v4
        env: {GPU_SET: gaming, GPU_FLAV: x64v4, SEED_SUFFIX: "-ia-x64v4"}
      # NVIDIA variants: the loader policy only, AMD64 ONLY (owner 19:3x(b):
      # no ARM NVIDIA — the arm64 flavours never had one). They depend on
      # their sibling FUSED merged set of the same flavour and profile
      # binding, and on the same profile kernel the stack is pinned to: the
      # open NVIDIA modules ride INSIDE the sibling deb.
      ia-nvidia-x64v1:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v1
          - gpu-ia-x64v1
        env: {GPU_SET: ia, GPU_FLAV: x64v1, GPU_NVIDIA: "yes"}
      ia-nvidia-x64v2:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v2
          - gpu-ia-x64v2
        env: {GPU_SET: ia, GPU_FLAV: x64v2, GPU_NVIDIA: "yes"}
      ia-nvidia-x64v3:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v3
          - gpu-ia-x64v3
        env: {GPU_SET: ia, GPU_FLAV: x64v3, GPU_NVIDIA: "yes"}
      ia-nvidia-x64v4:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v4
          - gpu-ia-x64v4
        env: {GPU_SET: ia, GPU_FLAV: x64v4, GPU_NVIDIA: "yes"}
      gaming-nvidia-x64v1:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v1
          - gpu-gaming-x64v1
        env: {GPU_SET: gaming, GPU_FLAV: x64v1, GPU_NVIDIA: "yes"}
      gaming-nvidia-x64v2:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v2
          - gpu-gaming-x64v2
        env: {GPU_SET: gaming, GPU_FLAV: x64v2, GPU_NVIDIA: "yes"}
      gaming-nvidia-x64v3:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v3
          - gpu-gaming-x64v3
        env: {GPU_SET: gaming, GPU_FLAV: x64v3, GPU_NVIDIA: "yes"}
      gaming-nvidia-x64v4:
        when: {arch: amd64}
        deps:
          - linux-image-ia-x64v4
          - gpu-gaming-x64v4
        env: {GPU_SET: gaming, GPU_FLAV: x64v4, GPU_NVIDIA: "yes"}
    variant-name-prefix: "gpu-"
    variant-env: GPU_VARIANT
    # The output debs are named after the EXPANDED variant key (gpu-<set>
    # [-nvidia]-<flav>), never the entry name: the per-variant glob is what
    # makes the ia/gaming amd+intel+nvidia debs visible to the pipeline
    # publish (owner 05/11: the builds ia/gaming of every brand must show
    # up in the CI artifact list).
    deb-glob: "gpu-{variant}_*"
    # KERNEL VERSION = THE ELECTION (owner order 2026-11-10): the same
    # `track:` resolution as the kernel entries — the gpu set deb keeps
    # its Depends in step with the elected kernel (deterministic).
    env:
      HELPERS_VER: 8
    track:
      KERNEL_VER:
        kernel-org: stable
        require-patches: engine
        digests:
          KERNEL_SHA256: "linux-{version}.tar.xz"
    sources:
      - preinstall/output/linux-modules-gpu
      # The per-set kconfig overlays and the loader-policy confs of this
      # repo: a profile change rebuilds only the touched set.
      - kernel-src/modules/gpu
      # The NVIDIA runtime-knob payload (dc-nvidia-tune + its one-shot unit +
      # postinst) rode the absorbed linux-modules-nvidia pair; the FUSED set
      # deb carries it on the amd64 variants now.
      - nvidia
    build: |
      set -euo pipefail
      # The variant key carries its own dimensions: GPU_SET = the usage set
      # (ia|gaming), GPU_FLAV = the flavour (x64v1..v4 — the GPU matrix is
      # AMD64-only: no arm64 gpu deb, owner 09/11), GPU_NVIDIA = yes for the
      # (key <set>-nvidia-<flav>, amd64 only).
      SAVE_PWD=$(pwd)
      DEB_ARCH=$(dpkg --print-architecture)
      WORKTREE="${GITHUB_WORKSPACE:-$(pwd)}"
      WORKFLOW="${WORKTREE}/workflows/bootc-debs-builder"
      CONF_DIR="${WORKFLOW}/kernel-src/modprobe"
      GPU_VARIANT_KEY="${GPU_VARIANT}"
      GPU_SET="${GPU_VARIANT_KEY%%-*}"
      case "${GPU_VARIANT_KEY}" in
        *-nvidia-*) GPU_NVIDIA=yes; GPU_FLAV="${GPU_VARIANT_KEY#*nvidia-}" ;;
        *) GPU_NVIDIA=no; GPU_FLAV="${GPU_VARIANT_KEY#*-}" ;;
      esac
      # KERNEL_SUFFIX names the seed profile kernel for kernel_prepare
      # (linux-image-common${SEED_SUFFIX}_${ver}_${arch}.deb).
      KERNEL_SUFFIX="${SEED_SUFFIX:-}"

      if [ "${GPU_NVIDIA}" = yes ]; then
        # -----------------------------------------------------------------
        # Loader-policy deb: no kernel build (amd64 only — no ARM NVIDIA).
        # Everything it needs rides the sibling FUSED merged set of the same
        # flavour (the open NVIDIA modules are inside it). The version is
        # read from the installed sibling deb, so the Depends pin stays
        # exact and a bump of the set (kernel or NVIDIA release inside it)
        # rebuilds the policy.
        # -----------------------------------------------------------------
        SIB_PKG="gpu-${GPU_SET}-${GPU_FLAV}"
        SIB_VER=$(dpkg-query -W -f='${Version}' "${SIB_PKG}") \
          || { echo "ERROR: dependency ${SIB_PKG} not installed" >&2; exit 1; }
        SET_VER="${SIB_VER}"
        DEPS="${SIB_PKG} (= ${SIB_VER})"
        REPLACES=""
        CONFLICTS=""
        CONF="dc-gpu-${GPU_SET}-nvidia.conf"

        DESTDIR="/output/gpu-${GPU_SET}-nvidia-${GPU_FLAV}"
        rm -rf "${DESTDIR}"
        mkdir -p "${DESTDIR}/DEBIAN" "${DESTDIR}/etc/modprobe.d" && cp "${CONF_DIR}/${CONF}" "${DESTDIR}/etc/modprobe.d/"
      else
        # -----------------------------------------------------------------
        # FUSED in-tree set: modules-only build over the standard kernel deb
        # (the linux-modules-arm-device pattern) with the profile overlay
        # merged on top of the seeded .config — and, on amd64, the NVIDIA
        # OPEN kernel modules compiled from the SAME prepared tree into the
        # same deb.
        # -----------------------------------------------------------------
        OVERLAY="${WORKFLOW}/kernel-src/modules/gpu/${GPU_SET}"
        test -d "${OVERLAY}" \
          || { echo "ERROR: gpu module overlay kernel-src/modules/gpu/${GPU_SET} missing" >&2; exit 1; }
        OVERLAY_CFGS=("${OVERLAY}"/*.cfg)
        test -s "${OVERLAY_CFGS[0]}" \
          || { echo "ERROR: gpu module overlay ${GPU_SET} carries no .cfg fragment" >&2; exit 1; }

        # The engine shared set (see linux-modules-arm-device): the same
        # PATCHES_JSON export consumed by kernel_prepare's class loop.
        test -f "${CI_KERNEL_SHARED}/patches-shared.yml" \
          || { echo "ERROR: engine kernel-shared/patches-shared.yml missing" >&2; exit 1; }
        PATCHES_JSON=$(yq -o=json -I=0 '.patches' "${CI_KERNEL_SHARED}/patches-shared.yml")
        export PATCHES_JSON
        kernel_prepare
        # kernel_prepare derives KVER from the Package field of the seed deb
        # (daemoncores-kernel-<profile>-<KVER>) — strip the profile prefix:
        # the modules install under the plain release string.
        case "${KVER}" in ia-*|vm-*) KVER="${KVER#*-}" ;; esac
        for GPU_SET_CFG in "${OVERLAY}"/*.cfg; do
          kernel_merge_config "${SRCDIR}" "${GPU_SET_CFG}"
        done
        kernel_signing_setup
        make olddefconfig

        # Seed Module.symvers from the kernel deb (the modules-only build has
        # no vmlinux.o; the vmlinux-only filter and the modpost flag live in
        # the device entry build, this block replicates it verbatim.
        test -f "${SEED_DIR}/usr/lib/linux-kernel-build${KERNEL_SUFFIX:-}/Module.symvers" \
          || { echo "ERROR: ${COMMON_DEB} carries no Module.symvers" >&2; exit 1; }
        cp "${SEED_DIR}/usr/lib/linux-kernel-build${KERNEL_SUFFIX:-}/Module.symvers" Module.symvers
        # FULL copy kept aside: the NVIDIA external build (amd64) resolves
        # the inter-module symbols (ib_core for nvidia-peermem, ...) of the
        # modules the set build does NOT rebuild; modpost rewrites
        # Module.symvers to the rebuilt set only, the external build reads
        # the FULL file.
        cp Module.symvers /tmp/gpu-set-symvers-full
        awk -F'\t' '$3 == "vmlinux"' Module.symvers > /tmp/vmlinux-only.symvers
        if [ -f scripts/Makefile.modpost ] && [ -f /tmp/vmlinux-only.symvers ] \
           && ! grep -q 'vmlinux-only.symvers' scripts/Makefile.modpost; then
          printf '\nifeq ($(KBUILD_EXTMOD),)\nifneq ($(wildcard /tmp/vmlinux-only.symvers),)\nmodpost-args += -i /tmp/vmlinux-only.symvers\nendif\nendif\n' \
            >> scripts/Makefile.modpost
        fi
        [ -f modules.builtin ] || touch modules.builtin
        [ -f modules.builtin.modinfo ] || touch modules.builtin.modinfo
        make -j"$(nproc)" modules

        DESTDIR="/output/gpu-${GPU_SET}-${GPU_FLAV}"
        rm -rf "${DESTDIR}"
        mkdir -p "${DESTDIR}/DEBIAN" "${DESTDIR}/lib/modules/${KVER}"
        [ -f modules.builtin ] || touch modules.builtin
        [ -f modules.builtin.modinfo ] || touch modules.builtin.modinfo
        make modules_install INSTALL_MOD_PATH="${DESTDIR}" INSTALL_MOD_STRIP=1

        # Keep ONLY the vendor driver subtree of the profile build (everything
        # else stays in the kernel deb): kernel/drivers/gpu and the AMD ACP
        # audio controller (sound/soc/amd) the amdgpu profile build carries.
        KEEP="${DESTDIR}/lib/modules/${KVER}/kernel"
        mv "${KEEP}/drivers/gpu" /tmp/gpu-set-drivers-gpu
        if [ -d "${KEEP}/sound/soc/amd" ]; then
          mv "${KEEP}/sound/soc/amd" /tmp/gpu-set-sound-amd
        fi
        rm -rf "${KEEP}"
        mkdir -p "${KEEP}/drivers" "${KEEP}/sound/soc"
        mv /tmp/gpu-set-drivers-gpu "${KEEP}/drivers/gpu"
        if [ -d /tmp/gpu-set-sound-amd ]; then
          mv /tmp/gpu-set-sound-amd "${KEEP}/sound/soc/amd"
        fi

        # ===============================================================
        # NVIDIA OPEN FUSION (amd64 only — owner 19:3x(b): no ARM NVIDIA at
        # all, the module is open-gpu-kernel-modules; the USERSPACE stays
        # NVIDIA's own signed repository, never one of our debs): the open
        # modules are BUILT HERE, against the same prepared tree, and their
        # .ko files land in this very deb under kernel/ — the separate
        # linux-modules-nvidia pair is absorbed and dead.
        # ===============================================================
        if [ "${DEB_ARCH}" = amd64 ]; then
          make -j"$(nproc)" modules_prepare
          cp /tmp/gpu-set-symvers-full Module.symvers

          # Rolling pin (owner order 2026-11-09, the kernel-stream pattern —
          # auto detect + fallback): DaemonCores-CI scripts/deb_helpers.sh
          # nvidia_driver_detect walks NVIDIA's OWN Packages index
          # NEWEST-FIRST and takes the FIRST release whose
          # open-gpu-kernel-modules tag exists; a preset
          # NVIDIA_DRIVER_VERSION is honored verbatim. The pairing gate
          # against the user-space release stays: the derived lane reads
          # the release back from THIS deb's version (+r1nv<nvidia>).
          nvidia_driver_detect
          NVIDIAOPEN_VER="${NVIDIA_DRIVER_VERSION}"
          rm -rf /build/nvidia-open
          git clone --quiet --depth=1 --branch "${NVIDIAOPEN_VER}" \
            https://github.com/NVIDIA/open-gpu-kernel-modules.git /build/nvidia-open
          git -C /build/nvidia-open rev-parse HEAD > /build/nvidia-open.commit
          test -d /build/nvidia-open/kernel-open \
            || { echo "ERROR: nvidia-open has no kernel-open tree" >&2; exit 1; }

          # GPU module-tree patches (perf, per driver) of the SAME shared
          # export: patches-gpu/nvidia.yml is applied to THIS NVIDIA tree
          # BEFORE the module compile — dry-run ALL, all-or-nothing. The
          # series resolves as the KERNEL series (KVER = 7.2.15-<flav>-
          # xanmod1 -> 7.2).
          GPU_NVIDIA_YML="${CI_KERNEL_SHARED}/patches-gpu/nvidia.yml"
          [[ -f "${GPU_NVIDIA_YML}" ]] \
            || { echo "ERROR: engine patches-gpu/nvidia.yml missing" >&2; exit 1; }
          PATCHES_SERIES="${KVER%%-*}"
          export PATCHES_SERIES
          kernel_apply_patches "${GPU_NVIDIA_YML}" \
            "amd64" "${NVIDIAOPEN_VER}" "/build/nvidia-open"
          unset PATCHES_SERIES

          make -C /build/nvidia-open \
            SYSSRC="${SRCDIR}" SYSOUT="${SRCDIR}" -j"$(nproc)" modules

          # Install into a SEPARATE staging tree, then merge ONLY the .ko
          # files (their kernel/ relative paths) into the set tree — the
          # metadata files the install regenerates overlap the kernel deb
          # exactly like the in-tree install's, deleted below.
          NVDIR="/output/gpu-${GPU_SET}-${GPU_FLAV}-nvstage"
          rm -rf "${NVDIR}"
          make -C /build/nvidia-open \
            SYSSRC="${SRCDIR}" SYSOUT="${SRCDIR}" \
            INSTALL_MOD_PATH="${NVDIR}" INSTALL_MOD_STRIP=1 modules_install
          NVROOT=$(find "${NVDIR}/lib/modules" -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$(find "${NVROOT}" -name 'nvidia*.ko*' | head -1)" \
            || { echo "ERROR: modules_install produced no nvidia*.ko" >&2; exit 1; }
          strays=$(find "${NVROOT}" -name '*.ko*' -not -name 'nvidia*.ko*' | head -1)
          test -z "${strays}" \
            || { echo "ERROR: nvidia-out installs more than the nvidia modules: ${strays}" >&2; exit 1; }
          find "${NVROOT}" -name 'nvidia*.ko*' | while IFS= read -r ko; do
            rel="${ko#"${NVROOT}"/}"
            mkdir -p "${DESTDIR}/lib/modules/${KVER}/$(dirname "${rel}")"
            mv "${ko}" "${DESTDIR}/lib/modules/${KVER}/${rel}"
          done

          # The deb carries its own runtime-knob payload (owner order 05/11:
          # the host-side dc-gpu-lxc tune is folded INTO the driver deb, no
          # separate package): usr/sbin/dc-nvidia-tune, the one-shot unit it
          # starts and the postinst that enables the unit. Idempotent knobs;
          # the MPS branch self-gates on the IA loader-policy conf
          # (dc-gpu-ia-nvidia.conf), gaming gets the plain tune — the
          # modprobe dc-gpu-* confs stay the policy.
          mkdir -p "${DESTDIR}/usr/sbin" "${DESTDIR}/usr/lib/systemd/system"
          cp "${WORKFLOW}/nvidia/usr/sbin/dc-nvidia-tune" \
            "${DESTDIR}/usr/sbin/dc-nvidia-tune"
          cp "${WORKFLOW}/nvidia/usr/lib/systemd/system/dc-nvidia-tune.service" \
            "${DESTDIR}/usr/lib/systemd/system/dc-nvidia-tune.service"
          cp "${WORKFLOW}/nvidia/DEBIAN/postinst" \
            "${DESTDIR}/DEBIAN/postinst"
          chmod 755 "${DESTDIR}/usr/sbin/dc-nvidia-tune" \
            "${DESTDIR}/DEBIAN/postinst"
        fi

        # Kernel metadata files (modules.alias, modules.dep...) are generated
        # identically by every modules build and the kernel deb owns them; the
        # set deb must not carry its own (same ownership conflict as the
        # device entries), and the build/source symlinks dangle anyway.
        for f in modules.builtin modules.builtin.modinfo modules.alias \
                 modules.alias.bin modules.dep modules.dep.bin \
                 modules.softdep modules.symbols modules.symbols.bin \
                 modules.devname build source; do
          if [ -f "${DESTDIR}/lib/modules/${KVER}/${f}" ] \
             || [ -L "${DESTDIR}/lib/modules/${KVER}/${f}" ]; then
            rm -f "${DESTDIR}/lib/modules/${KVER}/${f}"
          fi
        done

        # Ship the loader policy of the set (the conf the bootc-installer
        # records the choice through).
        mkdir -p "${DESTDIR}/etc/modprobe.d"
        cp "${CONF_DIR}/dc-gpu-${GPU_SET}.conf" "${DESTDIR}/etc/modprobe.d/"
        CONF="dc-gpu-${GPU_SET}.conf"

        # The kernel deb owns the same .ko paths (=m base build): the set
        # replaces those files on install, pinned to the exact kernel. The
        # two in-tree sets build amdgpu differently (DC on/off) — exactly one
        # may be installed.
        # Version: kernel release + the NVIDIA release fused inside (amd64),
        # so the package version increases on a NVIDIA bump on the same
        # kernel and the derived lane reads the NVIDIA release back out of
        # the version string for its same-release pairing gate.
        SET_VER="${BUILT_VER}+r1"
        if [ "${DEB_ARCH}" = amd64 ]; then
          test -n "${NVIDIAOPEN_VER}" \
            || { echo "ERROR: no NVIDIA release resolved for the fusion" >&2; exit 1; }
          SET_VER="${BUILT_VER}+r1nv${NVIDIAOPEN_VER}"
        fi
        # The set deb REPLACES the files the seed profile kernel owns (the
        # concrete daemoncores-kernel-ia-<KVER> deb: the GAMING sets build on
        # the SAME ia-profile kernel, only ia/vm kernels exist, NO gaming
        # kernel package — owner order 05/11 kept 09/11) and pins it exact.
        DEPS="daemoncores-kernel-ia-${KVER} (= ${BUILT_VER})"
        REPLACES="daemoncores-kernel-ia-${KVER} (= ${BUILT_VER})"
        # Exactly one in-tree set may be installed: enumerate the OTHER
        # set's every flavour variant (dpkg has no Conflicts globs), both
        # the fused sets and their loader policies.
        OTHER=gaming; [ "${GPU_SET}" = gaming ] && OTHER=ia
        CONFLICTS=""
        for GPU_FLAVS in x64v1 x64v2 x64v3 x64v4; do
          CONFLICTS="${CONFLICTS:+${CONFLICTS}, }gpu-${OTHER}-${GPU_FLAVS}"
          CONFLICTS="${CONFLICTS}, gpu-${OTHER}-nvidia-${GPU_FLAVS}"
        done
      fi

      # The profile overlay decides the shipped build; assert it really did
      # (olddefconfig silently resolves an unmet option): the in-tree builds
      # must carry amdgpu, and the Display Core pin of the profile must hold
      # in the final .config (DC compiled inside amdgpu.ko — there is no
      # separate .ko file to test, the merged config IS the proof). The DC
      # pins are amd64-only: the DRM_AMD_DC symbol does not exist in an
      # arm64 kconfig tree, the amdgpu content proof stays on every arch.
      if [ "${GPU_NVIDIA}" != yes ]; then
        test -n "$(find "${DESTDIR}/lib/modules/${KVER}/kernel/drivers/gpu" -name 'amdgpu.ko*' 2>/dev/null)" \
          || { echo "ERROR: gpu-${GPU_SET} deb carries no amdgpu" >&2; exit 1; }
        test -f "${SRCDIR}/.config" \
          || { echo "ERROR: no final .config in the kernel tree" >&2; exit 1; }
        if [ "${DEB_ARCH}" = amd64 ]; then
          if [ "${GPU_SET}" = ia ]; then
            grep -q '^# CONFIG_DRM_AMD_DC is not set$' "${SRCDIR}/.config" \
              || { echo "ERROR: gpu-ia overlay lost the DC-off pin" >&2; exit 1; }
          else
            grep -q '^CONFIG_DRM_AMD_DC=y$' "${SRCDIR}/.config" \
              || { echo "ERROR: gpu-gaming overlay lost the DC-on pin" >&2; exit 1; }
          fi
          # genpd must hold in the SEED kernel .config where the set compiles pm_genpd_* callers: ACP selects the promptless PMGDM (a bare =y is
          # ignored by olddefconfig), so gaming asserts PMGDM=y — which only holds when the PM=y root held; ia pins ACP=n = no genpd calls, no
          # export need. (42727851345: PM=n seed silently dropped; 42739869836: PMGDM=y wrongly demanded on ia where nothing selects it.)
          grep -q '^CONFIG_PM=y$' "${SRCDIR}/.config" \
            || { echo "ERROR: seed kernel .config lost CONFIG_PM=y (unmet root of PM_GENERIC_DOMAINS)" >&2; exit 1; }
          [ "${GPU_SET}" = ia ] || grep -q '^CONFIG_PM_GENERIC_DOMAINS=y$' "${SRCDIR}/.config" \
            || { echo "ERROR: gpu-gaming seed lost PM_GENERIC_DOMAINS=y (ACP select + PM root dropped)" >&2; exit 1; }
        fi
        # FUSION content proof (amd64): the NVIDIA open modules ride this
        # deb — nvidia.ko (the main module) is always of the set's kernel
        # release tree.
        if [ "${DEB_ARCH}" = amd64 ]; then
          test -n "$(find "${DESTDIR}/lib/modules/${KVER}/kernel" -name 'nvidia.ko*' 2>/dev/null)" \
            || { echo "ERROR: gpu-${GPU_SET} deb carries no fused nvidia module" >&2; exit 1; }
        fi
      fi

      # Control from the shared template: deps, replaces and conflicts differ
      # per variant (computed above), the rest is verbatim. The NAME carries
      # the class variant-name-prefix: GPU_VARIANT rides the RAW variant key
      # (ia-x64v1), the engine expands the entry name to gpu-<key> — the sed
      # below CONSUMES the literal gpu- of the template into its LHS
      # pattern, so the replacement must re-emit it (run 42720355625: the
      # deb landed 'ia-x64v1' and the gpu-ia-x64v1 glob found nothing).
      NAME="gpu-${GPU_VARIANT_KEY}"
      cp "${SAVE_PWD}/workflows/bootc-debs-builder/preinstall/output/linux-modules-gpu/DEBIAN/control" \
        "${DESTDIR}/DEBIAN/control"
      sed -i \
        -e "s|^Package: gpu-{{ SET }}|Package: ${NAME}|g" \
        -e "s|Version: {{ VER }}|Version: ${SET_VER}|g" \
        -e "s|{{ VER }}|${SET_VER}|g" \
        -e "s|{{ ARCH }}|${DEB_ARCH}|g" \
        -e "s|{{ KVER }}|${KVER:-kernel}|g" \
        -e "s|Depends: {{ DEPS }}|Depends: ${DEPS}|g" \
        -e "s|Replaces: {{ REPLACES }}|Replaces: ${REPLACES}|g" \
        -e "s|Conflicts: {{ CONFLICTS }}|Conflicts: ${CONFLICTS}|g" \
        -e "s|/etc/modprobe.d/dc-gpu-{{ SET }}.conf|/etc/modprobe.d/${CONF}|g" \
        "${DESTDIR}/DEBIAN/control"

      # Regenerate md5sums for the shipped files (lib, usr and etc).
      ( cd "${DESTDIR}" && \
        { [ -d lib ] && find lib -type f; \
          [ -d usr ] && find usr -type f; \
          [ -d etc ] && find etc -type f; true; } \
        | sort | xargs md5sum \
        | sed -e 's|lib/|/lib/|' -e 's|usr/|/usr/|' -e 's|etc/|/etc/|' \
        > DEBIAN/md5sums )

      # Empty-Replaces must not ship as a literal empty field: dpkg refuses an
      # empty Depends-like line.
      if [ -z "${REPLACES}" ]; then
        sed -i '/^Replaces: *$/d' "${DESTDIR}/DEBIAN/control"
      fi
      if [ -z "${CONFLICTS}" ]; then
        sed -i '/^Conflicts: *$/d' "${DESTDIR}/DEBIAN/control"
      fi

      # Content check: the loader policy conf is in the deb.
      test -s "${DESTDIR}/etc/modprobe.d/${CONF}" \
        || { echo "ERROR: gpu deb produced without its modprobe policy" >&2; exit 1; }

      dpkg-deb --build "${DESTDIR}" \
        "/debs/${NAME}_${SET_VER}_${DEB_ARCH}.deb"
      test -s "/debs/${NAME}_${SET_VER}_${DEB_ARCH}.deb" \
        || { echo "ERROR: output ${NAME} deb empty" >&2; exit 1; }

  # ===========================================================================
  # gpu-userspace class — the GPU userspace stack, compiled from source, one
  # build per usage profile. BOTH profiles carry the drivers of EVERY vendor
  # (Gallium and Vulkan drivers are left on `auto`, no vendor list); they differ
  # only in build configuration and optimisation. Both debs live in the same
  # image under their own prefix and `dc-gpu set gaming|ia|auto` activates one.
  # Mesa is built at the upstream release matching Debian's candidate (the way
  # linux-modules-nvidia derives its tag from libcuda1), so the Debian runtime
  # libraries it links against (LLVM, libdrm, wayland, ...) agree with it.
  # Limits: the NVIDIA proprietary userspace cannot be recompiled and stays the
  # Debian packages; ROCm and Level Zero userspace are not built here.
  # ===========================================================================
  - name: gpu-userspace
    # One variant per (usage profile, CPU level), the transverse-variant
    # transverse-variant strategy of the PVE kernel build (DaemonCores-VE
    # packages.yml): the
    # level is a build variable (GPU_LEVEL x64v1/x64v2/x64v3/x64v4 on amd64,
    # mapped to -march by the CI helper kernel_flavour_kcflags, the same
    # mapping the kernels use). GÉNÉRIQUE = POUBELLE (owner 05/11 19:2x): no
    # generic variant left anywhere — arm64 carries no gpu userspace build.
    # All
    # variants are installed side by side; ld.so picks the level per CPU through
    # glibc-hwcaps directories, no boot-time switch (x64v1 = baseline).
    variants:
      gaming-x64v1:
        when: {arch: amd64}
        env: {GPU_PROFILE: gaming, GPU_LEVEL: x64v1}
      gaming-x64v2:
        when: {arch: amd64}
        env: {GPU_PROFILE: gaming, GPU_LEVEL: x64v2}
      gaming-x64v3:
        when: {arch: amd64}
        env: {GPU_PROFILE: gaming, GPU_LEVEL: x64v3}
      gaming-x64v4:
        when: {arch: amd64}
        env: {GPU_PROFILE: gaming, GPU_LEVEL: x64v4}
      ia-x64v1:
        when: {arch: amd64}
        env: {GPU_PROFILE: ia, GPU_LEVEL: x64v1}
      ia-x64v2:
        when: {arch: amd64}
        env: {GPU_PROFILE: ia, GPU_LEVEL: x64v2}
      ia-x64v3:
        when: {arch: amd64}
        env: {GPU_PROFILE: ia, GPU_LEVEL: x64v3}
      ia-x64v4:
        when: {arch: amd64}
        env: {GPU_PROFILE: ia, GPU_LEVEL: x64v4}
    variant-name-prefix: "gpu-userspace-"
    variant-env: GPU_VARIANT
    sources:
      - gpu-userspace
    env:
      HELPERS_VER: 7
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      DEB_ARCH=$(dpkg --print-architecture)
      PKG="gpu-userspace-${GPU_PROFILE}-${GPU_LEVEL}"
      BASE_PKG="gpu-userspace-${GPU_PROFILE}-x64v1"
      PREFIX="/usr/lib/dc-gpu/${GPU_PROFILE}"
      SHARE="/usr/share/dc-gpu/${GPU_PROFILE}"
      STAGE="/output/${PKG}-stage"
      TREE="/output/${PKG}"

      # Profile = build configuration only (every vendor in both).
      #   gaming  full optimisation + LTO, every video codec, Vulkan overlay
      #           and screenshot layers, no compute-only front end (rusticl)
      #   ia      OpenCL through rusticl on the LLVM compute stack, no
      #           display-only layers; -O2 without LTO
      case "${GPU_PROFILE}" in
        gaming)
          MESON_PROFILE_OPTS="-Doptimization=3 -Db_lto=true -Dvideo-codecs=all
            -Dgallium-rusticl=false -Dgallium-va=enabled -Dgallium-vdpau=enabled
            -Dvulkan-layers=device-select,overlay,screenshot" ;;
        ia)
          MESON_PROFILE_OPTS="-Doptimization=2 -Dllvm=enabled -Dshared-llvm=enabled
            -Dgallium-rusticl=true -Dgallium-va=disabled
            -Dgallium-vdpau=disabled -Dvulkan-layers=device-select" ;;
        *) echo "ERROR: unknown GPU profile ${GPU_PROFILE}" >&2; exit 1 ;;
      esac
      # CPU level -> -march (x64v1 = baseline); the level builds ship only
      # their libraries, in the glibc-hwcaps directory ld.so searches.
      MARCH=$(kernel_flavour_kcflags "${GPU_LEVEL}")
      # The -march of the level applies to the SHIPPED libraries only: the
      # build-time executables (mesa_clc, ...) run ON THE RUNNER. A cross
      # file whose build == host machine makes those two worlds split
      # (native:true tools compile from the BUILD side, which carries no
      # march; in a cross build the command-line -Dc_args is NOT passed, the
      # march rides the machine file's host [built-in options]). Without it
      # the vN-compiled mesa_clc dies SIGILL on a runner that does not carry
      # the level (run 42681037593, x64v4).
      BUILD_MACHINE=/tmp/dc-gpu-build-machine.ini
      # llvm-config is resolved AFTER the llvm-dev install below and lands
      # inside [binaries]: in a cross build find_program reads ONLY
      # [binaries], and meson REJECTS the unversioned default target for
      # cross use ('Default target is not allowed for cross use') — Debian
      # ships llvm-config-19 versioned, no unversioned alias. Resolving it
      # at block start on a fresh runner yields an EMPTY entry and the LLVM
      # dependency dies (run 427, 'llvm-config binary missing').
      {
        echo "[binaries]"
        echo "c = 'cc'"
        echo "cpp = 'c++'"
        echo "ar = 'ar'"
        echo "strip = 'strip'"
        echo "pkg-config = 'pkg-config'"
        echo "rust = 'rustc'"
        echo "cargo = 'cargo'"
        echo "[host_machine]"
        echo "system = 'linux'"
        echo "cpu_family = 'x86_64'"
        echo "cpu = 'x86_64'"
        echo "endian = 'little'"
        echo "[build_machine]"
        echo "system = 'linux'"
        echo "cpu_family = 'x86_64'"
        echo "cpu = 'x86_64'"
        echo "endian = 'little'"
        if [ -n "${MARCH}" ]; then
          echo "[built-in options]"
          echo "c_args = '${MARCH}'"
          echo "cpp_args = '${MARCH}'"
        fi
      } > "${BUILD_MACHINE}"
      HWCAPS=
      case "${GPU_LEVEL}" in
        x64v1) ;;
        x64v[2-9]) HWCAPS="x86-64-v${GPU_LEVEL#x64v}" ;;
        *) echo "ERROR: unknown CPU level ${GPU_LEVEL}" >&2; exit 1 ;;
      esac

      # Mesa release = Debian's candidate (epoch, Debian revision and a
      # repack suffix stripped, "~rc" -> "-rc" as upstream names its tarballs).
      apt-get update -qq
      DEB_MESA=$(apt-cache policy mesa-vulkan-drivers \
        | awk '/Candidate:/ { print $2 }')
      test -n "${DEB_MESA}" && [ "${DEB_MESA}" != "(none)" ] \
        || { echo "ERROR: no mesa-vulkan-drivers candidate in the apt index" >&2; exit 1; }
      MESA_VER=$(printf '%s' "${DEB_MESA#*:}" | sed -E 's/-[^-]*$//; s/\+.*//; s/~/-/')
      BUILT_VER="${MESA_VER}+r1"

      # Build dependencies come from Debian's own mesa source package at the
      # built version (pinned: apt would pick the newest, a trixie-backports
      # record). deb-src is enabled on the existing apt sources before build-dep.
      for f in /etc/apt/sources.list.d/*.sources; do
        [ -e "${f}" ] || continue
        sed -i -E 's/^Types:[[:space:]]*deb[[:space:]]*$/Types: deb deb-src/' "${f}"
      done
      if [ -s /etc/apt/sources.list ]; then
        sed -E -n 's/^deb[[:space:]]/deb-src /p' /etc/apt/sources.list \
          > /etc/apt/sources.list.d/dc-gpu-src.list
      fi
      apt-get update -qq
      if ! apt-get build-dep -y "mesa=${DEB_MESA#*:}"; then
        echo "--- diag: apt sources and the mesa source records seen by apt" >&2
        grep -rH . /etc/apt/sources.list.d/ /etc/apt/preferences* 2>/dev/null >&2
        apt-cache showsrc mesa | grep -E '^(Package|Version|Directory):' >&2
        apt-cache policy directx-headers-dev >&2
        exit 1
      fi
      apt-get install -y --no-install-recommends \
        build-essential meson ninja-build pkgconf curl xz-utils dpkg-dev binutils llvm-dev libudev-dev

      # llvm-config resolved here — AFTER the llvm-dev install (run 427:
      # resolved at block start on a fresh runner, the cross file carried an
      # EMPTY entry and meson died 'Neither a subproject directory nor a
      # llvm.wrap file was found'). Versioned only: meson rejects the
      # unversioned default target for cross use.
      LLVM_CFG=$(command -v llvm-config-19 \
        || ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1 \
        || true)
      test -n "${LLVM_CFG}" \
        || { echo "ERROR: no versioned llvm-config after the llvm-dev install" >&2; exit 1; }
      sed -i "/^cargo = /a llvm-config = '${LLVM_CFG}'" "${BUILD_MACHINE}"

      rm -rf /build/mesa /build/mesa-src
      mkdir -p /build/mesa-src
      # archive.mesa3d.org resets bursts (8 level downloads at once) — retry,
      # and only the decompressed content test below decides the outcome.
      for attempt in 1 2 3 4 5; do
        curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
          "https://archive.mesa3d.org/mesa-${MESA_VER}.tar.xz" \
          | tar -xJ -C /build/mesa-src --strip-components=1 \
          && test -f /build/mesa-src/meson.build \
          && break
        [ "${attempt}" -lt 5 ] || exit 1
        rm -rf /build/mesa-src && mkdir -p /build/mesa-src
        sleep $((attempt * 15))
      done

      # BUILD-TIME tools must not carry the vN march: upstream mesa builds
      # mesa_clc/vtn_bindgen2 native:true ONLY when host binaries cannot run
      # (a same-machine cross build makes can_run_host_binaries true and the
      # tools ride the HOST [built-in options] -march=x86-64-v4 -> 'Illegal
      # instruction' on runners without the level, 42681037593/42708692713;
      # forcing can_run false instead breaks meson — 'Tried to mix a host
      # machine library with a build machine target', 42710412769). Stage-1
      # provides march-free mesa_clc + vtn_bindgen2, stage-2 consumes them
      # via -Dmesa-clc=system and the SHIPPED libraries keep the march.
      TOOLDIR=/tmp/dc-mesa-clc-tools; rm -rf "${TOOLDIR}"; mkdir -p "${TOOLDIR}"
      # NO >/dev/null: a silenced stdout hides meson's ERROR lines (they go to
      # stdout) and the wrapper's `build ||` context suppresses set -e — a dead
      # stage-1 surfaced as stage-2 'Program mesa_clc not found' (42711751111).
      # glx/egl/gbm/glvnd/platforms DISABLED: meson refuses an empty gallium
      # driver list while glx rides xlib ('xlib based GLX requires at least one
      # gallium driver'). libclc comes from the Debian mesa build-dep already
      # installed (with_clc=true, meson.build:850 hard requirement).
      meson setup "${TOOLDIR}" /build/mesa-src --buildtype=release \
        -Dmesa-clc=enabled -Dinstall-mesa-clc=true \
        -Dgallium-drivers= -Dvulkan-drivers= -Dgallium-rusticl=false \
        -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dglvnd=disabled \
        -Dplatforms= -Dbuild-tests=false -Dstrip=true \
        && ninja -C "${TOOLDIR}"
      export PATH="$(find "${TOOLDIR}" -type f \( -name mesa_clc -o -name vtn_bindgen \) -printf '%h\n' | sort -u | tr '\n' ':')${PATH}"
      # mesa renames this tool: 25.x ships 'vtn_bindgen'
      # (src/compiler/spirv/meson.build:86), master renamed it 'vtn_bindgen2'
      # — the find above covers whichever the version builds.

      # Every driver the architecture supports: left on `auto`, never listed.
      # The profile options are set above, the optimisation level comes from
      # meson's buildtype; -march only from the CPU level variable.
      # shellcheck disable=SC2086
      meson setup /build/mesa /build/mesa-src \
        --cross-file="${BUILD_MACHINE}" \
        --prefix="${PREFIX}" --libdir=lib --datadir="${SHARE}" \
        --sysconfdir="${SHARE}/etc" --buildtype=release \
        -Dgallium-drivers=auto -Dvulkan-drivers=auto -Dmesa-clc=system \
        -Dglvnd=enabled -Dbuild-tests=false -Dstrip=true \
        ${MESON_PROFILE_OPTS}
      meson compile -C /build/mesa
      rm -rf "${STAGE}" "${TREE}"
      DESTDIR="${STAGE}" meson install -C /build/mesa

      # Content check: at least one Vulkan ICD, one Gallium/DRI driver, and
      # the OpenCL ICD for the profile that builds it.
      ls "${STAGE}${SHARE}"/vulkan/icd.d/*.json >/dev/null 2>&1 \
        || { echo "ERROR: no Vulkan ICD installed for ${GPU_PROFILE}" >&2; exit 1; }
      test -n "$(find "${STAGE}${PREFIX}/lib" -name '*_dri.so' -o -name 'libgallium*.so*' 2>/dev/null | head -1)" \
        || { echo "ERROR: no Gallium driver installed for ${GPU_PROFILE}" >&2; exit 1; }
      if printf '%s' "${MESON_PROFILE_OPTS}" | grep -q 'gallium-rusticl=true'; then
        ls "${STAGE}${SHARE}"/etc/OpenCL/vendors/*.icd >/dev/null 2>&1 \
          || { echo "ERROR: rusticl requested but no OpenCL ICD installed" >&2; exit 1; }
      fi

      # Descriptors name their library by soname only: the loader resolves it
      # through ld.so (profile prefix registered by dc-gpu), so the glibc-hwcaps
      # build of the CPU is the one found. Rewritten for every descriptor kind.
      for j in "${STAGE}${SHARE}"/vulkan/icd.d/*.json "${STAGE}${SHARE}"/glvnd/egl_vendor.d/*.json; do
        [ -e "${j}" ] || continue
        sed -i -E 's#("library_path"[[:space:]]*:[[:space:]]*")([^"]*/)?([^"/]*)"#\1\3"#' "${j}"
      done
      for i in "${STAGE}${SHARE}"/etc/OpenCL/vendors/*.icd; do
        [ -e "${i}" ] || continue
        basename "$(cat "${i}")" > "${i}.new" && mv "${i}.new" "${i}"
      done
      ! grep -rE '"library_path"[[:space:]]*:[[:space:]]*"[^"]*/' "${STAGE}${SHARE}" \
        || { echo "ERROR: a descriptor still carries a path" >&2; exit 1; }

      # Only the two profile prefixes may be populated.
      stray=$(cd "${STAGE}" && find . -mindepth 1 -maxdepth 3 -type d \
        -not -path "./usr" -not -path "./usr/lib" -not -path "./usr/share" \
        -not -path "./usr/lib/dc-gpu*" -not -path "./usr/share/dc-gpu*" | head -1)
      test -z "${stray}" \
        || { echo "ERROR: files installed outside the profile prefix: ${stray}" >&2; exit 1; }
      find "${STAGE}${PREFIX}/lib" -type f \( -name '*.so' -o -name '*.so.*' \) \
        -exec strip --strip-unneeded {} +

      # Package tree: the baseline build ships everything; a CPU-level build
      # ships only the libraries ld.so resolves by name, under
      # lib/glibc-hwcaps/<level>, and depends on the baseline package.
      mkdir -p "${TREE}/DEBIAN"
      if [ -z "${HWCAPS}" ]; then
        cp -a "${STAGE}/usr" "${TREE}/"
        EXTRA_DEP=
      else
        mkdir -p "${TREE}${PREFIX}/lib/glibc-hwcaps/${HWCAPS}"
        cp -a "${STAGE}${PREFIX}"/lib/*.so* "${TREE}${PREFIX}/lib/glibc-hwcaps/${HWCAPS}/"
        test -n "$(find "${TREE}${PREFIX}/lib/glibc-hwcaps/${HWCAPS}" -name '*.so*' | head -1)" \
          || { echo "ERROR: no library for ${HWCAPS}" >&2; exit 1; }
        EXTRA_DEP="${BASE_PKG} (= ${BUILT_VER})"
      fi

      # Runtime dependencies from the linked libraries; libraries of the
      # profile itself are resolved in the staging tree.
      mkdir -p "${STAGE}/debian"
      printf 'Source: %s\n\nPackage: %s\nArchitecture: any\n' "${PKG}" "${PKG}" \
        > "${STAGE}/debian/control"
      DEPS=$(cd "${STAGE}" && find "${TREE}${PREFIX}/lib" -type f -name '*.so*' \
        -exec dpkg-shlibdeps -O --ignore-missing-info -l"${STAGE}${PREFIX}/lib" \
          "-x${PKG}" {} + 2>/dev/null \
        | sed -n 's/^shlibs:Depends=//p' | tr ',' '\n' | sed 's/^ *//' \
        | sort -u | paste -sd, - | sed 's/,/, /g')
      rm -rf "${STAGE}/debian"
      DEPS="${EXTRA_DEP:+${EXTRA_DEP}, }${DEPS}"
      test -n "${DEPS}" \
        || { echo "ERROR: dpkg-shlibdeps found no runtime dependency" >&2; exit 1; }

      cp "${SAVE_PWD}/workflows/bootc-debs-builder/gpu-userspace/DEBIAN/control" \
        "${TREE}/DEBIAN/control"
      sed -i \
        -e "s|{{ VER }}|${BUILT_VER}|g" \
        -e "s|{{ ARCH }}|${DEB_ARCH}|g" \
        -e "s|{{ PKG }}|${PKG}|g" \
        -e "s|{{ PROFILE }}|${GPU_PROFILE}|g" \
        -e "s|{{ LEVEL }}|${GPU_LEVEL}|g" \
        -e "s|{{ DEPS }}|${DEPS}|g" \
        "${TREE}/DEBIAN/control"
      ! grep -q '{{' "${TREE}/DEBIAN/control" \
        || { echo "ERROR: ${PKG} control has unexpanded template" >&2; exit 1; }
      ( cd "${TREE}" && find usr -type f -print0 | xargs -0 md5sum > DEBIAN/md5sums )

      dpkg-deb --build "${TREE}" "/debs/${PKG}_${BUILT_VER}_${DEB_ARCH}.deb"
      test -s "/debs/${PKG}_${BUILT_VER}_${DEB_ARCH}.deb" \
        || { echo "ERROR: output ${PKG} deb empty" >&2; exit 1; }

  # ===========================================================================
  # SHARED KERNEL DATA: carried by the build engine — DaemonCores-CI
  # build-deb/kernel-shared/ (owner arbitration 2026-11-03 12:55), exported
  # to every build as CI_KERNEL_SHARED. This repository defines NO copy:
  #   build-deb/kernel-shared/patches-shared.yml  the canonical XanMod patch
  #     set — PATCH PARITY: the debian linux-image build applies it to its
  #     own kernel; DaemonCores-VE kernel-pve consumes the same export
  #     (one set, both kernels, no cross-repo fetch)
  #   build-deb/kernel-shared/kconfig-shared/     base + GPU + flavour
  #     kconfig fragments (base + GPU merged into the debian kernel too;
  #     the VE lane merges them with its own lane-local THP=never override)
  # No logic is duplicated here; the build orchestrates the standard kernel
  # helpers of DaemonCores-CI scripts/kernel_helpers.sh.
  #
  # ===========================================================================
  # overlay-tree class — apt-repacked packages whose modifications are a whole
  # extra file overlay (ifupdown2 autoconf suite, timesyncd network-online
  # drop-in). One deb_overlay_tree call per package (deb_helpers.sh).
  #
  # PENDING (accepted deviation from the old verbatim builds): deb_overlay_tree
  # regenerates md5sums and rewrites the version line but does NOT re-verify
  # (a) the rewritten Version in control and (b) the presence/exec bit of the
  # EXTRA_EXEC scripts — it only chmods them. The old ifupdown2 build had
  # grep/test checks for both. If that regression matters, add the checks to
  # deb_overlay_tree in DaemonCores-CI (bump HELPERS_VER there when done).
  #
  # PENDING — the other classes: the from-source packages below
  # (bootupd, libcomposefs, ostree, bootc, fisherman,
  # bootc-installer, grub-efi-{amd64,arm64}-signed) keep their verbatim builds.
  # None maps cleanly onto deb_custom/deb_overlay_tree (they clone upstream and
  # compile via meson/cargo/go, install their deps, or gate on when.arch with
  # per-body divergences) — auditing them into a from-source class entry is
  # deferred, not dropped.
  # ===========================================================================
  - name: overlay-tree
    variant-env: PKG
    variant-source: "{variant}"
    env:
      HELPERS_VER: 5
    build: |
      deb_overlay_tree "${PKG}" "${VER_SUFFIX}" "${PKG}" ${EXTRA_EXEC:-}
    deb-glob: "{variant}_*"
    variants:
      ifupdown2:
        env:
          PKG: ifupdown2
          VER_SUFFIX: +bootc8
          EXTRA_EXEC: usr/sbin/ifupdown2-autoconf usr/sbin/domain-set usr/sbin/ifupdown2-dhcp4-probe-hook
        upstream: ifupdown2
      systemd-timesyncd:
        env:
          PKG: systemd-timesyncd
          VER_SUFFIX: +bootc1
        upstream: systemd-timesyncd

  # grub-efi-amd64-signed is x86_64-only by nature (it builds the amd64 EFI
  # GRUB binary signed for Secure Boot). On an arm64 runner the package is
  # SKIPPED via the `when:` arch gate below, so the arm64 build does not fail
  # on a missing SB_SIGNING_KEY or an amd64-only configure target. The main
  # Containerfile is x86_64-only and always runs this package
  # on an amd64 runner — zero regression.
  - name: grub-efi-amd64-signed
    when:
      # Build only when the runner's native arch is amd64. The build-env image
      # exports ARCH=$(dpkg --print-architecture) for this gate.
      arch: amd64
    sources:
      - preinstall/output/grub-efi-amd64-signed
    # Rolling: the head of the Fedora GRUB mainline (the default branch of
    # rhboot/grub2) is resolved before each build; nothing is pinned.  If that
    # head does not build, the last-good published deb is kept.
    track:
      GRUB_COMMIT:
        repo: rhboot/grub2
        head: true
    secret-env:
      SB_SIGNING_KEY: SB_SIGNING_KEY
      SB_SIGNING_CERT: SB_SIGNING_CERT
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      ARCH=$(dpkg --print-architecture)
      trap 'rm -f /tmp/sb.key /tmp/sb.crt' EXIT

      git clone https://github.com/rhboot/grub2.git /build/grub2-fedora
      cd /build/grub2-fedora
      GRUB_BRANCH=$(git rev-parse --abbrev-ref HEAD)
      git checkout "${GRUB_COMMIT}"
      # Package version derived from the source: GRUB release, commit date
      # (monotonic, so apt always sees a newer head as an upgrade) and the
      # Fedora branch, e.g. 1+2.12+20261013+fedora46.
      GRUB_UPSTREAM=$(sed -n 's/^AC_INIT(\[GRUB\],\[\([^]]*\)\].*/\1/p' \
        configure.ac)
      GRUB_DATE=$(git show -s --format=%cd --date=format:%Y%m%d HEAD)
      GRUB_VER="1+${GRUB_UPSTREAM}+${GRUB_DATE}+${GRUB_BRANCH//-/}"
      echo "GRUB ${GRUB_VER} from ${GRUB_BRANCH}@${GRUB_COMMIT}"

      # bootstrap clones gnulib from git.savannah.gnu.org, which answers HTTP 500
      # now and then (run 41382456261, arm64). Retry with a growing pause on a
      # clean gnulib directory; a persistent failure still fails the build.
      for attempt in 1 2 3 4; do
        ./bootstrap && break
        [ "${attempt}" -lt 4 ] || exit 1
        rm -rf gnulib
        sleep $((attempt * 30))
      done

      # --program-transform-name renames the userspace tools grub-* -> grub2-*.
      # The Fedora source's own mkconfig scripts call grub2-probe/grub2-mkrelpath
      # internally and bootupd invokes grub2-editenv/install/mkconfig, so the
      # grub2 naming is the native, consistent one here (matching the EFI binary
      # we build from the same tree). We drop Debian's grub-common entirely.
      ./configure \
        --target=x86_64 \
        --with-platform=efi \
        --prefix=/usr \
        --sysconfdir=/etc \
        --disable-werror \
        --program-transform-name='s,grub,grub2,' \
        MAKEINFO=true

      make -j$(nproc)

      # Install the full grub userspace (grub2-* tools + x86_64-efi modules +
      # fonts + locale) into the deb. Previously the package shipped only the
      # signed EFI binary, so the installed system had no grub tooling at all and
      # bootupd could never self-update. This is the core of the fix.
      make -j$(nproc) install \
        DESTDIR=/output/grub-efi-amd64-signed \
        MAKEINFO=true

      GRUB_MODULES=" \
        all_video boot blscfg btrfs blsuki \
        cat configfile cryptodisk \
        echo ext2 f2fs fat font \
        gcry_rijndael gcry_rsa gcry_serpent \
        gcry_sha256 gcry_twofish gcry_whirlpool \
        gfxmenu gfxterm gzio \
        halt hfsplus http increment iso9660 \
        jpeg loadenv loopback linux lvm luks luks2 \
        memdisk mdraid09 mdraid1x minicmd net \
        normal part_apple part_msdos part_gpt \
        password_pbkdf2 pgp png reboot regexp \
        search search_fs_uuid search_fs_file \
        search_label serial sleep \
        squash4 syslinuxcfg \
        test tftp version video xfs zstd \
        efi_netfs efifwsetup efinet lsefi lsefimmap connectefi bli \
        backtrace chain tpm usb usbserial_common \
        usbserial_pl2303 usbserial_ftdi usbserial_usbdebug \
        keylayouts at_keyboard"

      mkdir -p \
        /output/grub-efi-amd64-signed/usr/lib/grub/x86_64-efi-signed

      # SBAT metadata: shim refuses (0x1A Security Violation) a next stage with
      # no .sbat section or a generation below its revocation policy. The grub
      # generation is taken from the Fedora packaging of this same source, so it
      # follows upstream instead of being pinned here; our own component line
      # lets a vulnerable build of this package be revoked on its own.
      curl -fsSL \
        https://src.fedoraproject.org/rpms/grub2/raw/rawhide/f/sbat.csv.in \
        | sed -n -e 's|^\(sbat,1,.*\)$|\1|p' \
                 -e "s|^\(grub,[0-9]*,.*\)@@VERSION@@,https//|\1${GRUB_UPSTREAM},https://|p" \
        > /tmp/sbat.csv
      grep -q '^grub,[0-9]' /tmp/sbat.csv \
        || { echo "ERROR: no grub SBAT line resolved" >&2; exit 1; }
      echo "grub.debian-bootc,1,debian-bootc,grub2,${GRUB_VER},${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-unknown}" \
        >> /tmp/sbat.csv

      ./grub-mkimage \
        -O x86_64-efi \
        -o /output/grub-efi-amd64-signed/usr/lib/grub/x86_64-efi-signed/grubx64.efi.signed \
        -d grub-core \
        -p /EFI/debian \
        --sbat /tmp/sbat.csv \
        ${GRUB_MODULES}

      cd /output/grub-efi-amd64-signed/
      ln -sf DEBIAN debian

      sed -i \
        -e "s|{{ VER }}|${GRUB_VER}|g" \
        DEBIAN/control
      rm -f debian

      # Sign the GRUB EFI binary with the Secure Boot signing key
      # Create key files with restrictive permissions immediately (umask 077
      # in a subshell) so they are never world-readable between creation and
      # the former chmod 600 call.
      (umask 077; echo "${SB_SIGNING_KEY}"  | base64 -d > /tmp/sb.key)
      (umask 077; echo "${SB_SIGNING_CERT}" | base64 -d > /tmp/sb.crt)

      sbsign \
        --key  /tmp/sb.key \
        --cert /tmp/sb.crt \
        --output /output/grub-efi-amd64-signed/usr/lib/grub/x86_64-efi-signed/grubx64.efi.signed \
        /output/grub-efi-amd64-signed/usr/lib/grub/x86_64-efi-signed/grubx64.efi.signed

      # Verify signature
      sbverify \
        --cert /tmp/sb.crt \
        /output/grub-efi-amd64-signed/usr/lib/grub/x86_64-efi-signed/grubx64.efi.signed \
        || { echo "ERROR: GRUB EFI signature verification failed" >&2; exit 1; }

      # Include the certificate in the package for MOK enrollment on target machines
      mkdir -p /output/grub-efi-amd64-signed/usr/share/debian-bootc
      cp /tmp/sb.crt \
        /output/grub-efi-amd64-signed/usr/share/debian-bootc/sb_signing.crt

      # Stage the signed grub where bootupd reads EFI components at install time
      # (/usr/lib/efi/<name>/<version>/EFI, cf. bootupd v0.2.35 src/efi.rs). We
      # place it under both EFI/debian (the NVRAM/vendor path bootupd points
      # efibootmgr at) and EFI/BOOT (the removable-media path): when firmware
      # boots \EFI\BOOT\BOOTX64.EFI (shim) with no NVRAM entry — e.g. a fresh VM —
      # shim only looks for grubx64.efi in its OWN directory (rhboot/shim
      # README.fallback), so grub must sit next to it there too. Paths match
      # workflows/tests.yml.
      for _sub in debian BOOT; do
        install -Dm0644 \
          /output/grub-efi-amd64-signed/usr/lib/grub/x86_64-efi-signed/grubx64.efi.signed \
          "/output/grub-efi-amd64-signed/usr/lib/efi/grub2/${GRUB_VER}/EFI/${_sub}/grubx64.efi"
      done

      # -----------------------------------------------------------
      # ISO EFI trio for the osbuild org.osbuild.grub2.iso stage of
      # bootc-image-builder: the stage copies /boot/efi/EFI/<vendor>/
      # {shim,mm,gcd}x64.efi and reads /usr/share/grub/unicode.pf2 out
      # of the deployed installer-image tree. Debian stages nothing
      # under /boot/efi inside a container (no ESP) and ships shim and
      # the MokManager UNSIGNED (shim-unsigned), so the trio is
      # assembled here: gcd is a second signed mkimage build of this
      # same source, shim and mm are the downloaded shim-unsigned
      # binaries signed with our Secure Boot key, and unicode.pf2 is
      # extracted from Debian grub-common (this build generates no
      # font). Staged under /usr/lib/debian-bootc/iso-efi — deliberately
      # NOT /usr/lib/efi, where a grub2-named directory is a bootupd
      # component and would clash with the real shim component when the
      # ESP content updates — and wired into /boot/efi/EFI/debian by
      # Containerfile.iso.
      # -----------------------------------------------------------
      _iso=/output/grub-efi-amd64-signed/usr/lib/debian-bootc/iso-efi/${GRUB_VER}/EFI/debian
      cd /build/grub2-fedora
      ./grub-mkimage \
        -O x86_64-efi \
        -o /tmp/gcdx64.efi \
        -d grub-core \
        -p /EFI/debian \
        --sbat /tmp/sbat.csv \
        ${GRUB_MODULES}
      sbsign \
        --key /tmp/sb.key \
        --cert /tmp/sb.crt \
        --output /tmp/gcdx64.efi \
        /tmp/gcdx64.efi
      sbverify \
        --cert /tmp/sb.crt \
        /tmp/gcdx64.efi \
        || { echo "ERROR: gcdx64.efi signature verification failed" >&2; exit 1; }

      mkdir -p /tmp/iso-efi
      apt-get update >/dev/null
      cd /tmp
      apt-get download grub-common shim-unsigned
      set -- ./grub-common_*.deb && dpkg-deb -x "$1" /tmp/iso-efi/font
      set -- ./shim-unsigned_*.deb && dpkg-deb -x "$1" /tmp/iso-efi/shim
      cd /build/grub2-fedora
      test -f /tmp/iso-efi/font/usr/share/grub/unicode.pf2 \
        || { echo "ERROR: grub-common carries no unicode.pf2" >&2; exit 1; }
      for _f in shimx64 mmx64; do
        sbsign \
          --key /tmp/sb.key \
          --cert /tmp/sb.crt \
          --output "/tmp/iso-efi/${_f}.efi" \
          "/tmp/iso-efi/shim/usr/lib/shim/${_f}.efi"
        sbverify \
          --cert /tmp/sb.crt \
          "/tmp/iso-efi/${_f}.efi" \
          || { echo "ERROR: ${_f}.efi signature verification failed" >&2; exit 1; }
      done
      install -Dm0644 /tmp/gcdx64.efi "${_iso}/gcdx64.efi"
      install -Dm0644 /tmp/iso-efi/shimx64.efi "${_iso}/shimx64.efi"
      install -Dm0644 /tmp/iso-efi/mmx64.efi "${_iso}/mmx64.efi"
      install -Dm0644 /tmp/iso-efi/font/usr/share/grub/unicode.pf2 \
        /output/grub-efi-amd64-signed/usr/share/grub/unicode.pf2
      rm -rf /tmp/iso-efi /tmp/gcdx64.efi

      # BIOS (i386-pc) platform. bootupd's BIOS component runs
      # `grub2-install --target i386-pc` guarded on /usr/lib/grub/i386-pc, so
      # build and install that platform's modules too (a second, out-of-tree
      # build so the in-tree EFI build above is untouched). This makes legacy
      # BIOS boot actually work rather than being silently skipped. Ref: bootupd
      # v0.2.35 src/bios.rs (check_grub_modules / run_grub_install).
      # The source tree is already configured in-tree for EFI above; grub refuses
      # a second configure until it is cleaned. The EFI binary is already built,
      # signed and staged, so distclean then reconfigure the same tree for
      # i386-pc in-tree.
      make -C /build/grub2-fedora distclean
      cd /build/grub2-fedora
      ./configure \
        --target=i386 \
        --with-platform=pc \
        --prefix=/usr \
        --sysconfdir=/etc \
        --disable-werror \
        --program-transform-name='s,grub,grub2,' \
        MAKEINFO=true
      make -j$(nproc)
      make -j$(nproc) install \
        DESTDIR=/output/grub-efi-amd64-signed \
        MAKEINFO=true
      cd "${SAVE_PWD}"

      rm -f /tmp/sb.key /tmp/sb.crt

      # Content checks: the grub2 userspace and BOTH platform module sets are
      # present, and grub is staged where bootupd reads it (the signed EFI binary
      # is already verified by sbverify above).
      _o=/output/grub-efi-amd64-signed
      test -x "${_o}/usr/bin/grub2-editenv" \
        && test -x "${_o}/usr/sbin/grub2-install" \
        && test -d "${_o}/usr/lib/grub/x86_64-efi" \
        && test -d "${_o}/usr/lib/grub/i386-pc" \
        || { echo "ERROR: grub userspace/modules incomplete" >&2; exit 1; }
      compgen -G "${_o}/usr/lib/efi/grub2/*/EFI/debian/grubx64.efi" >/dev/null \
        && compgen -G "${_o}/usr/lib/efi/grub2/*/EFI/BOOT/grubx64.efi" >/dev/null \
        || { echo "ERROR: grub not staged for bootupd" >&2; exit 1; }

      chmod 755 /output/grub-efi-amd64-signed/DEBIAN/postinst
      dpkg-deb --build /output/grub-efi-amd64-signed \
        /debs/grub-efi-amd64-signed_${GRUB_VER}_${ARCH}.deb

  # grub-efi-arm64-signed mirrors grub-efi-amd64-signed for the arm64 EFI
  # GRUB binary. It produces grubaa64.efi (arm64-efi target) signed for
  # Secure Boot. No BIOS i386-pc step — arm64 is EFI-only.
  - name: grub-efi-arm64-signed
    when:
      arch: arm64
    sources:
      - preinstall/output/grub-efi-arm64-signed
    # Rolling: the head of the Fedora GRUB mainline (the default branch of
    # rhboot/grub2) is resolved before each build; nothing is pinned.  If that
    # head does not build, the last-good published deb is kept.
    track:
      GRUB_COMMIT:
        repo: rhboot/grub2
        head: true
    secret-env:
      SB_SIGNING_KEY: SB_SIGNING_KEY
      SB_SIGNING_CERT: SB_SIGNING_CERT
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      ARCH=$(dpkg --print-architecture)
      trap 'rm -f /tmp/sb.key /tmp/sb.crt' EXIT

      git clone https://github.com/rhboot/grub2.git /build/grub2-fedora
      cd /build/grub2-fedora
      GRUB_BRANCH=$(git rev-parse --abbrev-ref HEAD)
      git checkout "${GRUB_COMMIT}"
      # Package version derived from the source: GRUB release, commit date
      # (monotonic, so apt always sees a newer head as an upgrade) and the
      # Fedora branch, e.g. 1+2.12+20261013+fedora46.
      GRUB_UPSTREAM=$(sed -n 's/^AC_INIT(\[GRUB\],\[\([^]]*\)\].*/\1/p' \
        configure.ac)
      GRUB_DATE=$(git show -s --format=%cd --date=format:%Y%m%d HEAD)
      GRUB_VER="1+${GRUB_UPSTREAM}+${GRUB_DATE}+${GRUB_BRANCH//-/}"
      echo "GRUB ${GRUB_VER} from ${GRUB_BRANCH}@${GRUB_COMMIT}"

      # bootstrap clones gnulib from git.savannah.gnu.org, which answers HTTP 500
      # now and then (run 41382456261, arm64). Retry with a growing pause on a
      # clean gnulib directory; a persistent failure still fails the build.
      for attempt in 1 2 3 4; do
        ./bootstrap && break
        [ "${attempt}" -lt 4 ] || exit 1
        rm -rf gnulib
        sleep $((attempt * 30))
      done

      ./configure \
        --target=aarch64 \
        --with-platform=efi \
        --prefix=/usr \
        --sysconfdir=/etc \
        --disable-werror \
        --program-transform-name='s,grub,grub2,' \
        MAKEINFO=true

      make -j$(nproc)

      make -j$(nproc) install \
        DESTDIR=/output/grub-efi-arm64-signed \
        MAKEINFO=true

      GRUB_MODULES=" \
        all_video boot blscfg btrfs blsuki \
        cat configfile cryptodisk \
        echo ext2 f2fs fat font \
        gcry_rijndael gcry_rsa gcry_serpent \
        gcry_sha256 gcry_twofish gcry_whirlpool \
        gfxmenu gfxterm gzio \
        halt hfsplus http increment iso9660 \
        jpeg loadenv loopback linux lvm luks luks2 \
        memdisk mdraid09 mdraid1x minicmd net \
        normal part_apple part_msdos part_gpt \
        password_pbkdf2 pgp png reboot regexp \
        search search_fs_uuid search_fs_file \
        search_label serial sleep \
        squash4 syslinuxcfg \
        test tftp version video xfs zstd \
        efi_netfs efifwsetup efinet lsefi lsefimmap connectefi \
        backtrace chain tpm"

      mkdir -p \
        /output/grub-efi-arm64-signed/usr/lib/grub/arm64-efi-signed

      # SBAT metadata: shim refuses (0x1A Security Violation) a next stage with
      # no .sbat section or a generation below its revocation policy. The grub
      # generation is taken from the Fedora packaging of this same source, so it
      # follows upstream instead of being pinned here; our own component line
      # lets a vulnerable build of this package be revoked on its own.
      curl -fsSL \
        https://src.fedoraproject.org/rpms/grub2/raw/rawhide/f/sbat.csv.in \
        | sed -n -e 's|^\(sbat,1,.*\)$|\1|p' \
                 -e "s|^\(grub,[0-9]*,.*\)@@VERSION@@,https//|\1${GRUB_UPSTREAM},https://|p" \
        > /tmp/sbat.csv
      grep -q '^grub,[0-9]' /tmp/sbat.csv \
        || { echo "ERROR: no grub SBAT line resolved" >&2; exit 1; }
      echo "grub.debian-bootc,1,debian-bootc,grub2,${GRUB_VER},${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-unknown}" \
        >> /tmp/sbat.csv

      ./grub-mkimage \
        -O arm64-efi \
        -o /output/grub-efi-arm64-signed/usr/lib/grub/arm64-efi-signed/grubaa64.efi.signed \
        -d grub-core \
        -p /EFI/debian \
        --sbat /tmp/sbat.csv \
        ${GRUB_MODULES}

      cd /output/grub-efi-arm64-signed/
      ln -sf DEBIAN debian

      sed -i \
        -e "s|{{ VER }}|${GRUB_VER}|g" \
        DEBIAN/control
      rm -f debian

      (umask 077; echo "${SB_SIGNING_KEY}"  | base64 -d > /tmp/sb.key)
      (umask 077; echo "${SB_SIGNING_CERT}" | base64 -d > /tmp/sb.crt)

      sbsign \
        --key  /tmp/sb.key \
        --cert /tmp/sb.crt \
        --output /output/grub-efi-arm64-signed/usr/lib/grub/arm64-efi-signed/grubaa64.efi.signed \
        /output/grub-efi-arm64-signed/usr/lib/grub/arm64-efi-signed/grubaa64.efi.signed

      sbverify \
        --cert /tmp/sb.crt \
        /output/grub-efi-arm64-signed/usr/lib/grub/arm64-efi-signed/grubaa64.efi.signed \
        || { echo "ERROR: GRUB EFI signature verification failed" >&2; exit 1; }

      mkdir -p /output/grub-efi-arm64-signed/usr/share/debian-bootc
      cp /tmp/sb.crt \
        /output/grub-efi-arm64-signed/usr/share/debian-bootc/sb_signing.crt

      # Stage where bootupd reads EFI components: EFI/debian (NVRAM vendor path)
      # and EFI/BOOT (removable-media fallback, next to the shim).
      for _sub in debian BOOT; do
        install -Dm0644 \
          /output/grub-efi-arm64-signed/usr/lib/grub/arm64-efi-signed/grubaa64.efi.signed \
          "/output/grub-efi-arm64-signed/usr/lib/efi/grub2/${GRUB_VER}/EFI/${_sub}/grubaa64.efi"
      done

      # -----------------------------------------------------------
      # ISO EFI trio for the osbuild org.osbuild.grub2.iso stage (same
      # rationale as the amd64 entry): gcd is a second signed mkimage
      # build of this source, the shim-unsigned deb (arm64) provides
      # unsigned shimaa64.efi and mmaa64.efi signed here with our
      # Secure Boot key, and unicode.pf2 comes from Debian grub-common. Staged
      # under /usr/lib/debian-bootc/iso-efi (NOT /usr/lib/efi — bootupd
      # component clash) and wired into /boot/efi/EFI/debian by
      # Containerfile.iso.
      # -----------------------------------------------------------
      _iso=/output/grub-efi-arm64-signed/usr/lib/debian-bootc/iso-efi/${GRUB_VER}/EFI/debian
      cd /build/grub2-fedora
      ./grub-mkimage \
        -O arm64-efi \
        -o /tmp/gcdaa64.efi \
        -d grub-core \
        -p /EFI/debian \
        --sbat /tmp/sbat.csv \
        ${GRUB_MODULES}
      sbsign \
        --key /tmp/sb.key \
        --cert /tmp/sb.crt \
        --output /tmp/gcdaa64.efi \
        /tmp/gcdaa64.efi
      sbverify \
        --cert /tmp/sb.crt \
        /tmp/gcdaa64.efi \
        || { echo "ERROR: gcdaa64.efi signature verification failed" >&2; exit 1; }

      mkdir -p /tmp/iso-efi
      apt-get update >/dev/null
      cd /tmp
      apt-get download grub-common shim-unsigned
      set -- ./grub-common_*.deb && dpkg-deb -x "$1" /tmp/iso-efi/font
      set -- ./shim-unsigned_*.deb && dpkg-deb -x "$1" /tmp/iso-efi/shim
      cd /build/grub2-fedora
      test -f /tmp/iso-efi/font/usr/share/grub/unicode.pf2 \
        || { echo "ERROR: grub-common carries no unicode.pf2" >&2; exit 1; }
      for _f in shimaa64 mmaa64; do
        sbsign \
          --key /tmp/sb.key \
          --cert /tmp/sb.crt \
          --output "/tmp/iso-efi/${_f}.efi" \
          "/tmp/iso-efi/shim/usr/lib/shim/${_f}.efi"
        sbverify \
          --cert /tmp/sb.crt \
          "/tmp/iso-efi/${_f}.efi" \
          || { echo "ERROR: ${_f}.efi signature verification failed" >&2; exit 1; }
      done
      install -Dm0644 /tmp/gcdaa64.efi "${_iso}/gcdaa64.efi"
      install -Dm0644 /tmp/iso-efi/shimaa64.efi "${_iso}/shimaa64.efi"
      install -Dm0644 /tmp/iso-efi/mmaa64.efi "${_iso}/mmaa64.efi"
      install -Dm0644 /tmp/iso-efi/font/usr/share/grub/unicode.pf2 \
        /output/grub-efi-arm64-signed/usr/share/grub/unicode.pf2
      rm -rf /tmp/iso-efi /tmp/gcdaa64.efi

      # EFI/BOOT/BOOTAA64.EFI is NOT staged here: it is the shim (staged by the
      # bootupd postinst), which loads grubaa64.efi from its own directory.
      # Putting grub there too would make the two components own the same path
      # and boot grub without the shim.

      rm -f /tmp/sb.key /tmp/sb.crt

      _o=/output/grub-efi-arm64-signed
      test -x "${_o}/usr/bin/grub2-editenv" \
        && test -x "${_o}/usr/sbin/grub2-install" \
        && test -d "${_o}/usr/lib/grub/arm64-efi" \
        || { echo "ERROR: grub userspace/modules incomplete" >&2; exit 1; }
      compgen -G "${_o}/usr/lib/efi/grub2/*/EFI/debian/grubaa64.efi" >/dev/null \
        && compgen -G "${_o}/usr/lib/efi/grub2/*/EFI/BOOT/grubaa64.efi" >/dev/null \
        || { echo "ERROR: grubaa64.efi not staged for bootupd" >&2; exit 1; }

      chmod 755 /output/grub-efi-arm64-signed/DEBIAN/postinst
      dpkg-deb --build /output/grub-efi-arm64-signed \
        /debs/grub-efi-arm64-signed_${GRUB_VER}_${ARCH}.deb

  - name: bootupd
    sources:
      - preinstall/output/bootupd
      - bootupd-src
    # Rolling release: the CI resolves the latest upstream release (tag and
    # vendor tarball SHA-256) before each build. If it does not build, the
    # last-good published deb is kept and an issue is opened.
    track:
      BOOTUPD_VER:
        repo: coreos/bootupd
        digests:
          BOOTUPD_VENDOR_SHA256: "bootupd-{version}-vendor.tar.zstd"
    env:
      CARGO_HOME: "/build/rust"
      RUSTUP_HOME: "/build/rust"
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      ARCH=$(dpkg --print-architecture)
      rm -rf /build/vendor && mkdir /build/vendor

      git clone --depth=1 --branch "${BOOTUPD_VER}" \
        https://github.com/coreos/bootupd.git /build/bootupd

      # Debian port: bootupd upstream reads the rpm database for bootloader
      # package metadata (packagesystem::query_files); Debian has none. Patch it
      # to fall back to dpkg so the BIOS component's generate-update-metadata
      # works here instead of crashing. The rpm path stays intact for Fedora.
      deb_src_overlay "${SAVE_PWD}/workflows/bootc-debs-builder/bootupd-src" /build/bootupd

      curl --retry 3 -fsSL \
        "https://github.com/coreos/bootupd/releases/download/${BOOTUPD_VER}/bootupd-${BOOTUPD_VER#v}-vendor.tar.zstd" \
        -o /tmp/bootupd-vendor.tar.zstd
      printf '%s  /tmp/bootupd-vendor.tar.zstd\n' "${BOOTUPD_VENDOR_SHA256}" \
        | sha256sum -c -
      tar --zstd -x -C /build/ -f /tmp/bootupd-vendor.tar.zstd

      . ${RUSTUP_HOME}/env
      cargo build --release --manifest-path /build/bootupd/Cargo.toml

      # Content check on the applied dpkg patch: the patch adds a unit test that
      # exercises query_files_dpkg against a real dpkg-owned file, so a patch that
      # compiles but behaves wrong fails HERE. Require it to actually run (>=1
      # passed) so a vacuous "0 tests" can't pass silently. On failure the build
      # aborts; CI then keeps the last-good bootupd deb and opens an issue instead
      # of shipping a broken package.
      chk=$(cargo test --release --manifest-path /build/bootupd/Cargo.toml \
        query_files_dpkg 2>&1) || { printf '%s\n' "${chk}"; exit 1; }
      printf '%s\n' "${chk}"
      printf '%s\n' "${chk}" \
        | grep -qE 'test result: ok\. [1-9][0-9]* passed' \
        || { echo "ERROR: dpkg patch content check did not run" >&2; exit 1; }

      make -C /build/bootupd install-all DESTDIR=/output/bootupd

      cd /output/bootupd/
      ln -sf DEBIAN debian

      dpkg-shlibdeps \
        -O /build/bootupd/target/release/bootupd \
        | sed 's/shlibs:Depends=//' > /tmp/bootupd-deps

      DEPS="$(cat /tmp/bootupd-deps), util-linux"
      GRUB_ARCH="${ARCH}"
      sed -i \
        -e "s|{{ VER }}|${BOOTUPD_VER#v}|g" \
        -e "s|{{ DEPS }}|${DEPS}|g" \
        -e "s|{{ ARCH }}|${ARCH}|g" \
        -e "s|{{ GRUB_ARCH }}|${GRUB_ARCH}|g" \
        /output/bootupd/DEBIAN/control

      # Content check: the built bootupd binary exists (its patched dpkg
      # behaviour is validated by cargo test above).
      _b=$(find /output/bootupd -type f -name bootupd | head -1)
      test -n "${_b}" && test -s "${_b}" \
        || { echo "ERROR: bootupd binary missing from output" >&2; exit 1; }

      rm -f /output/bootupd/debian
      dpkg-deb --build /output/bootupd /debs/bootupd_${BOOTUPD_VER#v}_${ARCH}.deb

  - name: libcomposefs
    sources:
      - preinstall/output/libcomposefs
    track:
      COMPOSEFS_VER:
        repo: composefs/composefs
    build: |
      set -euo pipefail
      ARCH=$(dpkg --print-architecture)
      git clone --depth=1 --branch "${COMPOSEFS_VER}" \
        https://github.com/composefs/composefs.git /build/composefs

      meson setup \
        --prefix=/usr \
        --libdir=/usr/lib \
        --buildtype=plain \
        /build/composefs-build \
        /build/composefs

      meson compile -C /build/composefs-build

      # Install to DESTDIR for packaging
      DESTDIR=/output/libcomposefs meson install -C /build/composefs-build

      # Install to system so ostree build finds it
      meson install -C /build/composefs-build

      cd /output/libcomposefs/
      ln -sf DEBIAN debian

      # Generate shlibs
      SO=$(find /output/libcomposefs/usr/lib -name "libcomposefs.so.*" ! -type l | head -1)
      SONAME=$(objdump -p $SO | awk '/SONAME/{print $2}')
      LIBBASE=$(echo $SONAME | sed 's/\.so\..*//')
      SOVERSION=$(echo $SONAME | sed 's/.*\.so\.//')
      echo "${LIBBASE} ${SOVERSION} libcomposefs" > /output/libcomposefs/DEBIAN/shlibs

      # Content check: the shared library built and its SONAME resolved.
      test -s "${SO}" && test -n "${SONAME}" \
        || { echo "ERROR: libcomposefs.so not built or SONAME unresolved" >&2; exit 1; }

      sed -i \
        -e "s|{{ VER }}|${COMPOSEFS_VER#v}|g" \
        -e "s|{{ ARCH }}|${ARCH}|g" \
        DEBIAN/control

      rm -f debian
      dpkg-deb --build /output/libcomposefs \
        /debs/libcomposefs_${COMPOSEFS_VER#v}_${ARCH}.deb

      # Install into the build environment so dpkg-shlibdeps can resolve libcomposefs
      # when building the ostree package in the next step.
      apt install -y /debs/libcomposefs_${COMPOSEFS_VER#v}_${ARCH}.deb

  - name: ostree
    deps:
      - libcomposefs
    deb-glob: "libostree_*"
    sources:
      - preinstall/output/ostree
      - ostreepostinstall
    track:
      OSTREE_VER:
        repo: ostreedev/ostree
        strip-v: true
        digests:
          OSTREE_SHA256: "libostree-{version}.tar.xz"
    env:
      CARGO_HOME: "/build/rust"
      RUSTUP_HOME: "/build/rust"
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      ARCH=$(dpkg --print-architecture)
      rm -rf /build/vendor && mkdir /build/vendor

      curl --retry 3 -fsSL \
        "https://github.com/ostreedev/ostree/releases/download/v${OSTREE_VER}/libostree-${OSTREE_VER}.tar.xz" \
        -o /tmp/libostree.tar.xz
      printf '%s  /tmp/libostree.tar.xz\n' "${OSTREE_SHA256}" | sha256sum -c -
      tar -xJ -C /build -f /tmp/libostree.tar.xz
      cd /build/libostree-${OSTREE_VER}

      ./configure --prefix=/usr --sysconfdir=/etc \
        --disable-gtk-doc --disable-man \
        --with-composefs \
        --with-systemdsystemunitdir=/usr/lib/systemd/system \
        --with-systemdsystemgeneratordir=/usr/lib/systemd/system-generators \
        --with-dracut

      make -j$(nproc)
      make -j$(nproc) install DESTDIR=/output/ostree

      # Verify and fail loudly if missing
      test -d /output/ostree/usr/lib/dracut/modules.d/50ostree \
        || { echo "ERROR: 50ostree dracut module missing from build output" >&2; exit 1; }
      test -f /output/ostree/usr/lib/systemd/system-generators/ostree-system-generator \
        || { echo "ERROR: ostree-system-generator missing from build output" >&2; exit 1; }

      cd /output/ostree/
      ln -sf DEBIAN debian

      dpkg-shlibdeps \
        -l/output/ostree/usr/lib \
        -O $(find . -name "libostree-1.so*" ! -name "*.la" | head -1) \
        | sed 's/shlibs:Depends=//' > /tmp/ostree-deps

      SO=$(find /output/ostree/usr/lib -name "libostree-1.so.*" ! -name "*.la" ! -type l | head -1)
      SONAME=$(objdump -p $SO | awk '/SONAME/{print $2}')
      LIBBASE=$(echo $SONAME | sed 's/\.so\..*//')
      SOVERSION=$(echo $SONAME | sed 's/.*\.so\.//')
      echo "${LIBBASE} ${SOVERSION} libostree" > /output/ostree/DEBIAN/shlibs

      # Content check: the libostree shared object built (complements the dracut
      # module and system-generator checks above).
      test -s "${SO}" && test -n "${SONAME}" \
        || { echo "ERROR: libostree.so not built or SONAME unresolved" >&2; exit 1; }

      DEPS=$(cat /tmp/ostree-deps)
      sed -i \
        -e "s|{{ VER }}|${OSTREE_VER}|g" \
        -e "s|{{ DEPS }}|${DEPS}|g" \
        -e "s|{{ ARCH }}|${ARCH}|g" \
        /output/ostree/DEBIAN/control
      cp -r "${SAVE_PWD}"/workflows/bootc-debs-builder/ostreepostinstall/* /output/ostree/

      rm -f /output/ostree/debian
      dpkg-deb --build /output/ostree /debs/libostree_${OSTREE_VER}_${ARCH}.deb
      apt install -y /debs/libostree_${OSTREE_VER}_${ARCH}.deb

  - name: bootc
    deps:
      - ostree
    sources:
      - preinstall/output/bootc
      - bootcpostinstall
    track:
      BOOTC_VER:
        repo: bootc-dev/bootc
        digests:
          BOOTC_VENDOR_SHA256: "bootc-{version}-vendor.tar.zstd"
    env:
      CARGO_HOME: "/build/rust"
      RUSTUP_HOME: "/build/rust"
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      ARCH=$(dpkg --print-architecture)
      rm -rf /build/vendor && mkdir /build/vendor

      git clone --depth=1 --branch "${BOOTC_VER}" \
        https://github.com/bootc-dev/bootc.git /build/bootc

      curl -fsSL \
        "https://github.com/bootc-dev/bootc/releases/download/${BOOTC_VER}/bootc-${BOOTC_VER#v}-vendor.tar.zstd" \
        -o /tmp/bootc-vendor.tar.zstd
      printf '%s  /tmp/bootc-vendor.tar.zstd\n' "${BOOTC_VENDOR_SHA256}" \
        | sha256sum -c -
      tar --zstd -x -C /build/ -f /tmp/bootc-vendor.tar.zstd

      . ${RUSTUP_HOME}/env
      cargo build --release --manifest-path /build/bootc/Cargo.toml

      make -j$(nproc) -C /build/bootc manpages DESTDIR=/output/bootc
      make -C /build/bootc install-all DESTDIR=/output/bootc

      cd /output/bootc/
      ln -sf DEBIAN debian

      dpkg-shlibdeps \
        -l/output/ostree/usr/lib \
        -l/output/bootc/usr/lib \
        -S/output/ostree \
        -O /build/bootc/target/release/bootc \
        | sed 's/shlibs:Depends=//' > /tmp/bootc-deps

      DEPS=$(cat /tmp/bootc-deps)
      sed -i \
        -e "s|{{ VER }}|${BOOTC_VER#v}|g" \
        -e "s|{{ DEPS }}|${DEPS}|g" \
        -e "s|{{ ARCH }}|${ARCH}|g" \
        /output/bootc/DEBIAN/control
      cp -r "${SAVE_PWD}"/workflows/bootc-debs-builder/bootcpostinstall/* /output/bootc/

      chmod 755 \
        /output/bootc/DEBIAN/postinst \
        /output/bootc/usr/local/bin/bootc-finalize \
        /output/bootc/etc/kernel/postinst.d/zz-bootc-finalize

      # Content check: the bootc binary built and our finalize helper +
      # autonomous kernel hook are valid. The hook is what makes the kernel
      # relocation propagate to any downstream image with no Containerfile
      # change, so a broken hook must fail the build.
      test -s /build/bootc/target/release/bootc \
        || { echo "ERROR: bootc binary not built" >&2; exit 1; }
      bash -n /output/bootc/usr/local/bin/bootc-finalize \
        || { echo "ERROR: bootc-finalize script broken" >&2; exit 1; }
      sh -n /output/bootc/etc/kernel/postinst.d/zz-bootc-finalize \
        || { echo "ERROR: zz-bootc-finalize kernel hook broken" >&2; exit 1; }
      test -x /output/bootc/etc/kernel/postinst.d/zz-bootc-finalize \
        || { echo "ERROR: zz-bootc-finalize kernel hook not executable" >&2; exit 1; }

      rm -f /output/bootc/debian
      dpkg-deb --build /output/bootc /debs/bootc_${BOOTC_VER#v}_${ARCH}.deb

  # ===========================================================================
  # fisherman — Go CLI backend for bootc OS installation.
  # CGO_ENABLED=0 → fully static binary, no libc dependency.
  # go.sum is empty (zero external deps); build is pure stdlib + internal pkgs.
  # Pinned to a specific commit; bump FISHERMAN_COMMIT + FISHERMAN_VER together.
  # ===========================================================================
  - name: fisherman
    sources:
      - preinstall/output/fisherman
      - fisherman-src
    env:
      FISHERMAN_COMMIT: "4dc8f1cca20e9808c123ed95e572f9106a9be18e"
      FISHERMAN_VER: "0.3.0+git4dc8f1c+bootc1"
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      ARCH=$(dpkg --print-architecture)
      GOARCH="${ARCH}"

      # Install Go from Debian (Trixie ships golang-go >= 1.22 which fisherman
      # requires; fail fast with a version check before touching the source).
      apt-get update
      apt-get install -y --no-install-recommends golang-go
      go_ver=$(go version | awk '{print $3}' | sed 's/go//')
      go_major=$(printf '%s' "${go_ver}" | cut -d. -f1)
      go_minor=$(printf '%s' "${go_ver}" | cut -d. -f2)
      if [ "${go_major}" -lt 1 ] || { [ "${go_major}" -eq 1 ] && [ "${go_minor}" -lt 22 ]; }; then
        echo "ERROR: Go ${go_ver} < 1.22 (fisherman requires go 1.22)" >&2; exit 1
      fi
      go version

      # Clone fisherman at the pinned commit. Full clone (no --depth=1) so a
      # bare commit SHA can be checked out regardless of branch position.
      git clone https://github.com/tuna-os/fisherman.git /build/fisherman-src
      git -C /build/fisherman-src checkout "${FISHERMAN_COMMIT}"

      # Recipe fields `autoUpdate: false` (masks the bootc update timer in the
      # installed /etc, the opt-out documented in docs/building.md), and
      # `rootPassword` / `sshRootLogin` (replace the first-boot setup service).
      deb_src_overlay "${SAVE_PWD}/workflows/bootc-debs-builder/fisherman-src" /build/fisherman-src

      # Build — CGO_ENABLED=0 gives a fully static binary.
      CGO_ENABLED=0 GOARCH="${GOARCH}" go build \
        -C /build/fisherman-src/fisherman \
        -ldflags "-s -w -X main.version=${FISHERMAN_VER}" \
        -o /tmp/fisherman-bin \
        ./cmd/fisherman

      # Stage the binary and polkit policy into the output tree.
      install -Dm755 /tmp/fisherman-bin \
        /output/fisherman/usr/local/bin/fisherman
      install -Dm644 \
        /build/fisherman-src/data/polkit/org.tunaos.Installer.policy \
        /output/fisherman/usr/share/polkit-1/actions/org.tunaos.Installer.policy

      # Validate: binary runs and reports version.
      /output/fisherman/usr/local/bin/fisherman version 2>/dev/null \
        | grep -q "fisherman" \
        || { echo "ERROR: fisherman version check failed" >&2; exit 1; }

      sed -i \
        -e "s|{{ VER }}|${FISHERMAN_VER}|g" \
        -e "s|{{ ARCH }}|${ARCH}|g" \
        /output/fisherman/DEBIAN/control

      dpkg-deb --build /output/fisherman \
        "/debs/fisherman_${FISHERMAN_VER}_${ARCH}.deb"

      test -s "/debs/fisherman_${FISHERMAN_VER}_${ARCH}.deb" \
        || { echo "ERROR: fisherman deb empty or missing" >&2; exit 1; }

  # ===========================================================================
  # bootc-installer — GTK4/Libadwaita/Python3 graphical frontend for fisherman.
  # Meson build with blueprint-compiler for the .blp UI sources.
  # Architecture-independent (Python + GResources), but tied to the fisherman
  # dep which IS arch-specific, so we build on the target arch runner.
  # ===========================================================================
  - name: bootc-installer
    deps:
      - fisherman
    sources:
      - preinstall/output/bootc-installer
      - bootc-installer-src
    env:
      BOOTC_INSTALLER_COMMIT: "0290d4fb469a3a6fd8114a28f1eb429db8b6e2e5"
      BOOTC_INSTALLER_VER: "3.0.0+git0290d4f+bootc8"
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      ARCH=$(dpkg --print-architecture)

      # Build deps: meson/ninja are in the buildenv; add blueprint-compiler and
      # the GTK4/Adwaita/GnomeDesktop/GWeather dev headers for meson introspection.
      apt-get update
      apt-get install -y --no-install-recommends \
        blueprint-compiler \
        libgtk-4-dev \
        libadwaita-1-dev \
        libgnome-desktop-4-dev \
        libgweather-4-dev \
        libnm-dev \
        appstream \
        desktop-file-utils \
        librsvg2-bin

      # Clone at the pinned commit (shallow not possible with a bare commit SHA).
      git clone https://github.com/frostyard/bootc-installer.git /build/bootc-installer-src
      git -C /build/bootc-installer-src checkout "${BOOTC_INSTALLER_COMMIT}"

      # Installer steps: Secure Boot MOK enrollment of the DaemonCores signing
      # certificate (live image helper /usr/libexec/debian-bootc/mok-stage), the
      # automatic updates switch (recipe field `autoUpdate`), and the system
      # settings step (hostname, root password, sudo, SSH root login) that
      # replaces the first-boot setup service and needs the fisherman recipe
      # fields of fisherman-src.
      deb_src_overlay "${SAVE_PWD}/workflows/bootc-debs-builder/bootc-installer-src" /build/bootc-installer-src

      # 05/11 restructure: the repo tree flattened one level (the mirror of
      # the upstream ROOT is upstream's bootc_installer/ subtree, not the
      # repo dir). deb_overlay_apply mirrors relative paths — so the real
      # src files of the overlay are re-landed at their upstream
      # bootc_installer/<sub> paths; the .patch files ride the overlay
      # apply directly (applied from the overlay dir, -p1) and need no copy.
      _OVL="${SAVE_PWD}/workflows/bootc-debs-builder/bootc-installer-src"
      for f in \
          defaults/autoupdate.py defaults/gpu_security.py defaults/system.py \
          gtk/default-autoupdate.blp gtk/default-gpu-security.blp gtk/default-system.blp \
          utils/gpu_config.py utils/locale_config.py utils/mok_stage.py \
          utils/system_config.py; do
        install -D -m644 "${_OVL}/${f}" \
          "/build/bootc-installer-src/bootc_installer/${f}"
      done

      # The fisherman submodule contains data/images/ (distribution logos) that
      # bootc-installer.gresource.xml references at build time. Initialize it so
      # those image files are available. The fisherman binary itself is NOT built
      # (build-fisherman=false) — we package it separately — but the data dir is needed.
      git -C /build/bootc-installer-src submodule update --init fisherman

      # Auto-generate images.json from the Containerfiles in the repo root.
      # gen-recipe.py reads IMAGE_REGISTRY from the environment and scans the
      # ctx_dir for Containerfile* to build the image list. The tracked
      # recipe.json is the STATIC template only (P-196b: no hardcoded
      # catalog — imgref/images are generated here, as in every consumer);
      # gen-recipe.py keeps the other fields from it in-place.
      # GITHUB_REPOSITORY is set by GitHub Actions (e.g. DaemonCores/debian-bootc).
      IMAGE_REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
      TEMPLATE="${SAVE_PWD}/src/buildisopreinstall/etc/bootc-installer/recipe.json"
      cp "${TEMPLATE}" /tmp/gen-recipe-work.json
      IMAGE_REGISTRY="${IMAGE_REGISTRY}" \
        python3 "${SAVE_PWD}/src/buildisopreinstall/usr/libexec/debian-bootc/gen-recipe.py" \
          "${SAVE_PWD}" /tmp/gen-recipe-work.json
      cp /tmp/gen-recipe-work.json \
        /build/bootc-installer-src/fisherman/data/images.json

      # Inject DaemonCores branding assets before meson compiles the GResource bundle.
      # welcome.svg is rasterised to PNG at 512×512 (displayed at 128px by the installer).
      # Upstream commit 0290d4fb restructured the repo; assets/ may not exist yet.
      mkdir -p /build/bootc-installer-src/assets
      rsvg-convert -w 512 -h 512 \
        "${SAVE_PWD}/assets/installer/welcome.svg" \
        -o /build/bootc-installer-src/assets/welcome.png
      cp "${SAVE_PWD}/assets/installer/complete.svg" \
        /build/bootc-installer-src/assets/complete.svg
      cp "${SAVE_PWD}/assets/installer/ready.svg" \
        /build/bootc-installer-src/assets/ready.svg
      cp "${SAVE_PWD}/assets/installer/containerized.svg" \
        /build/bootc-installer-src/assets/containerized.svg

      # Build with meson. build-fisherman=false: we package fisherman separately.
      meson setup \
        --prefix=/usr \
        -Dbuild-fisherman=false \
        /build/bootc-installer-build \
        /build/bootc-installer-src

      meson compile -C /build/bootc-installer-build

      # Install to DESTDIR for packaging.
      DESTDIR=/output/bootc-installer \
        meson install -C /build/bootc-installer-build

      # Content check: the installed launcher and GResource bundle exist.
      test -x /output/bootc-installer/usr/bin/bootc-installer \
        || { echo "ERROR: bootc-installer launcher missing" >&2; exit 1; }
      _res=$(find /output/bootc-installer/usr -name "*.gresource" | head -1)
      test -n "${_res}" && test -s "${_res}" \
        || { echo "ERROR: bootc-installer GResource bundle missing" >&2; exit 1; }
      _mok=$(find /output/bootc-installer/usr -name mok_stage.py | head -1)
      test -n "${_mok}" \
        || { echo "ERROR: bootc-installer MOK module missing" >&2; exit 1; }

      sed -i \
        -e "s|{{ VER }}|${BOOTC_INSTALLER_VER}|g" \
        /output/bootc-installer/DEBIAN/control

      cd /output/bootc-installer
      # dpkg-deb has a tar buffer-reuse bug that corrupts filenames starting at
      # entry ~172 when the package has many locale files (the Turkish locale dir
      # `tr/` gets the prior entry's `tl/` buffer prefix, breaking the tar).
      # Assemble the deb manually with system tar + ar to bypass that code path.
      find . -not -path './DEBIAN' -not -path './DEBIAN/*' -type f \
        | LC_ALL=C sort | xargs md5sum \
        | sed 's|^\([0-9a-f]*\)  \./|\1  |' \
        > ./DEBIAN/md5sums
      tar --owner=0 --group=0 --numeric-owner \
        --exclude=./DEBIAN -czf /tmp/data.tar.gz .
      tar --owner=0 --group=0 --numeric-owner \
        -czf /tmp/control.tar.gz -C ./DEBIAN .
      printf '2.0\n' > /tmp/debian-binary
      ar qc "/debs/bootc-installer_${BOOTC_INSTALLER_VER}_all.deb" \
        /tmp/debian-binary /tmp/control.tar.gz /tmp/data.tar.gz

      test -s "/debs/bootc-installer_${BOOTC_INSTALLER_VER}_all.deb" \
        || { echo "ERROR: bootc-installer deb empty or missing" >&2; exit 1; }

      # The first-boot questions are native Libadwaita pages (owner 04/11):
      # hostname, locale, keyboard, root account and the SSH root policy ride
      # the system page, the NVIDIA EULA consent the gpu-security page; the
      # tty firstboot wizard is gone. The pages live inside the compiled
      # GResource bundle, checked here so a lost compile input fails the deb
      # build instead of shipping an ISO without its setup screens.
      _res=$(find /output/bootc-installer/usr -name "*.gresource" | head -1)
      test -n "${_res}" && test -s "${_res}" \
        || { echo "ERROR: GResource bundle missing" >&2; exit 1; }
      _sys=$(grep -ac "default-system" "${_res}" || true)
      test "${_sys}" -ge 1 \
        || { echo "ERROR: system page missing from the GResource bundle" >&2; exit 1; }
      _gpu=$(grep -ac "default-gpu-security" "${_res}" || true)
      test "${_gpu}" -ge 1 \
        || { echo "ERROR: gpu-security page missing from the GResource bundle" >&2; exit 1; }

  # ===========================================================================
  # podman — the bootc-image-builder type `bootc-installer` runs osbuild INSIDE
  # the installer image and drives the payload image with the podman of that
  # build root: `podman image mount` needs podman >= 5.8, and trixie ships
  # 5.4.2 only (DEBUG.md Tick 35, proven with trixie 5.4.2 failing the same
  # command that Debian sid 5.8.6 runs). Built from the upstream source tag
  # (vendored tree) with the Go 1.25 toolchain of trixie-backports — the
  # vendored gvisor-tap-vsock requires go >= 1.25. The libsubid cgo of
  # containers/storage is NOT enabled (no `libsubid` build tag), so the binary
  # parses /etc/subuid and /etc/subgid itself: the libsubid6 that the sid
  # binary depends on needs glibc 2.43 and cannot run in trixie (glibc 2.41,
  # `__memset_explicit_chk@GLIBC_2.43` unresolved — proven by link test). The
  # sid PODMAN binary itself is glibc-compatible (2.38) and was the base of
  # the local rootful proof; this entry makes it a reproducible CI build.
  # ===========================================================================
  - name: podman
    sources:
      - preinstall/output/podman
    env:
      PODMAN_TAG: v5.8.6
      PODMAN_VER: 1:5.8.6+bootc1
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      ARCH=$(dpkg --print-architecture)
      SUITE=$(. /etc/os-release && echo "${VERSION_CODENAME:?}")
      GO_BIN=/usr/lib/go-1.25/bin/go
      # Epoch kept out of the filename (Debian convention); the artifact
      # uploader rejects colons anyway.
      FILE_VER="${PODMAN_VER#1:}"

      git clone --depth 1 --branch "${PODMAN_TAG}" \
        https://github.com/containers/podman.git /build/podman
      test -d /build/podman/vendor \
        || { echo "ERROR: podman tag ${PODMAN_TAG} carries no vendor tree" >&2; exit 1; }

      # The vendored modules require go >= 1.25; trixie ships 1.24. The 1.25
      # toolchain lives in trixie-backports (kept out of the default solve:
      # -t, exactly like every other backport consumer).
      echo "deb http://deb.debian.org/debian ${SUITE}-backports main" \
        >/etc/apt/sources.list.d/backports.list
      apt-get update
      apt-get install -y --no-install-recommends \
        -t "${SUITE}-backports" golang-1.25-go \
        libgpgme-dev
      test -x "${GO_BIN}" \
        || { echo "ERROR: golang-1.25-go did not install" >&2; exit 1; }
      "${GO_BIN}" version

      PATH=/usr/lib/go-1.25/bin:"${PATH}" go build \
        -C /build/podman \
        -mod=vendor \
        -tags "exclude_graphdriver_btrfs" \
        -trimpath \
        -ldflags "-s -w" \
        -o /tmp/podman-bin \
        ./cmd/podman \
        || { echo "ERROR: podman build failed" >&2; exit 1; }

      cp -r "${SAVE_PWD}"/workflows/bootc-debs-builder/preinstall/output/podman \
        /output/podman
      install -Dm755 /tmp/podman-bin /output/podman/usr/bin/podman
      install -Dm644 /build/podman/LICENSE \
        /output/podman/usr/share/doc/podman/copyright
      rm -rf /build/podman /tmp/podman-bin

      # Functional check: the binary runs and reports the tag version.
      test -x /output/podman/usr/bin/podman \
        && /output/podman/usr/bin/podman --version 2>/dev/null \
        | grep -qF "5.8.6" \
        || { echo "ERROR: podman binary broken or wrong version" >&2; exit 1; }

      sed -i \
        -e "s|{{ VER }}|${PODMAN_VER}|g" \
        -e "s|{{ ARCH }}|${ARCH}|g" \
        /output/podman/DEBIAN/control
      grep -qF "Version: ${PODMAN_VER}" /output/podman/DEBIAN/control \
        || { echo "ERROR: podman rewritten Version missing/wrong" >&2; exit 1; }

      find /output/podman -not -path '*/DEBIAN/*' -type f \
        | xargs md5sum \
        | sed "s|/output/podman/||" \
        > /output/podman/DEBIAN/md5sums
      dpkg-deb --build /output/podman \
        "/debs/podman_${FILE_VER}_${ARCH}.deb"
      test -s "/debs/podman_${FILE_VER}_${ARCH}.deb" \
        || { echo "ERROR: podman deb empty or missing" >&2; exit 1; }

      # Library sanity: the built binary must only need trixie-shippable
      # libraries (no libsubid6, no btrfs cgo).
      rm -rf /tmp/podman-check
      dpkg-deb -x "/debs/podman_${FILE_VER}_${ARCH}.deb" /tmp/podman-check
      _needed=$(objdump -p /tmp/podman-check/usr/bin/podman | grep NEEDED)
      echo "${_needed}" | grep -E "libgpgme.so.11|libc.so.6" >/dev/null \
        || { echo "ERROR: unexpected link map: ${_needed}" >&2; exit 1; }
      if echo "${_needed}" | grep libsubid; then
        echo "ERROR: libsubid must not be linked" >&2
        exit 1
      fi
      rm -rf /tmp/podman-check

  # ===========================================================================
  # netavark — podman 5.8 pairs with a netavark of the 1.15+ line (the network
  # stack is spawned per network and talks its own versioned protocol; trixie
  # ships 1.14 only). The sid binary is glibc-compatible with trixie (its
  # build needs 2.39, trixie has 2.41 — unlike shadow's libsubid6), so it is
  # REPACKED from the sid lane and retagged, not rebuilt. Rolling like the
  # grub entries: the sid candidate is resolved at each build, a version
  # regression is refused, and the epoch keeps our deb above the sid rebuilds.
  # ===========================================================================
  - name: netavark
    build: |
      set -euo pipefail
      SAVE_PWD=$(pwd)
      ARCH=$(dpkg --print-architecture)
      mkdir -p /output/netavark /tmp/netavark-dl

      echo "deb http://deb.debian.org/debian sid main" \
        >/etc/apt/sources.list.d/sid-download.list
      apt-get update
      cd /tmp/netavark-dl
      apt-get download netavark/sid
      rm -f /etc/apt/sources.list.d/sid-download.list
      set -- ./netavark_*.deb
      [ -f "${1:-}" ] \
        || { echo "ERROR: no sid netavark deb left in /tmp/netavark-dl" >&2; exit 1; }
      UP_DEB="$1"
      ORIG_VER=$(dpkg-deb -f "${UP_DEB}" Version)
      case "${ORIG_VER}" in
        1.1[5-9]*|1.[2-9]*|2.*|3.*) : ;;
        *) echo "ERROR: sid netavark ${ORIG_VER} is below the 1.15 podman-5.8 baseline" >&2; exit 1 ;;
      esac
      echo "netavark ${ORIG_VER} repacked from sid"

      dpkg-deb -R "${UP_DEB}" /output/netavark
      rm -rf /tmp/netavark-dl
      find /output/netavark -not -path '*/DEBIAN/*' -type f \
        | xargs md5sum \
        | sed "s|/output/netavark/||" \
        > /output/netavark/DEBIAN/md5sums
      sed -i "s/^Version: .*/Version: 1:${ORIG_VER}+bootc1/" \
        /output/netavark/DEBIAN/control
      grep -qF "Version: 1:${ORIG_VER}+bootc1" /output/netavark/DEBIAN/control \
        || { echo "ERROR: netavark rewritten Version missing/wrong" >&2; exit 1; }

      cd "${SAVE_PWD}"
      dpkg-deb --build /output/netavark \
        "/debs/netavark_${ORIG_VER}+bootc1_${ARCH}.deb"
      test -s "/debs/netavark_${ORIG_VER}+bootc1_${ARCH}.deb" \
        || { echo "ERROR: netavark deb empty or missing" >&2; exit 1; }
