reproducible=yes
hostonly=no
compress=zstd
add_dracutmodules+=" bootc lvm ostree btrfs "
add_drivers+=" erofs overlay "
# KMS drivers for the common virtual / firmware displays.  Without one the
# initramfs has no framebuffer: the LUKS passphrase prompt (systemd-cryptsetup
# runs in the initrd) is invisible on the screen and the boot looks hung.
# Each one must be built as a module in kernel-src/config.cfg (unit-tested).
add_drivers+=" simpledrm bochs virtio_gpu cirrus-qemu qxl vmwgfx hyperv_drm "
filesystems+=" xfs btrfs "
systemdsystemconfdir=/etc/systemd/system
systemdsystemunitdir=/usr/lib/systemd/system