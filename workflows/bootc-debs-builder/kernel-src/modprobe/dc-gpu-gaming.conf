# kernel/modules/gpu/modprobe/dc-gpu-gaming.conf
# Loader policy of the gpu-gaming set (GPU FINAL, owner 2026-11-03), shipped
# at /etc/modprobe.d/dc-gpu-gaming.conf by the gpu-gaming deb — installed
# alone (the in-tree GPU sets conflict with each other).
#
# Display profile: amdgpu is built WITH Display Core (the overlay
# kernel/modules/gpu/gaming) and every vendor driver is allowed to load —
# no whitelist restriction, each device keeps its own driver (multi-GPU
# machines use several at once). nouveau stays free to serve the NVIDIA
# display whenever the proprietary/open NVIDIA stack is not the chosen one.
# The DC parameter is pinned so the dc= runtime switch cannot silently
# disable the display core this profile was built for.
options amdgpu dc=1