# kernel-src/modules/gpu/ia/amd.cfg — COMPUTE (IA) profile, amdgpu set.
#
# GPU FINAL (owner, 2026-11-03), FULL-SET rewrite (owner order 05/11 16:5x):
# this is the COMPLETE amdgpu config the compute profile builds with —
# every option the profile DECIDES is spelled out here, documented by
# option with its source; anything NOT listed resolves from the seeded
# kernel-deb config (the merge is append + olddefconfig):
#     kernel_merge_config "${SRCDIR}" kernel-src/modules/gpu/ia
#     make olddefconfig
# This is an overlay of the gpu-ia deb entry (packages.yml,
# modules-only build seeded from the standard kernel deb). SYMBOLS
# verified against the 7.2.15 mainline tree the build uses
# (drivers/gpu/drm/amd/amdgpu/Kconfig, drivers/gpu/drm/amd/acp/Kconfig,
# drivers/gpu/drm/amd/amdkfd/Kconfig — the kconfig gate re-checks every
# symbol against the resolved build tree).
#
# No display stack: DC off — the kernel-level default
# (display/Kconfig: DRM_AMD_DC "default y") is overridden here, and the
# DC-only dependents drop with it (DEBUG_KERNEL_DC, DRM_AMD_SECURE_DISPLAY
# resolve unset). The HSA/KFD compute paths the ROCm/HIP runtime expects
# stay on.
#
# SOURCES (per option):
#   [amdgpu]  drivers/gpu/drm/amd/amdgpu/Kconfig (7.2.15)
#   [kfd]     drivers/gpu/drm/amd/amdkfd/Kconfig (7.2.15)
#   [docs]    Documentation/gpu/amdgpu/sysfs.rst — the amdgpu perf knobs
#             (ppfeaturemask, sysfs pp_* attributes) are RUNTIME module
#             parameters, NOT build CONFIGs: they live in the loader
#             policy kernel-src/modprobe/dc-gpu-ia.conf, never here.

# --- Driver core [amdgpu] (7.2.15 amdgpu/Kconfig 3,41,56,75)
CONFIG_DRM_AMDGPU=m          # tristate: the deb ships modules, never =y
CONFIG_DRM_AMDGPU_SI=n       # SI (GCN1) legacy ASICs — no compute lane job
CONFIG_DRM_AMDGPU_CIK=n      # CIK (GCN2) legacy ASICs — same
CONFIG_DRM_AMDGPU_USERPTR=y  # userptr write support (HMM_MIRROR/MMU_NOTIFIER
                             # selected); ROCm/HIP user buffer path

# --- Display Core OFF [amdgpu] (7.2.15 display/Kconfig 7,33 — canonically
# unset form: olddefconfig resolves and drops the DC-only dependents with
# it)
# CONFIG_DRM_AMD_DC is not set
# CONFIG_DRM_AMD_DC_SI is not set

# --- IP blocks [amdgpu] (amdgpu/Kconfig 84, acp/Kconfig 8)
CONFIG_DRM_AMD_ISP=n         # APU image-signal-processor (mipi cameras)
CONFIG_DRM_AMD_ACP=m         # ACP audio co-processor (i2s ALSA). Tristate; the
                             # GPU-GAMING set is ACP=y and calls pm_genpd_* — symbols
                             # exported by the ONLY select in the tree ("select
                             # PM_GENERIC_DOMAINS if PM" in acp/Kconfig), invisible
                             # bool otherwise (olddefconfig drops a bare =y). ACP=n
                             # meant the shared ia seed kernel never carried the
                             # genpd core: the gaming modules-only rebuild cannot
                             # conjure it (modpost undefined, run 42745865047) and
                             # the module would never load at runtime either. =m
                             # keeps the ACP driver inactive on ia (unused module,
                             # no audio path opened) but fires the select, so the
                             # shipped kernel exports genpd for the gaming sets.

# --- Compute: KFD/HSA — the ROCm/HIP runtime paths [kfd]
CONFIG_HSA_AMD=y             # bool, depends DRM_AMDGPU && X86_64 — the whole
                             # KFD/HSA driver (queues, events, doorbells)
CONFIG_HSA_AMD_SVM=y         # HMM-based shared virtual memory (unified +
                             # managed memory in HIP; depends DEVICE_PRIVATE,
                             # default y — restated so the seed cannot
                             # inherit shorter tuning)
CONFIG_HSA_AMD_P2P=y         # multi-GPU peer-to-peer over PCIe (depends
                             # HSA_AMD && PCI_P2PDMA — the multi-GPU IA
                             # compute path)
