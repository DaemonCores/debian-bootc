# kernel-src/modules/gpu/ia/nvidia.cfg — COMPUTE (IA) profile,
# in-kernel NVIDIA infrastructure set.
#
# FULL-SET rewrite (owner order 05/11 16:5x): the COMPLETE set of kernel
# configs the compute profile decides for the NVIDIA lane — every option
# the profile DECIDES is spelled out here, documented by option with its
# source; anything NOT listed resolves from the seeded kernel-deb config
# (append + olddefconfig merge):
#     kernel_merge_config "${SRCDIR}" kernel-src/modules/gpu/ia
#     make olddefconfig
#
# NVRM (the NVIDIA kernel modules) is OUT-OF-TREE and can never be merged
# into the kernel build: it ships as the linux-modules-nvidia deb (the MIT
# open-gpu-kernel-modules compiled once in CI — nothing compiles on the
# target). What the kernel build must provide is the infrastructure
# nouveau (the free display path) and the in-tree consumers depend on.
# The ia/gaming split does NOT diverge here by VENDOR (owner demand
# 10/31-11/02: the variants may differ by build CONFIGURATION of the
# display/compute tree, never the vendor list); the loader policy
# (kernel-src/modprobe/dc-gpu-ia-nvidia.conf: blacklist nouveau,
# NVreg_EnableGpuFirmware=0 = GSP OFF, NVreg_RegistryDwords=RMInstLoc2
# pinned) is the NVIDIA runtime knob set.
#
# SYMBOLS verified against the 7.2.15 mainline tree
# (drivers/gpu/drm/nouveau/Kconfig, drivers/gpu/drm/Kconfig) — the kconfig
# gate re-checks them at build.
#
# NOUVEAU_LEGACY_CTX_SUPPORT REMOVED 2026-11-04 (proven): the symbol no
# longer exists upstream (removed from the nouveau driver) — a dead pin
# kills the kconfig gate on any current tree.

# --- DRM core [core] (7.2.15 core Kconfig)
CONFIG_DRM=m                           # tristate: the seed decides the KMS
                                       # plumbing; restated module (the deb
                                       # ships modules, never =y)

# --- nouveau — the in-tree NVIDIA display path [nouveau] (7.2.15
# nouveau/Kconfig 2, 86)
CONFIG_DRM_NOUVEAU=m                   # tristate; selects IOMMU_API and
                                       # FW_LOADER, pulls DRM_TTM via
                                       # kconfig
CONFIG_DRM_NOUVEAU_BACKLIGHT=y         # backlight control on NVIDIA panels
                                       # (upstream default y — restated)

# --- SVM / firmware plumbing shared with i915 and the out-of-tree NVRM
# (nouveau/i915 Kconfig selects; FW_LOADER per drivers/base Kconfig)
CONFIG_MMU_NOTIFIER=m                  # nouveau/i915 SVM prerequisite
CONFIG_FW_LOADER=y                     # built-in request_firmware: the GSP
                                       # firmware (nvidia/gsp/*.bin) must
                                       # load from rootfs WITHOUT udev
                                       # involvement (headless/GSP lanes)
CONFIG_FW_LOADER_USER_HELPER=n         # the accepted .config INPUT spelling
                                       # of "# CONFIG_X is not set"
                                       # (scripts/kconfig/confdata.c reads
                                       # =n; only the output form is "is not
                                       # set") — olddefconfig normalizes it;
                                       # no udev helper round-trip for
                                       # firmware, the GSP image comes
                                       # straight from the rootfs

# --- GPU memory-manager plumbing of every KMS driver here (7.2.15
# drivers/gpu/drm/Kconfig)
CONFIG_DRM_TTM=m                       # TTM memory manager (TTM)
CONFIG_DRM_TTM_HELPER=m                # TTM helper device framework
CONFIG_DRM_GPUVM=m                     # GPU VM helpers nouveau's GSP path
                                       # links against (upstream since 6.8)
