# kernel-src/modules/gpu/ia/intel.cfg — COMPUTE (IA) profile, i915/xe set.
#
# FULL-SET rewrite (owner order 05/11 16:5x): the COMPLETE i915/xe config
# the compute profile builds with — every option the profile DECIDES is
# spelled out here, documented by option with its source; anything NOT
# listed resolves from the seeded kernel-deb config (append + olddefconfig
# merge):
#     kernel_merge_config "${SRCDIR}" kernel-src/modules/gpu/ia
#     make olddefconfig
# Overlay of the gpu-ia deb entry (packages.yml, modules-only build). The
# gpu set only merges on amd64 lanes (xe is X86_64-only: 7.2.15 xe/Kconfig
# depends X86_PLATFORM_DEVICES || !(X86 && ACPI) and the driver targets
# client x86 silicon — no xe on arm64). SYMBOLS verified against the
# 7.2.15 mainline tree (drivers/gpu/drm/i915/Kconfig, Kconfig.profile;
# drivers/gpu/drm/xe/Kconfig) — the kconfig gate re-checks them at build.
#
# Per-profile divergence (build-time split): amdgpu splits display/compute
# (DC), the NVIDIA variants ship as module debs — the xe driver splits it
# HERE: CONFIG_DRM_XE_DISPLAY=n compiles xe WITHOUT the display pipeline
# (legal only because XE=m, 7.2.15 xe/Kconfig "DRM_XE_DISPLAY depends
# DRM_XE && DRM_XE=m && HAS_IOPORT"). i915 has no display compile toggle.
#
# GuC/HuC: loading is a RUNTIME switch (i915.enable_guc / xe module
# params, kernel doc gpu/i915.rst gpu/xe); the build only enables the
# firmware plumbing, which the seeded deb config already carries.
# PXP (content protection): pinned both profiles — it rides the MEI
# plumbing and costs nothing at runtime without its consumers.

# --- i915 [i915] (7.2.15 i915/Kconfig 2,60,90,114,147; Kconfig.profile 1)
CONFIG_DRM_I915=m                       # tristate: module (deb layout)
CONFIG_DRM_I915_FORCE_PROBE="*"         # string: force-probe EVERY known ID —
                                        # covers the newer client SKUs the
                                        # distro config gates; the
                                        # i915.force_probe module parameter
                                        # overrides at runtime [kernel doc
                                        # gpu/i915.rst]
CONFIG_DRM_I915_USERPTR=y               # userptr GEM support (compute buffers)
CONFIG_DRM_I915_PXP=y                   # protected-xe-content session support;
                                        # depends INTEL_MEI && INTEL_MEI_PXP
                                        # (MEI plumbing in the seed); valid
                                        # with i915=m
CONFIG_DRM_I915_CAPTURE_ERROR=y         # error-state capture (GPU hangs:
                                        # /sys/class/drm/*/gt*/err_state) —
                                        # upstream default y, restated pinned
CONFIG_DRM_I915_REQUEST_TIMEOUT=20000   # ms = upstream default since 6.2
                                        # (Kconfig.profile); restated so
                                        # olddefconfig cannot inherit a
                                        # shorter tuning from the distro
                                        # defconfig

# --- xe (new Xe2 driver) [xe] (7.2.15 xe/Kconfig; string at
# config DRM_XE_FORCE_PROBE)
CONFIG_DRM_XE=m                         # tristate: module
CONFIG_DRM_XE_FORCE_PROBE="*"           # same semantics as i915 force probe:
                                        # the xe.force_probe module parameter
                                        # overrides at runtime
CONFIG_DRM_XE_DISPLAY=n                 # COMPUTE PROFILE: compile out the xe
                                        # display pipeline (depends XE=m —
                                        # satisfied); the ia build serves
                                        # compute only
CONFIG_DRM_XE_DP_TUNNEL=n               # DP tunneling / Bandwidth Allocation
                                        # (depends XE_DISPLAY) — no display
CONFIG_DRM_XE_GPUSVM=y                  # CPU<->GPU address mirroring (SVM,
                                        # default y — restated pinned; the
                                        # compute memory-model path)
CONFIG_DRM_XE_PAGEMAP=y                 # device-local memory pool for SVM
                                        # (default y — restated)

# --- Debug/expert [i915] (7.2.15 i915/Kconfig.debug) — none of the
# DRM_I915_DEBUG* / DRM_I915_WERROR options are enabled: the profile
# carries the upstream defaults, no debug builds.
