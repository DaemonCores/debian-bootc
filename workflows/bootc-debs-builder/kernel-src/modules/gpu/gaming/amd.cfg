# kernel-src/modules/gpu/gaming/amd.cfg — DISPLAY (GAMING) profile,
# amdgpu set.
#
# GPU FINAL (owner, 2026-11-03), FULL-SET rewrite (owner order 05/11
# 16:5x): the COMPLETE amdgpu config the display profile builds with —
# every option the profile DECIDES is spelled out here, documented by
# option with its source; anything NOT listed resolves from the seeded
# kernel-deb config (append + olddefconfig merge):
#     kernel_merge_config "${SRCDIR}" kernel-src/modules/gpu/gaming
#     make olddefconfig
# Overlay of the gpu-gaming deb entry (packages.yml, modules-only build).
# SYMBOLS verified against the 7.2.15 mainline tree
# (drivers/gpu/drm/amd/amdgpu/Kconfig, display/Kconfig, acp/Kconfig,
# amdkfd/Kconfig) — the kconfig gate re-checks them at build.
#
# The DISPLAY profile: AMD DC (Display Core) on with its DSC dependency
# plumbing, fbcon and the display stack — the build a gaming/display
# machine loads. HDCP/DSC are NOT separate Kconfig symbols on the 7.2.15
# tree: since the DC/display-helper rework, DRM_AMDGPU selects
# DRM_DISPLAY_HDCP_HELPER / DRM_DISPLAY_DSC_HELPER / DRM_DISPLAY_DP_HELPER
# DIRECTLY (amdgpu/Kconfig:23-28). The former pins CONFIG_DRM_AMD_DC_FP
# (promptless def_bool n — DC auto-selects it on kernel-FPU arches),
# CONFIG_DRM_AMD_DC_HDCP and CONFIG_DRM_AMD_DC_DSC (do not exist on 7.2):
# DEAD SYMBOLS dropped with this rewrite (dead pins kill the kconfig gate
# — the same class as the NOUVEAU_LEGACY_CTX_SUPPORT removal 11/04).
#
# RUNTIME display knobs are loader-policy, not config: the dc=0/1 runtime
# switch is PINNED by modprobe/dc-gpu-gaming.conf ("options amdgpu dc=1")
# so the profile cannot silently lose its Display Core; the perf knobs
# (ppfeaturemask, sysfs pp_*) live under modprobe per
# Documentation/gpu/amdgpu/sysfs.rst.

# --- Driver core [amdgpu] (7.2.15 amdgpu/Kconfig 3,41,56,75)
CONFIG_DRM_AMDGPU=m          # tristate: the deb ships modules, never =y
CONFIG_DRM_AMDGPU_SI=y       # SI (GCN1) legacy ASICs stay served on display
                             # machines (distro default; the runtime
                             # radeon.si_support override exists)
CONFIG_DRM_AMDGPU_CIK=y      # CIK (GCN2) legacy ASICs, same rationale
CONFIG_DRM_AMDGPU_USERPTR=y  # userptr write (HMM_MIRROR/MMU_NOTIFIER
                             # selected) — VA-API/compositing mappings too

# --- Display Core ON (7.2.15 display/Kconfig 7,33)
CONFIG_DRM_AMD_DC=y          # "AMD DC - Enable new display engine" — Vega,
                             # Raven and every DCN ASIC since
CONFIG_DRM_AMD_DC_SI=y       # DC for the SI ASICs (Tahiti/Pitcairn/Cape
                             # Verde — depends DRM_AMDGPU_SI, kept =y with it)

# --- IP blocks [amdgpu] (amdgpu/Kconfig 84, acp/Kconfig 8)
CONFIG_DRM_AMD_ISP=n         # APU image-signal-processor (mipi cameras)
CONFIG_DRM_AMD_ACP=y         # ACP audio co-processor: the i2s/ALSA audio of
                             # the HDMI/DP path on APUs — display machines
                             # carry audio

# --- KFD/HSA (amdkfd/Kconfig): display machines CAN also compute — the
# ROCm paths stay on, exactly like the compute profile
CONFIG_HSA_AMD=y
CONFIG_HSA_AMD_SVM=y
CONFIG_HSA_AMD_P2P=y         # multi-GPU boxes (compute side-loads too)

# --- Display plumbing: fbdev emulation over the KMS device and the fbcon
# console (drivers/gpu/drm/Kconfig; CONFIG_FB=y is already the base
# decision — restated because the DC fbdev path builds against it)
CONFIG_DRM_FBDEV_EMULATION=y # fbdev emulation on the DRM devices
CONFIG_FB=y
CONFIG_FRAMEBUFFER_CONSOLE=y # the kernel console draws through the fbdev
                             # device: the boot display of a gaming machine

# --- kgdb in DC (display/Kconfig 45, DEBUG_KERNEL_DC depends KGDB): NOT
# enabled — debug tool, not a display-machine build.
