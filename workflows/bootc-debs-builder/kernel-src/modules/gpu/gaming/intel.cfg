# kernel-src/modules/gpu/gaming/intel.cfg — DISPLAY (GAMING) profile,
# i915/xe set.
#
# FULL-SET rewrite (owner order 05/11 16:5x): the COMPLETE i915/xe config
# the display profile builds with — every option the profile DECIDES is
# spelled out here, documented by option with its source; anything NOT
# listed resolves from the seeded kernel-deb config (append + olddefconfig
# merge):
#     kernel_merge_config "${SRCDIR}" kernel-src/modules/gpu/gaming
#     make olddefconfig
# Overlay of the gpu-gaming deb entry (packages.yml, modules-only build).
# The gpu set only merges on amd64 lanes (xe is x86_64-only — no xe on
# arm64). SYMBOLS verified against the 7.2.15 mainline tree
# (drivers/gpu/drm/i915/Kconfig, Kconfig.profile; drivers/gpu/drm/xe/Kconfig)
# — the kconfig gate re-checks them at build.
#
# Per-profile divergence (the only build-time split in the Intel lane):
# CONFIG_DRM_XE_DISPLAY=y here (the xe display pipeline IS the profile;
# depends DRM_XE && DRM_XE=m && HAS_IOPORT) — the compute profile pins n.
# i915 has no display compile toggle. HDCP/DSC ride the DRM_DISPLAY_*
# helpers that DRM_I915/DRM_XE select directly (i915 Kconfig + xe
# Kconfig:15-25) — not separate pins.
#
# GuC/HuC: loading is a RUNTIME switch (i915.enable_guc / xe module params,
# kernel doc gpu/i915.rst gpu/xe); the build only enables the firmware
# plumbing, which the seeded deb config already carries.

# --- i915 (7.2.15 i915/Kconfig 2,60,90,114,147; Kconfig.profile 1)
CONFIG_DRM_I915=m                       # tristate: module (deb layout)
CONFIG_DRM_I915_FORCE_PROBE="*"         # force-probe EVERY known ID — covers
                                        # the newer client SKUs the distro
                                        # config gates; i915.force_probe
                                        # module parameter overrides at
                                        # runtime [kernel doc]
CONFIG_DRM_I915_USERPTR=y               # userptr GEM support
CONFIG_DRM_I915_PXP=y                   # protected-content sessions (HDCP
                                        # class); depends INTEL_MEI &&
                                        # INTEL_MEI_PXP (MEI plumbing in the
                                        # seed); valid with i915=m
CONFIG_DRM_I915_CAPTURE_ERROR=y         # error-state capture (GPU hangs:
                                        # err_state) — upstream default y,
                                        # restated pinned
CONFIG_DRM_I915_REQUEST_TIMEOUT=20000   # ms = upstream default since 6.2
                                        # (Kconfig.profile); restated so the
                                        # distro defconfig cannot inherit a
                                        # shorter tuning

# --- xe — DISPLAY profile (7.2.15 xe/Kconfig)
CONFIG_DRM_XE=m                         # tristate: module
CONFIG_DRM_XE_FORCE_PROBE="*"           # same semantics as i915 force probe;
                                        # xe.force_probe module parameter
                                        # overrides at runtime
CONFIG_DRM_XE_DISPLAY=y                 # the xe display pipeline (depends
                                        # XE=m: satisfied) — the profile build
CONFIG_DRM_XE_DP_TUNNEL=y               # DP tunneling + Bandwidth Allocation
                                        # mode across displays (depends
                                        # USB4 in the seed; default y —
                                        # restated)

# --- SVM (compute on a gaming box too; xe/Kconfig GPUSVM/PAGEMAP)
CONFIG_DRM_XE_GPUSVM=y                  # CPU<->GPU address mirroring
                                        # (default y — restated)
CONFIG_DRM_XE_PAGEMAP=y                 # device-local memory pool for SVM
                                        # (default y — restated)

# --- Debug/expert (i915/Kconfig.debug) — none of the DRM_I915_DEBUG* /
# DRM_I915_WERROR options: the profile carries the upstream defaults.
