# kernel/config
#
# The BASE kernel config, shared by ALL devices. This is the foundation for
# the `linux-image-common` Debian package: a kernel image built from this
# fragment (arch options included, see the '# arm64/amd64 built-in' sections),
# on top of which per-device `linux-modules-<device>` packages are produced
# (modules only, no kernel rebuild per device).
#
# This file is NOT a full .config. It is meant to be merged into a defconfig
# with:
#     scripts/kconfig/merge_config.sh -m .config kernel/config
#     make olddefconfig
#
# The arch-specific options live in the '# arm64 built-in' / '# amd64 built-in'
# sections at the end of THIS file (folded from the deleted kernel/modules/arm
# and kernel/modules/x86_64 overlays). The per-device fragments
# (kernel/modules/rpi3, rpi4, rpi5, rk3588) are OVERLAYS merged afterwards by the
# device modules packages. They keep ONLY device-specific options (SoC, Ethernet
# PHY, MMC, USB, RTC). A same-symbol option in a later fragment wins (kernel
# kconfig last-wins on merge). The device modules are OPTIONAL — the kernel
# works without them.
#
# Only options that change behaviour relative to defconfig are listed. Every
# option has a one-line English comment explaining why it is set (or unset)
# for the ultra-minimal bootc image.
#
# Conventions:
#   # reason in English
#   CONFIG_OPTION=y           # built-in
#   CONFIG_OPTION=m           # module
#   # CONFIG_OPTION is not set  # disabled

# =============================================================================
# Filesystems — built-in for the root filesystem types bootc/ostree may use.
# Building them in avoids a chicken-and-egg problem where the rootfs module
# lives on the rootfs. Shared by ALL devices.
# =============================================================================

# PVE kernel config deltas — the kernel-touching subset of the PVE
# packaging rules.d (config-common.opts + config-amd64.opts, git.proxmox.com
# pve-kernel.git, extracted 2026-11-05). Applied on the UNIFIED kernel lane
# (debian-bootc linux-image entry) as a kconfig FRAGMENT (source = the merge,
# never a patch), merged BEFORE the lane's own sur-rides so a lane override
# always wins. Symbols mapping: -e → =y, -m → =m, -d → '# CONFIG_X is not
# set', --set-str → CONFIG_X="<value>".
# Watchdog / MEI
CONFIG_INTEL_MEI_WDT=m
# Storage block layers a PVE host needs built-in/module (sd/sr/dm/nvme)
CONFIG_BLK_DEV_SD=y
CONFIG_BLK_DEV_SR=y
CONFIG_BLK_DEV_DM=y
CONFIG_BLK_DEV_NVME=m
# Bridging (PVE networking defaults)
CONFIG_BRIDGE=y
CONFIG_BRIDGE_NETFILTER=y
# CPU governor: performance default (PVE rule), ondemand/schedutil off
CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y
# CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND is not set
# CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL is not set
# SimpleFB / early display
CONFIG_SYSFB_SIMPLEFB=y
CONFIG_DRM_SIMPLEDRM=y
# Hypervisor guests (PVE runs as a guest too)
CONFIG_HYPERV=y
# VFIO (LXC/QEMU passthrough profile)
CONFIG_VFIO=m
CONFIG_VFIO_IOMMU_TYPE1=m
CONFIG_VFIO_VIRQFD=y
# amd64-only deltas (config-amd64.opts)
CONFIG_UNWINDER_FRAME_POINTER=y
# CONFIG_UNWINDER_ORC is not set
# CONFIG_UNWINDER_GUESS is not set
CONFIG_PAGE_TABLE_ISOLATION=y
# CONFIG_GDS_FORCE_MITIGATION is not set
# CONFIG_SND_PCSP is not set

# ext4: built-in. Default rootfs for many bootc deployments.
CONFIG_EXT4_FS=y

# XFS: built-in. bootc default on RHEL-derived setups is XFS.
CONFIG_XFS_FS=y

# Btrfs: built-in. bootc supports btrfs as a root filesystem with
#        subvolume-based deployments.
CONFIG_BTRFS_FS=y

# tmpfs: built-in. systemd REQUIRES tmpfs for /run, /tmp, /dev/shm. This is
#        almost always already on in defconfig; we restate it to be safe.
CONFIG_TMPFS=y

# overlayfs: module. Used by podman/bootc for container layer stacking and
#            by bootc's own deployment logic. Must be a module (not disabled)
#            so dracut can include overlay.ko in the initramfs and podman can
#            load it at runtime. Not built-in because it is not needed before
#            the rootfs is mounted.
CONFIG_OVERLAY_FS=m

# erofs: module. Read-only compressed filesystem used by some container
#        image formats and by bootc's image store. Module is sufficient;
#        erofs is never the root filesystem so no chicken-and-egg issue.
CONFIG_EROFS_FS=m

# =============================================================================
# Virtio — built-in. For VMs (qemu, libvirt) on every arch, so a minimal guest
# image can boot from virtio-blk + virtio-net without module loading in the
# initramfs. Shared by ALL devices (every arch runs in VMs for CI/testing).
# =============================================================================

# VIRTIO_PCI: built-in. Required to enumerate virtio devices on the PCI bus.
CONFIG_VIRTIO_PCI=y

# VIRTIO_BLK: built-in. virtio block device, used by VMs.
CONFIG_VIRTIO_BLK=y

# VIRTIO_NET: built-in. virtio network device, used by VMs. Built-in (not =m
#             as the prior x86_64 fragment had it) so the bootc fetch path
#             never races on an initramfs module load. Device-specific
#             physical NIC drivers stay as modules in the per-device
#             overlays (e.g. e1000/e1000e/igb/r8169 on x86_64).
CONFIG_VIRTIO_NET=y

# =============================================================================
# Basic networking — built-in. bootc fetches deployments over the network
# (HTTP from a registry or ostree repo), so the core networking stack must
# be present before any module load. These are almost always default=y in
# every arch's defconfig; restated here so the common base is explicit and
# a downstream defconfig change cannot silently drop networking.
# =============================================================================

# NET: built-in. The core socket layer. Without it nothing networked works.
CONFIG_NET=y

# INET: built-in. The TCP/IP stack (AF_INET). bootc/ostree pulls over HTTP.
CONFIG_INET=y

# UNIX: built-in. AF_UNIX sockets — used by systemd, dbus, podman, bootc
#       itself for local IPC. Always on in defconfig; restated for safety.
CONFIG_UNIX=y

# PACKET: built-in. AF_PACKET socket family — used by dhcp clients and by
#         network bootstrapping tools that need raw link-layer access.
CONFIG_PACKET=y

# =============================================================================
# Cgroups — built-in. systemd manages units via cgroups v2; bootc rollback
# ordering and resource limits depend on them. These are default=y in modern
# defconfigs; restated so the common base is explicit and cannot regress.
# =============================================================================

# CGROUPS: built-in. The cgroup subsystem core (v2 unified hierarchy).
CONFIG_CGROUPS=y

# CGROUP sub-controllers used by systemd + bootc + container runtimes
# (podman/criu). Each is built-in so the controller is always available.
CONFIG_CGROUP_BPF=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CPUSETS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_PIDS=y
CONFIG_MEMCG=y
CONFIG_BLK_CGROUP=y

# =============================================================================
# Namespaces — built-in. Container runtimes (podman, runc, k8s) and bootc's
# own image builds use PID/NET/UTS/IPC/USER namespaces. Default=y in modern
# defconfigs; restated so the common base is explicit.
# =============================================================================

# NAMESPACES: built-in. The namespace core.
CONFIG_NAMESPACES=y

# UTS_NS: built-in. Hostname / domainname isolation.
CONFIG_UTS_NS=y

# IPC_NS: built-in. SysV IPC / POSIX message queue isolation.
CONFIG_IPC_NS=y

# USER_NS: built-in. UID/GID mapping — required by rootless podman and
#          by bootc's unprivileged image build paths.
CONFIG_USER_NS=y

# PID_NS: built-in. Process-ID isolation.
CONFIG_PID_NS=y

# NET_NS: built-in. Network-stack isolation (loopback, routes, iptables
#         per namespace). Required by container networking.
CONFIG_NET_NS=y

# =============================================================================
# Serial console — built-in. The kernel MUST be able to emit to the serial
# console before any module loading happens, or panic traces are lost. Both
# UART families that appear across the supported devices are built in here
# so common covers every device's early console; a device whose SoC uses
# neither (none in the current set) would add its UART in its overlay.
# =============================================================================

# 8250 UART: built-in. The standard PC serial port and the qemu serial
# console both rely on 8250. Used by x86_64 and by the RK3588 board UARTs
# (16550-compatible).
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y

# AMBA PL011 UART: built-in. ARM PrimeCell UART, used by the Raspberry Pi
#                  family (3/4/5) and the RK3588 debug UART.
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y

# =============================================================================
# Hardware support — every subsystem stays available. This image cannot know in
# advance what it runs on (server, desktop, laptop, VM, SBC), so drivers are
# built as modules: udev loads one only when its device shows up, and hardware
# without a given device pays nothing. Nothing is disabled to save space; a
# missing driver is added here or in the per-device overlay, never dropped.
# Shared by ALL devices.
# =============================================================================

# Sound: ALSA core and the generic USB/HDA class drivers.
CONFIG_SOUND=m
CONFIG_SND=m
CONFIG_SND_USB_AUDIO=m
CONFIG_SND_HDA_INTEL=m

# Bluetooth: core, HCI over USB/UART and the common profiles.
CONFIG_BT=m
CONFIG_BT_HCIBTUSB=m
CONFIG_BT_HCIUART=m
CONFIG_BT_RFCOMM=m
CONFIG_BT_BNEP=m

# Wireless LAN: cfg80211 and mac80211 are the base of every Wi-Fi driver.
CONFIG_WIRELESS=y
CONFIG_CFG80211=m
CONFIG_MAC80211=m

# Input: USB HID, joysticks and tablets.
CONFIG_USB_HID=m
CONFIG_HID_GENERIC=m
CONFIG_INPUT_JOYSTICK=y
CONFIG_INPUT_TABLET=y

# DRM/KMS: modules. The live installer needs KMS to draw its GTK UI. Generic
# and virtual drivers live here; physical GPUs are in the per-device overlays.
CONFIG_DRM=m
# Compute acceleration framework: a bool, so it must be in the image for the
# NPU drivers (CONFIG_DRM_ACCEL_ROCKET in modules/rk3588) to build as modules.
CONFIG_DRM_ACCEL=y
CONFIG_DRM_KMS_HELPER=m
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FB=y

# simpledrm: scanout through the firmware (EFI/UEFI GOP) framebuffer, the
# fallback every machine has before a native driver loads.
CONFIG_SYSFB_SIMPLEFB=y
CONFIG_DRM_SIMPLEDRM=m

# Paravirtual and emulated adapters of hypervisors.
CONFIG_DRM_VIRTIO_GPU=m
CONFIG_DRM_BOCHS=m
CONFIG_DRM_CIRRUS_QEMU=m
CONFIG_DRM_QXL=m
CONFIG_DRM_VMWGFX=m
CONFIG_DRM_HYPERV=m

# Display panels and bridges used on both architectures.
CONFIG_DRM_PANEL_SIMPLE=m
CONFIG_DRM_DISPLAY_CONNECTOR=m
CONFIG_DRM_SIMPLE_BRIDGE=m

# =============================================================================
# Seccomp — built-in. podman/bootc/runc install a syscall sandbox filter on
# every container; without seccomp the container runtimes refuse to start or
# run unfiltered. Shared by ALL devices.
# =============================================================================

# SECCOMP: built-in. The seccomp framework core.
CONFIG_SECCOMP=y

# SECCOMP_FILTER: built-in. BPF-filtered seccomp (the mode podman/bootc use).
CONFIG_SECCOMP_FILTER=y

# =============================================================================
# Linux Security Modules — built-in. AppArmor + Landlock + Yama + BPF LSM
# provide MAC and per-container sandboxing. bootc/podman rely on these for
# defence-in-depth around container workloads. Shared by ALL devices.
# =============================================================================

# SECURITY: built-in. The LSM framework core.
CONFIG_SECURITY=y

# SECURITY_APPARMOR: built-in. Path-based MAC; Debian default LSM.
CONFIG_SECURITY_APPARMOR=y

# SECURITY_LANDLOCK: built-in. Unprivileged fine-grained sandboxing.
CONFIG_SECURITY_LANDLOCK=y

# SECURITY_YAMA: built-in. ptrace scope restriction.
CONFIG_SECURITY_YAMA=y

# BPF_LSM: built-in. Allows BPF programs to implement LSM hooks.
CONFIG_BPF_LSM=y

# SECURITY_LOCKDOWN_LSM: built-in. The lockdown LSM (protects /dev/mem,
# ioports); it is the only symbol of the lockdown mechanism in this kernel.
CONFIG_SECURITY_LOCKDOWN_LSM=y

# LSM: ordered list of active LSMs — landlock,lockdown,yama,apparmor,bpf.
CONFIG_LSM="landlock,lockdown,yama,apparmor,bpf"

# =============================================================================
# Namespace completeness — built-in. CGROUP_NS and TIME_NS complete the
# container namespace set expected by podman/bootc/runc. Default=y in modern
# defconfigs; restated so the common base is explicit and cannot regress.
# =============================================================================

# TIME_NS: built-in. Per-container monotonic clock virtualisation.
CONFIG_TIME_NS=y

# =============================================================================
# Cgroups v2 — built-in. systemd and bootc require the unified cgroup v2
# hierarchy; the controllers above are mounted under /sys/fs/cgroup/ only when
# v2 is the default. Shared by ALL devices.
# =============================================================================

# No cgroup v2 symbol is set: this kernel has no CGROUP_V2 or CGROUP_DEFAULT_V2
# option (the unified hierarchy is always available).

# =============================================================================
# Hardening — built-in. Defends against common kernel exploit classes (RWX
# pages, predictable layout, stack overflow, heap grooming). Default=y on
# most arches; restated so the minimal image keeps them explicit.
# =============================================================================

# STRICT_KERNEL_RWX: built-in. Forbid writable+executable kernel pages.
CONFIG_STRICT_KERNEL_RWX=y

# STRICT_MODULE_RWX: built-in. Forbid writable+executable module pages.
CONFIG_STRICT_MODULE_RWX=y

# RANDOMIZE_BASE: built-in. KASLR — randomise kernel base address.
CONFIG_RANDOMIZE_BASE=y

# STACKPROTECTOR: built-in. Stack canaries on kernel functions.
CONFIG_STACKPROTECTOR=y

# STACKPROTECTOR_STRONG: built-in. Stronger canary coverage.
CONFIG_STACKPROTECTOR_STRONG=y

# SLAB_FREELIST_RANDOM: built-in. Randomise slab freelist order.
CONFIG_SLAB_FREELIST_RANDOM=y

# SHUFFLE_PAGE_ALLOCATOR: built-in. Randomise free page order.
CONFIG_SHUFFLE_PAGE_ALLOCATOR=y

# INIT_ON_ALLOC_DEFAULT_ON: built-in. Zero new allocations by default.
CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y

# =============================================================================
# Network hardening — built-in. SYN cookies mitigate SYN-flood DoS at the
# kernel level before any userland helper runs. Shared by ALL devices.
# =============================================================================

# SYN_COOKIES: built-in. SYN-flood protection on the listen path.
CONFIG_SYN_COOKIES=y

# =============================================================================
# Memory footprint — features, never hardware. The target is the lowest idle RAM
# the full hardware support allows: drivers stay (they are modules and cost
# nothing until their device shows up), what goes is kernel machinery that a
# production appliance does not use. Each option is a feature of the kernel
# itself (debugging, tracing, profiling, crash capture), not a device. Shared by
# ALL devices.
# =============================================================================

# BTF type information: the vmlinux BTF blob stays resident in kernel memory
# (several MB) and only serves BPF CO-RE tooling. BPF itself (cgroup BPF, BPF LSM)
# stays on.
# CONFIG_DEBUG_INFO_BTF is not set
# CONFIG_DEBUG_INFO_BTF_MODULES is not set

# Function tracer: allocates per-CPU ring buffers and patches every function
# prologue. A debugging aid, not a runtime need.
# CONFIG_FTRACE is not set

# Profiling hooks (perf/oprofile support code in the scheduler paths).
# CONFIG_PROFILING is not set

# Scheduler statistics and latency accounting: per-task bookkeeping that only
# debugging tools read.
# CONFIG_SCHEDSTATS is not set
# CONFIG_SCHED_BORE: REMOVED 2026-11-04 (proven) — bore DORMANT (see
# kconfig-shared/x86-common.cfg and patches-shared.yml); the symbol is not
# declared by a vanilla kernel until the patch re-arms.
# CONFIG_LATENCYTOP is not set

# Crash capture and kexec: reserve memory for a second kernel. bootc updates
# reboot through the bootloader, and a crash kernel keeps RAM unusable.
# CONFIG_KEXEC is not set
# CONFIG_KEXEC_FILE is not set
# CONFIG_CRASH_DUMP is not set

# The running kernel's config embedded in vmlinux: the build already ships it in
# /usr/lib/linux-kernel-build/config.
# CONFIG_IKCONFIG is not set
# CONFIG_IKCONFIG_PROC is not set

# =============================================================================
# LLM inference (KT-19) — added without measurement, compatibility checked only
# (docs/kernel-patches.md). Shared by ALL devices.
# =============================================================================

# Preemption: PREEMPT_NONE and PREEMPT_VOLUNTARY are not selectable on x86_64
# and arm64 in 7.2 (they depend on !ARCH_HAS_PREEMPT_LAZY / ARCH_NO_PREEMPT).
# Lazy preemption is the throughput-oriented model left, and the default.
CONFIG_PREEMPT_LAZY=y

# Transparent huge pages: fewer TLB misses when a runtime maps multi-GB weights.
# ALWAYS — owner arbitration 2026-11-03 (THP v2): the embedded AI profile primes;
# no lane may boot [madvise]. The host-side never-forcing rule concerns PVE HOST
# settings (sysfs, never baked here); the guests decide their own hugepages.
CONFIG_TRANSPARENT_HUGEPAGE=y
CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS=y

# Multi-gen LRU: better reclaim when the weights and the page cache compete for
# RAM on small boards.
CONFIG_LRU_GEN=y
CONFIG_LRU_GEN_ENABLED=y

# Compressed swap in RAM: lets a 4-8 GB board survive a model that slightly
# overshoots its memory instead of hitting the OOM killer. zswap is compiled in
# but off by default (ZSWAP_DEFAULT_ON unset); zram is inactive until a device
# is configured.
CONFIG_ZRAM=m
CONFIG_ZSWAP=y

# =============================================================================
# arm64 built-in — folded from the former kernel/modules/arm overlay.
# One canonical config: the whole arch overlay content was merged into THIS
# file (owner fold 2026-11-03) and the overlay file was deleted. Options that
# were =m in the overlay are =y here: they are part of the kernel image now,
# and a modules-only build can never add a built-in to an existing kernel.
# The linux-image build merges ONLY this file (plus the page-size overlay on
# arm64) — there is no arch overlay to merge anymore.
# =============================================================================

# =============================================================================
# ARM64 — built-in. The 64-bit ARM architecture core. Every device in the ARM
# set is arm64 (Cortex-A53/A72/A76), so this is common to all of them. The
# defconfig for arm64 already sets this, but it is restated so the ARM base is
# explicit and a downstream defconfig change cannot silently drop it.
# =============================================================================
# ARM64: built-in. The 64-bit ARM architecture.
CONFIG_ARM64=y
# =============================================================================
# Kernel command line — built-in. The serial consoles used across the ARM
# device set: ttyAMA0 is the AMBA PL011 UART (Raspberry Pi family + RK3588
# debug UART), ttyS0 is the 8250 UART (used by some RK3588 board UARTs). Both
# are listed so the kernel logs to whichever UART the board exposes, without
# per-device CMDLINE overrides. The last console= that resolves to a real
# device wins (kernel rule).
# =============================================================================
# CMDLINE: built-in. Serial console for the ARM device set.
CONFIG_CMDLINE="console=ttyAMA0,115200 console=ttyS0,115200"
# =============================================================================
# Serial console — built-in. AMBA PL011 UART, used by the Raspberry Pi family
# (3/4/5) and the RK3588 debug UART. Also restated in kernel/config (the base
# covers every device's early console), but kept here so the ARM overlay is
# self-describing — a downstream that uses this overlay without the full base
# still has PL011. Harmless duplicate (same value, merge last-wins no-op).
# =============================================================================
# SERIAL_AMBA_PL011: built-in. ARM PrimeCell UART driver.
CONFIG_SERIAL_AMBA_PL011=y
# SERIAL_AMBA_PL011_CONSOLE: built-in. Early console on PL011.
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
# =============================================================================
# MMC / SD — built-in. Most ARM boards in the set boot from SD or eMMC; the
# bootc rootfs lives on this storage, so the kernel must read it without an
# initramfs module load step. The subsystem core + the SDHCI controller family
# are common to rpi4/rpi5/rk3588 (rpi3 uses the bcm2835-specific sdhost
# controller, which stays in its device overlay). Building the SDHCI core +
# platform glue here means the device overlays only carry their device-specific
# SDHCI variant (none — the base SDHCI driver covers the standard controllers).
# =============================================================================
# MMC: built-in. The MMC/SD/SDIO subsystem core. Required before any controller
#      driver.
CONFIG_MMC=y
# MMC_SDHCI: built-in. The SDHCI host controller core. Base for the platform
#            SDHCI drivers used by rpi4/rpi5/rk3588.
CONFIG_MMC_SDHCI=y
# MMC_SDHCI_PLTFM: built-in. The SDHCI platform glue (sdhci-pltfm), used by the
#                  RK3588 sdhci-of-arasan and the Pi 4/5 eMMC controller.
CONFIG_MMC_SDHCI_PLTFM=y
# =============================================================================
# USB — built-in. USB is used on every ARM board in the set as the only way to
# attach a keyboard for emergency console access, and as a storage path. The
# three host controller families (DWC3, XHCI, EHCI) cover the USB3/USB2
# controllers found across the ARM boards (Pi 4 via VL805, RK3588 native).
# rpi3 has no USB in its overlay, but the ARM base provides it so a USB
# keyboard can be attached if needed.
# =============================================================================
# USB: built-in. The USB subsystem core. Required before any host controller
#      driver.
CONFIG_USB=y
# USB_DWC3: built-in. Synopsys DesignWare USB3 controller, used by the Pi 4
#           (via VL805) and the RK3588.
CONFIG_USB_DWC3=y
# USB_XHCI_HCD: built-in. USB 3.0 host controller, used by the Pi 4/5 and the
#               RK3588.
CONFIG_USB_XHCI_HCD=y
# USB_EHCI_HCD: built-in. USB 2.0 host controller, used by the RK3588.
CONFIG_USB_EHCI_HCD=y
# =============================================================================
# RTC — built-in. The RTC subsystem core. Without it, systemd-timesyncd has no
# fallback time and bootc rollback ordering can break (two deployments with the
# "same" timestamp). The subsystem core is common to all ARM boards; the
# device-specific RTC driver (e.g. RTC_DRV_PL031 on the RK3588) stays in the
# device overlay.
# =============================================================================
# RTC_CLASS: built-in. The RTC subsystem core.
CONFIG_RTC_CLASS=y
# =============================================================================
# Graphics — GPU and display drivers for the arm64 SoCs, as modules. They load
# only when the matching device-tree node exists, so boards without a display
# pay nothing. Covers the SBC set (Broadcom, Rockchip) and the common Arm
# GPUs/display engines of other SoCs, so any arm64 board gets video.
# =============================================================================
# Broadcom VideoCore (Raspberry Pi): display (vc4) and 3D (v3d).
CONFIG_DRM_VC4=y
CONFIG_DRM_V3D=y
# Arm Mali GPUs: Midgard/Bifrost (panfrost), Valhall (panthor), Utgard (lima).
CONFIG_DRM_PANFROST=y
CONFIG_DRM_PANTHOR=y
CONFIG_DRM_LIMA=y
# Rockchip display subsystem and its HDMI/DisplayPort encoders.
CONFIG_DRM_ROCKCHIP=y
CONFIG_ROCKCHIP_VOP=y
CONFIG_ROCKCHIP_VOP2=y
CONFIG_ROCKCHIP_DW_HDMI=y
CONFIG_ROCKCHIP_DW_HDMI_QP=y
CONFIG_ROCKCHIP_DW_MIPI_DSI=y
CONFIG_ROCKCHIP_ANALOGIX_DP=y
# Other widespread arm64 SoC display/GPU stacks.
CONFIG_DRM_MESON=y
CONFIG_DRM_SUN4I=y
CONFIG_DRM_MSM=y
CONFIG_DRM_TEGRA=y
CONFIG_DRM_ETNAVIV=y
CONFIG_DRM_EXYNOS=y
CONFIG_DRM_IMX=y
CONFIG_DRM_MEDIATEK=y
# Common bridges and panel glue.
CONFIG_DRM_DW_HDMI=y
CONFIG_DRM_DW_HDMI_CEC=y
CONFIG_DRM_PANEL_SIMPLE=y
CONFIG_DRM_PANEL_RASPBERRYPI_TOUCHSCREEN=y
CONFIG_DRM_I2C_ADV7511=y
CONFIG_DRM_LONTIUM_LT8912B=y

# =============================================================================
# amd64 built-in — folded from the former kernel/modules/x86_64 overlay.
# Same fold as the arm64 section: the overlay content is merged here, its =m
# options are =y (part of the kernel image, not a modules-only add-on). The
# linux-image build merges ONLY this file on amd64 (no page-size overlay;
# the transverse kconfig-shared fragments are merged BEFORE the base so this
# built-in section wins last).
# =============================================================================

# =============================================================================
# Block / storage — built-in so the initramfs can find the rootfs without
# needing to load a module. bootc/ostree rootfs may be on NVMe or SATA on
# bare-metal x86_64 deployments.
# =============================================================================
# NVMe SSDs: built-in so a bootc install on an NVMe drive can boot without
# an initramfs module load step.
CONFIG_BLK_DEV_NVME=y
# SATA AHCI: built-in for bare-metal deployments on classic SATA SSDs/HDDs.
CONFIG_SATA_AHCI=y
# =============================================================================
# Network — modules, so they are only loaded when the corresponding hardware
# is present. Avoids pinning driver memory on hardware that does not need it.
# Hotplug handles module loading at runtime. virtio-net (for VMs) is built-in
# in config-common; here are the physical NIC drivers.
# =============================================================================
# e1000: Intel 82540/82545/82546 — common in older Intel NICs and in qemu
#        when virtio-net is not available. Module to save RAM on non-Intel.
CONFIG_E1000=y
# e1000e: Intel PCIe Gigabit NIC (82571..82583, I218). Module for the same
#         reason as e1000.
CONFIG_E1000E=y
# igb: Intel I210/I350 Gigabit. Common on server bare metal. Module.
CONFIG_IGB=y
# r8169: Realtek 8168/8169/8111 — the most common consumer onboard NIC.
#        Module.
CONFIG_R8169=y
# =============================================================================
# USB host controllers — modules. Needed if a USB keyboard has to be
# attached for emergency console access. Module so they are not loaded on
# hardware without USB.
# =============================================================================
# USB XHCI: USB 3.0 host controller. Module — loaded only when USB is
#           plugged in (hotplug).
CONFIG_USB_XHCI_HCD=y
# USB EHCI: USB 2.0 host controller. Same rationale.
CONFIG_USB_EHCI_HCD=y
# =============================================================================
# Graphics — physical GPU drivers as modules. GPU FINAL (owner 2026-11-03):
# the fold is undone — the drivers are back to =m. A modules-only build CAN
# add a module to an existing kernel (the reason the fold promoted them to =y
# does not apply to drivers delivered as module packages anyway), and the
# four GPU module sets (gpu-ia, gpu-gaming and their NVIDIA variants) rebuild
# the profile build on top of the standard kernel. The base build itself keeps
# them as =m so the live installer session and every consumer that merges no
# further fragment still gets a loadable driver for the hardware it finds.
# CONFIG_DRM_AMD_DC left out of the base: the display-core build is a PROFILE
# choice (gpu-gaming builds it, gpu-ia does not), not a base value — the
# kernel build's transverse gpu/amd.cfg fragment sets the kernel-level
# default (DC on) while the overlay of each module set wins on top of it.
# The device/arch folds (arm64 SoC platforms, USB/EHCI… built-ins) stay
# untouched — ONLY this GPU block changed.
# =============================================================================
# Intel integrated and discrete GPUs (i915 for legacy and Xe-era, xe for newer).
CONFIG_DRM_I915=m
CONFIG_DRM_XE=m
# AMD Radeon / Ryzen integrated GPUs, including the older Southern/Sea Islands
# parts. DC and its dependencies are NOT set here: profile-owned (the kernel-
# level default comes from the transverse gpu fragments, the per-set module
# overlays decide the shipped build).
CONFIG_DRM_AMDGPU=m
CONFIG_DRM_AMDGPU_SI=m
CONFIG_DRM_AMDGPU_CIK=m
# Legacy AMD/ATI Radeon.
CONFIG_DRM_RADEON=m
# NVIDIA GPUs through the in-tree nouveau driver.
CONFIG_DRM_NOUVEAU=m
# Older and server adapters.
CONFIG_DRM_GMA500=m
CONFIG_DRM_MGAG200=m
CONFIG_DRM_AST=m
CONFIG_DRM_UDL=m
CONFIG_DRM_VBOXVIDEO=m
# =============================================================================
# Disable debug/testing modules that reference x86-specific kernel symbols
# (e.g. __x86_return_thunk, hwpoison_filter_register) only resolvable from
# vmlinux.o — which is absent in a modules-only build. These modules are pure
# debug facilities with no use in a production bootc image.
# =============================================================================
# HWPOISON_INJECT: disable memory poison injection test module. References
# __x86_return_thunk and hwpoison_filter_register which require vmlinux.o to
# resolve at modpost time; without it the modules build fails with unresolved
# symbol errors.
# CONFIG_HWPOISON_INJECT is not set
# NR_CPUS: the distribution default (8192) sizes every per-CPU structure and
# CPU mask for a machine nobody owns. 512 logical CPUs covers every shipping
# x86 platform while trimming a few MB of resident kernel data.
CONFIG_NR_CPUS=512