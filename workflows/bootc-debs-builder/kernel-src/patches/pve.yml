# PVE ADDITIVE PATCH SET — owner pivot 7.2 unifié (2026-11-05). The PVE lane
# builds the upstream MAINLINE kernel.org tree, resolved DYNAMICALLY at
# build time (track: kernel-org stable, series "7.2" — the patch-proven
# stream anchored per the owner order 05/11 01:5x: NO fixed version, the
# newest 7.2.x wins while it streams); the Proxmox packaging submodule
# mirror_ubuntu-kernels is OUT of the build path. The Proxmox
# patches re-enter as ADDITIVES applied AFTER the shared XanMod+clearlinux
# set, sourced from the GitHub read-only mirror of git.proxmox.com/git/pve-kernel
# (https://raw.githubusercontent.com/proxmox/pve-kernel/master/patches/kernel/):
# the mirror serves git-format .patch files, byte-stable, downloadable with
# no re-encoding. Entries carry a sha256 pin (the exact bytes are immutable;
# the doctrine stays — the TARBALL digest is NOT pinned, it is read from
# sha256sums.asc every build). Same canonical schema as patches-shared.yml,
# applied by the standard kernel_apply_patches — dry-run ALL first, fuzz 0,
# any failure fails the build all-or-nothing: the gate re-validates the
# RESOLVED tree on every build.
#
# SERIES GATE (proven live, 2026-11-05): the newest STABLE at that moment,
# 7.3.1, was dry-run with the FULL shared set + this set — the set's
# 0055-KVM-Check-for-duplicate-vcpu_id fails there; the track resolution
# anchors the stream, and the dry-run keeps re-judging the exact resolved
# tree (a new 7.2.x that drifts a hunk fails the build and keeps the
# last-good deb).
#
# PROOF (2026-11-05, dry-run fuzz 0 on the REAL tree: vanilla
# linux-7.2.15, tarball sha256
# d0f6b1d7324c937ccaeb5c4ca7084bfcf71db2edb3e2d3a31f0ad83a681809ab, with the
# FULL patches-shared.yml set applied first): the 51 entries below apply
# CLEAN sequentially (zero .rej, zero fuzz). The upstream mirror carries 136
# kernel patches; the 85 CONFLICTS are NOT listed here — reading report for
# the owner (pivot arbitration point h):
#  - the KVM/MBEC+GMET series (0018-0047, 0057, 0064-0066, 0071, 0075, 0094),
#    the TCP window-retraction + packetdrill series (0012-0017) and
#    0052/0053 (ACPI rtc) target UBUNTU-specific tree state — the
#    mirror_ubuntu-kernels tree the packaging submodule carried, not mainline;
#  - 0011 reverts an UBUNTU-SAUCE patch that only exists on the Ubuntu tree;
#  - hardening/bugfix singles drifted past mainline 7.2.15 upstream (0004,
#    0005, 0009, 0048, 0049, 0051, 0061, 0067-0070, 0072-0074, 0076, 0078,
#    0080, 0081, 0088, 0089, 0090, 0093, 0098, 0099, 0101, 0104, 0107,
#    0113-0115, 0119, 0126-0131, 0132, 0135) — hunks no longer match mainline
#    7.2.15 (the fix already landed via stable, or the base drifted on the
#    Ubuntu side); the PVE packaging rebase re-points these, a series bump of
#    OUR mainline pin re-runs the dry-run gate: an entry that stops applying
#    FAILS the build and keeps the last-good deb (same contract as
#    patches-shared.yml).
#
# ARCH-INDEPENDENCE ASSERT (re-checked 2026-11-09, owner mandate ARM OPTI):
# the set needs NO arm64 fork and NO second dry-run per arch. Both kernel
# profiles unpack the SAME mainline tarball (arch/x86 and arm64 sources
# ship TOGETHER in one tree), and patch(1) matches file content only — it
# never consults the target ARCH. The x86-only entries (0008 PKRU, 0056
# KVM VMX...) re-touch files that exist in this single tree whatever the
# build arch; their x86 code is simply inert on an arm64 boot. Proven:
# the FULL sequence (patches-shared + patches-gpu/{amd,intel} + this set)
# dry-runs CLEAN fuzz-0 on the very same 7.2.15 tree the debian lane
# proofs ran on — one tree, one dry-run, both arches (logs: build-local
# 2026-11-09).
