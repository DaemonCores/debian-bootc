# AMD (amdgpu) kernel-tree patch set — DRM-tree patches applied to the
# kernel source NEXT TO patches-shared.yml, inside the SAME patch run of the
# kernel build (debian-bootc linux-image; the PVE lane resolves the same
# manifest). Canonical schema as patches-shared.yml: {series} resolves to
# the kernel series the packaging tree carries, stage/class/exclude-series
# filter exactly like the shared set; a patch that does not dry-run clean
# fails the build (all-or-nothing).
#
# DEFAULT BUILD STATE: the set below is EMPTY — waiting for the owner's
# choice. demandes.jsonl ("les rebuild optimiser des driveer c'est fait ?")
# NEVER names a precise amdgpu patchset; the honest status is:
#   NO maintained GitHub patchset repo carries current (7.x-series) amdgpu
#   perf patches as patch files. Everything found is either legacy series,
#   a CPU patch misleadingly named, or a source tree rather than a patch set.
#
# CANDIDATES (proof = fetched file + sha256, 2026-11-04):
# OWNER LEADS (04/11 20:3x, verified live) — lore.kernel.org mboxes, pinned
# sha256; the owner picks the entries, nothing is applied until them:
# 1. IOMMU PerfOpt v2 — Mario Limonciello, 2 patches (iommu/amd + amdgpu),
#    rebased 7.3-rc2; ~20%% LLM-task gain measured (Phoronix amd-perfopt).
#    Mbox: https://lore.kernel.org/linux-iommu/20260908041207.38113-1-mario.limonciello@amd.com/t.mbox.gz
#      proof sha256: c23da0c9c7232f9beb6a112519cc84f4403d4fc0d35fcecc8d3224fff436bbf0
#    (newer v4 exists: 20260930162401.273907-1-superm1@kernel.org,
#    t.mbox.gz sha256 c27410e24871c6c9... — owner arbitrates the version).
# 2. userq/hung-queue — Jesse Zhang, 21 patches (20260921075326.2409021-1,
#    lore archive rows 153406/153407 2026-September are its patches 09/10).
#    Mbox: https://lore.kernel.org/amd-gfx/20260921075326.2409021-1-Jesse.Zhang@amd.com/t.mbox.gz
#      proof sha256: ac74122280c077224d8bb479ad0f07dc9058698fe7b2921d6caf5641dee8d76f
# 3. CachyOS/kernel-patches AMD dir — maintained repo, but the amdgpu-file
#    content is old (5.15) and the newer amd-* patches are CPU-side
#    (pstate/cache), NOT amdgpu:
#    https://github.com/CachyOS/kernel-patches/tree/master/5.15/AMD
#    proof sha256 5.15/AMD/0001-amd-gpu.patch:
#      b2550e2b5827c8a3c66d3b371d5ee7abe8f362427b2412cb567b3bb1b4523037
# 2. amd-cache-optimizer (CachyOS 6.12): named amd but CPU-cache side,
#    listed only so the owner sees the file was checked, not confused:
#    https://github.com/CachyOS/kernel-patches/blob/master/6.12/0001-amd-cache-optimizer.patch
#    proof sha256:
#      3a8e756865e88ff5dff486e15e6f888d17714d3b555c9a87f918e70b8b454fc1
# 3. Upstream amd-staging-drm-next (gitlab.freedesktop.org/drm/misc/kernel
#    / drm-next) — the REAL source of amdgpu perf work (DCN, scheduler,
#    backlight, per-crtc changes) but a TREE, not a patch list: adopting it
#    means cherry-picking onto the 7.x base, an owner arbitration.
# 4. Frogging-Family/community-patches (linux*-tkg) — legacy series only
#    (5.x amdgpu-si-cik-default). https://github.com/Frogging-Family/community-patches
#
# MATERIALIZATION 05/11 (owner order GO): every candidate above is now a
# REAL entry with its patch file deposited under amd-patches/ and
# sha256-pinned. The dry-run statuses are authoritative per-atom results of
# `patch -p1 --fuzz=0 --dry-run` against a PRISTINE COPY of /tmp/linux-7.2.15
# (series kept as sequential chain: all-or-nothing pristine gate holds for
# OK steps). The v2 mbox (20260908041207) is SUPERSEDED by the v4 entered
# above. Frogging-Family: NOT fetchable as GPU patches (linux72-tkg carries
# only bbr3.mypatch; amdgpu-si-cik-default is 5.x-era script material).

