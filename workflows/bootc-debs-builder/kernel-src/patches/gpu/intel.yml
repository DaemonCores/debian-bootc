# Intel (i915/xe) kernel-tree patch set — DRM-tree patches applied to the
# kernel source NEXT TO patches-shared.yml (same run, same schema, same
# all-or-nothing dry-run; the VE lane resolves the same manifest). {series}
# resolves to the kernel series of the packaging tree.
#
# OWNER MANDATE 05/11 16:5x (GPU completions): the two lore series the
# owner named are FETCHED (full-thread, sha256-pinned below), PROBED per
# patch (patch -p1 --fuzz=0, pristine 7.2.15, standalone AND manifest
# order — the engine dry-runs the whole manifest on the pristine tree
# before applying, so any series-order dependency on a non-entering
# sibling fails the gate) and the applying subset ONLY enters; the rest
# is a PORTING LANE (K-PORT), never hand-forced.
#
# SOURCE SERIES 1 — GuC failure reporting (Umesh Nerlige Ramappa, Intel,
# oct 2026), v8 0/7..7/7 "Use SIG_ID logs for GuC component" on intel-xe.
# The xe_mmio_wait32 rework is IN this series (the gdrst wait call inside
# the GuC domain-reset path it reworks). Full-thread mbox
# (t.mbox.gz, fetched 05/11):
#   https://lore.kernel.org/intel-xe/20261016204354.364846-9-umesh.nerlige.ramappa@intel.com/t.mbox.gz
#   sha256 (t.mbox.gz): 2dcad76a919b8c453cac200bd0e00795b48de53196b532f46b0ad80c72f5540d
#   (lore per-message /raw 403s a bare-curl fetch; the gnuweeb lore mirror
#   serves the identical bytes — verified for the entered patches — so the
#   pins hold for either; mbox headers precede the diff, patch(1) skips
#   them).
#   APPLIED (2 of the 7 pass fuzz-0 AND compile standalone on 7.2.15):
#     [v8 1/7] guc: Use different error codes for GuC load errors
#     [v8 2/7] guc: Handle CRASH and EXCEPTION G2H with separate helpers
#   K-PORT (5 of 7): [v8 3/7] ct_dead_capture non-debug, [v8 4/7] CT error
#   cleanup, [v8 6/7] major GuC failures SIGID (the owner-named anchor
#   20261016204354.364846-15 — series-order dependent: applies only after
#   [5/7] is in, and the engine dry-runs the whole manifest on the pristine
#   tree first; standalone = conflict, 05/11 probe), [v8 7/7] CT shutdown
#   SIGID (same dependency, entered [5/7] then conflicts on the GuC file
#   context), [v8 5/7] xe/uc: Report DMA failure using SIGID (REMOVED from
#   the entered set on 09/11, run 42622490165 proof: it applies fuzz-0 but
#   adds `#include "xe_log.h"` in xe_uc_fw.c and NO patch of this series
#   creates xe_log.h — the header only exists on the drm-intel-next base the
#   series was written against, and xe_log.h is absent from 7.2.15:
#   'fatal error: xe_log.h: No such file or directory'). The fuzz-0
#   standalone gate PROVES APPLICATION, not COMPILABILITY: an entry that
#   references a symbol/header a non-entered sibling or a foreign base
#   provides must stay in K-PORT — [1/7] (xe_guc.c) and [2/7]
#   (xe_guc_ct.c) compiled clean in the same run. PORTING TASK: port
#   xe_log.h to 7.2.15 (upstream the logging helper) or wait for the
#   mainline merge; owner GO per entry batch.
#
# SOURCE SERIES 2 — Per-BO host NUMA node placement (Himal Prasad Ghimiray,
# Intel, nov 2026), RFC 0/7..7/7 "drm/ttm, drm/xe: Per-BO host NUMA node
# placement" on intel-xe; the pinned_link work rides it (the pinned-link
# restore path inside the xe/bo backup/restore patch). Full-thread mbox
# (t.mbox.gz, fetched 05/11):
#   https://lore.kernel.org/intel-xe/20261102101803.455921-9-himal.prasad.ghimiray@intel.com/t.mbox.gz
#   sha256 (t.mbox.gz): 3dddb69e0166b3c941dac295cfaca0021a8adc43966c362002943ff597856ee3
#   APPLIED (2 of the 7 RFC patches, BOTH standalone-compilable on 7.2.15):
#     [RFC 3/7] ttm/pool: enforce per-node cache limits on free
#     [RFC 6/7] xe/uapi: Add GEM_CREATE NUMA node placement property
#   K-PORT (6 of 7): [RFC 0/7] cover (no body), [RFC 1/7] ttm_pool_alloc_node
#   (ttm pool file context moved on 7.2.15 — re-probed 09/11 on the pristine
#   v7.2 tree: hunks 2 and 7 fail fuzz-0, 5 apply; sha of the raw for the
#   porting task: 511dff3dad3dadd9fe3058046f3b6a9870a4f7eb04f1054ac75d5c69e02ef33e),
#   [RFC 2/7] NUMA-aware restore helpers, [RFC 4/7] xe/bo: Plumb a per-BO
#   host NUMA node hint into tt populate (REMOVED from the entered set on
#   09/11, run 42607738525 proof: it APPLIES fuzz-0 standalone but CALLS
#   ttm_pool_alloc_node() — without [1/7] the kernel does not compile,
#   drivers/gpu/drm/xe/xe_bo.c:659 implicit declaration; a patch that
#   depends on a non-entered sibling can never enter first, the GuC
#   series-order rule below applies), [RFC 5/7] preserve host NUMA across
#   backup/restore (the pinned_link home; applies only after [2/7]+[4/7],
#   standalone=conflict), [RFC 7/7] wire up GEM_CREATE NUMA handler (depends
#   [6/7] uapi). An RFC series is by definition not final (CI re-sends
#   in-thread); PORTING TASK: track the v2 of the RFC, re-probe
#   [1/7],[2/7],[4/7],[5/7],[7/7] per new revision, owner GO per entry batch.
#   RFC CAVEAT (documented honesty): the entered [3/7],[6/7] are
#   RFC-grade material (owner lead); if a revision reworks them, the sha256
#   pin makes the drift fail the build and the entry is re-visited.
#
# NOT ENTERED (checked, does not ride a patch-file set): AuxCCS rides a
# [git pull] drm merge (a TREE state, not a patch); CachyOS rt-i915 is an
# RT-compat rework, not a perf patch (proof sha256, 7.2/7.3 byte-identical:
#   cfc0f69ca9bdf97cd269c5abebed5ff97c8b5f88402c3fd5d0b77ea5a647000b);
# drm-intel-next / intel-next = trees (cherry-pick lane, owner arbitration).
#
# All entries: stage amd64 (i915/xe are x86_64-only drivers; the arm64 deb
# lane must stay untouched or its linux-image dry-run would fail). Order =
# series order, GuC series first, then the NUMA RFC.
