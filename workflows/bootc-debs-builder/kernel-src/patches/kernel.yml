      # 0004-ata-before-graphics REMOVED (series 7.0 review): downloads but no
      # longer applies to the 7.0.x tree — drivers initialize ata before
      # graphics upstream now.
      # BORE travels with the shared set (owner 2026-11-03): its config pin
      # (SCHED_BORE) lives in kconfig/x86-common.cfg, so both kernels get the
      # sched profile from the same source. CachyOS serves the series dir per
      # {series}; a series without a bore sibling fails the consumer build
      # (dry-run, all-or-nothing) and keeps the last-good deb. Series
      # exclusion (owner arbitration 2026-11-03 13:05 lane, series probe
      # R-801-style): CachyOS carries NO 7.0 sibling (the PVE 7.0.x packaging
      # tree) and the patch does not apply to it (run 41628726241) — the
      # entry is excluded on that series only (helper filter exclude-series);
      # the SCHED_BORE pin simply resolves as absent there. A series bump
      # re-arms it automatically.
      - name: rocknix-btrtl-rtl8733bu
        # DEBIAN-LANE MODULE CARRIER (owner arbitration 2026-11-03 13:05:
        # production packages.yaml carry NO native patch data — this entry
        # moved out of debian-bootc packages.yml). Debian-lane, arm64 tree:
        # the RTL8733BU device support rides on the arm64 kernel builds.
        # 171 chars: the upstream file name cannot be split (YAML folds a
        # line break to a space, which would corrupt the URL).
        url: https://github.com/ROCKNIX/distribution/raw/next/projects/ROCKNIX/packages/linux/patches/mainline/0005-Bluetooth-btrtl-Add-the-support-for-RTL8733BU.patch
        stage: arm64
        class: module
        # The upstream context of btusb.c moved (186 lines, two context lines
        # differ); the hunk only inserts one device-ID entry. Placement verified on
        # 7.2.14: it lands between 0xb011 and the 8761BUV block.
        fuzz: 2
        license: GPL-2.0-only
      - name: bore
        # DORMANT (2026-11-04, proven): the CachyOS 7.2/7.3 bore hunks no longer
        # apply to any vanilla tree (fair.c LOG->NONE upstream drift; dry-run
        # FAIL on vanilla 7.2.15 AND 7.3). Series-gated OFF until upstream
        # ships a bore patch matching the vanilla tree again — REMOVE the
        # excludes of the new series (and the consumer-side filter that
        # debian-bootc c726774 added while the engine still exported bore)
        # when re-arming. The URL stays the renamed 0001-bore-cachy.patch.
        url: https://raw.githubusercontent.com/CachyOS/kernel-patches/master/{series}/sched/0001-bore-cachy.patch
        stage: common
        exclude-series: ["7.0", "7.1", "7.2", "7.3"]
        license: GPL-2.0-only

