---
# shared kernel patch data — the CANONICAL patch list (owner 11/11: the
# kernel data lives in the PRODUCT repo, strictly nothing in the engine):
# shipped here under kernel-src/patches/, consumed by the linux-image build
# (packages.yml) in file mode; the PVE side seeds from the published deb.
# kernel build (DaemonCores-VE) applies the same manifest resolved by the
# REAL kernel version of the packaging tree. One list, two consumers, no
# copy in either consumer repo, no fetch between production repositories.
# {seriesdir}/{topic} placeholders resolve inside kernel_patch_list
# (DaemonCores-CI): each lane resolves its own kernel series (the PVE
# packaging carries a Debian 6.12.x kernel tree — the series resolves by
# that tree's Makefile, not by the 7.0.x packaging version). Source
# Source reviewed 2026-10-29: 17 xanmod + 3 clearlinux entries + bore (which
# travels with the shared set so the SCHED_BORE pin of
# kconfig/x86-common.cfg resolves on both kernels);
# ARM OPTI update 2026-11-09 (owner mandate): +2 clearlinux generic
# completions (0166 sched-fair upper-limit, 0174 memcg CHARGE_BATCH) and
# +1 arm64 additive (msm-adreno devfreq IFPC relax, lore-pinned) — counts
# now 25 entries (23 common, 2 stage arm64) + the dormant bore + the
# rocknix module carrier; bore re-probed and still K-PORT (see its entry).
# 0004-ata-before-graphics removed (does not apply to the consumer trees);
# 0003-kbuild-sms-pipelining retired (dry-run fails on both series
# variants). A patch that cannot be downloaded or applied fails the
# consumer build (dry-run all-or-nothing).
patches:
      - name: 0001-x86-cflags
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0001-XANMOD-x86-build-Add-more-CFLAGS-optimizations.patch
