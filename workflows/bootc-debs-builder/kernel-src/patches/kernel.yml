      # Clear-linux generic completions (owner mandate ARM OPTI 2026-11-09):
      # the two generic Serie.clr entries the shared set was missing. Dry-run
      # fuzz 0 PASS on pristine 7.2.15 (2026-11-09) and in manifest order on
      # the FULL set (log: build-local, tarball sha256 d0f6b1d7...809ab).
      # 0166 drops the fair.c upper limit on CPU numbers (big NR_CPUS sched
      # domains); 0174 raises MEMCG_CHARGE_BATCH to 128 (fewer memcg charge
      # round-trips, LLM-shaped allocations). Both touch generic files,
      # stage common = arm64 AND amd64.
      - name: 0166-sched-fair-remove-upper-limit
        url: https://raw.githubusercontent.com/clearlinux-pkgs/linux/main/0166-sched-fair-remove-upper-limit-on-cpu-number.patch
        stage: common
        sha256: e6a7bfa9844f5f6bde6ef0a149dd58a7ad7dcfceae45cb08a9a4fd638d6ff0e9
        license: GPL-2.0-only
      # 0174-memcg-charge-batch-128 K-PORT (2026-11-09, run 42713342754): the
      # patch applies fuzz-0 but does NOT build — mainline carries
      # BUILD_BUG_ON(MEMCG_CHARGE_BATCH > S8_MAX) in memcontrol.h (s8 field,
      # hard cap 127); bumping to 128 fails every kernel build at
      # mm/memcontrol.o (21 wave0 reds amd64+arm64). Re-introduction requires
      # a follow-up s8->s16 field change upstream, out of scope here.
      # 0004-ata-before-graphics REMOVED (series 7.0 review): downloads but no
      # longer applies to the 7.0.x tree — drivers initialize ata before
      # graphics upstream now.
      # BORE travels with the shared set (owner 2026-11-03): its config pin
      # (SCHED_BORE) lives in kconfig/x86-common.cfg, so both kernels get the
      # sched profile from the same source. CachyOS serves the series dir per
      # {series}; a series without a bore sibling fails the consumer build
      # (dry-run, all-or-nothing) and keeps the last-good deb. Series
      # exclusion (owner arbitration 2026-11-03 13:05 lane, series probe
      # R-801-style): CachyOS carries NO 7.0 sibling (the PVE 7.0.x packaging
      # tree) and the patch does not apply to it (run 41628726241) — the
      # entry is excluded on that series only (helper filter exclude-series);
      # the SCHED_BORE pin simply resolves as absent there. A series bump
      # re-arms it automatically.
      - name: rocknix-btrtl-rtl8733bu
        # DEBIAN-LANE MODULE CARRIER (owner arbitration 2026-11-03 13:05:
        # production packages.yaml carry NO native patch data — this entry
        # moved out of debian-bootc packages.yml). Debian-lane, arm64 tree:
        # the RTL8733BU device support rides on the arm64 kernel builds.
        # 171 chars: the upstream file name cannot be split (YAML folds a
        # line break to a space, which would corrupt the URL).
        url: https://github.com/ROCKNIX/distribution/raw/next/projects/ROCKNIX/packages/linux/patches/mainline/0005-Bluetooth-btrtl-Add-the-support-for-RTL8733BU.patch
        stage: arm64
        class: module
        # The upstream context of btusb.c moved (186 lines, two context lines
        # differ); the hunk only inserts one device-ID entry. Placement verified on
        # 7.2.14: it lands between 0xb011 and the 8761BUV block.
        fuzz: 2
        license: GPL-2.0-only
      - name: bore
        # DORMANT — RE-PROBED 2026-11-09 (owner mandate ARM OPTI): still KO.
        # The CachyOS series siblings {7.2,7.3} both FAIL the fuzz-0 dry-run
        # against vanilla 7.2.15 (fair.c: hunks #2,#10-#12,#15-#19 of 22, the
        # LOG->NONE drift; 6.12 sibling fails even harder). Verdict per
        # series: K-PORT everywhere, series-gating unchanged. The byte
        # identity of the upstream siblings (2026-11-09):
        # 7.2 1809a4d4d6508a2a..., 7.3 d2eaa8e8dbf1f56b..., 6.12 b6174446ed6d...
        # (full digests in the dry-run report). DORMANT (2026-11-04, proven): the CachyOS 7.2/7.3 bore hunks no longer
        # apply to any vanilla tree (fair.c LOG->NONE upstream drift; dry-run
        # FAIL on vanilla 7.2.15 AND 7.3). Series-gated OFF until upstream
        # ships a bore patch matching the vanilla tree again — REMOVE the
        # excludes of the new series (and the consumer-side filter that
        # debian-bootc c726774 added while the engine still exported bore)
        # when re-arming. The URL stays the renamed 0001-bore-cachy.patch.
        url: https://raw.githubusercontent.com/CachyOS/kernel-patches/master/{series}/sched/0001-bore-cachy.patch
        stage: common
        exclude-series: ["7.0", "7.1", "7.2", "7.3"]
        license: GPL-2.0-only
      # drm/msm/adreno devfreq IFPC (owner mandate ARM OPTI 2026-11-09, the
      # feasibility report item 6). ARM-NEUTRE HOME DECISION: the patch goes
      # HERE (stage arm64), NOT patches-gpu/amd.yml — the gpu manifests
      # patch the AMDGPU/nvidia drivers of the amd64 gpu DEB lane (arm64
      # carries NO gpu deb, doctrine), while msm is an arm64 SoC in-tree
      # driver that only arm64 KERNEL builds need. lore:
      # https://lore.kernel.org/dri-devel/20250720-ifpc-support-v1-17-9347aa5bcbd6@oss.qualcomm.com
      # (the mbox serves headers before the diff; patch(1) skips them —
      # same convention as the patches-gpu lore entries). K-PORT BOTH
      # siblings of the series: the [16/17] a6xx X1-85 enablement FAILS raw
      # (a6xx_catalog.c table drifted), and the [17/17] devfreq relax itself
      # does NOT COMPILE without it — run 42715501467 job linux-image-ia-
      # armv8.0: msm_gpu_devfreq.c:162 'ADRENO_QUIRK_IFPC undeclared', the
      # quirk is introduced only by [16/17]. Dry-run fuzz 0 proved the
      # application, never the compilation (same lesson as 0174 memcg).
      # Re-arm = re-probe both when the a6xx catalog matches again.
