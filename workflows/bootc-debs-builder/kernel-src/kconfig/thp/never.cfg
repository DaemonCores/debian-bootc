# THP NEVER — the VM profile (owner correction 05/11 15:1x): the hugepage
# decision belongs to the GUEST via PVE memory (hugepages 2M/1G per VM/CT);
# host THP=always double-counts memory around guests that manage their own
# and breaks the balloon. Real kconfig: the THP bool unset = never, the two
# alternatives pinned off so olddefconfig cannot sit between the profiles.
# CONFIG_TRANSPARENT_HUGEPAGE is not set
CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS=n
CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=n
