# THP ALWAYS — the debian/IA compute pin (owner 2026-11-03 12:14 rev):
# the embedded AI-opti profile primes, critical. Real kconfig, the choice
# explicitly pinned (MADVISE pinned off so olddefconfig cannot flip).
CONFIG_TRANSPARENT_HUGEPAGE=y
CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS=y
CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=n

# THE release suffix (owner 13/11): one name per ABI profile and
# nothing else — 7.2.15-ia. The flavour, the vendor and the page
# size never appear: one module build per profile serves them all.
CONFIG_LOCALVERSION="-ia"
