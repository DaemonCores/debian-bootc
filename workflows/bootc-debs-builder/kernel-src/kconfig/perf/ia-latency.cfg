# IA LATENCY PROFILE (owner 14/11: "CONFIG_HZ=250 au lieu de 1000" — the IA
# profile must be the low-latency one). Merged AFTER the immutable union base
# (config.cfg carries CONFIG_HZ_250=y, which is why the x86-common pin was
# silently overridden) and only on the ia profile.
#
# Trade-off, stated: HZ=1000 means 1000 timer ticks/s instead of 250 — a
# slightly higher idle cost, in exchange for finer preemption and lower
# wake-up latency, which is what an inference host cares about (token
# streaming, GPU submission, CPU-side batched kernels). The vm profile keeps
# 250: its latency belongs to the guests.
CONFIG_HZ_1000=y
CONFIG_HZ=1000
