# SCHED_EXT (owner 14/11) — the mainline answer to BORE, without a carried
# patch: a BPF scheduler (scx_lavd, scx_bpfland, ...) is loaded at runtime and
# REPLACES the default policy; unloading returns to EEVDF. BORE patches EEVDF
# itself, so the two do not stack — carrying BORE would maintain an inert
# patch. Decision: sched_ext only, BORE exits.
#
# Why the union build dropped CONFIG_SCHED_CLASS_EXT although config.cfg
# declares it: sched_ext depends on CONFIG_DEBUG_INFO_BTF, which the base
# config does not enable, so olddefconfig silently removed the option. Both
# are set here, after the immutable base; the build installs pahole (dwarves)
# to generate the BTF section.
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_INFO_BTF=y
CONFIG_SCHED_CLASS_EXT=y
