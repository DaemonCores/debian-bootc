# VIRTUALISATION — CONFIG_VIRTUALIZATION / KVM / VFIO (owner 14/11: «un
# kernel proxmox sans kvm et sans vfio» = inacceptable; PVE doit pouvoir
# lancer ses VMs et passer un GPU). Ce fragment est merge APRÈS la base
# (config.cfg reste IMMUTABLE, R-869b): il AJOUTE ce que la base ne porte
# pas, il ne la contredit pas.
#
# KVM en modules (=m): c'est la forme standard PVE (kvm.ko + kvm_intel/amd),
# elle permet d'éviter le code inutilisé sur une machine qui n'héberge pas de
# VM et reste chargeable à chaud.
CONFIG_VIRTUALIZATION=y
CONFIG_KVM=m
CONFIG_KVM_X86=m
CONFIG_KVM_INTEL=m
CONFIG_KVM_AMD=m
CONFIG_KVM_GENERIC_DIRTYLOG_READ_PROTECT=y
CONFIG_KVM_COMPAT=y
CONFIG_HAVE_KVM_IRQCHIP=y
CONFIG_HAVE_KVM_IRQFD=y
CONFIG_HAVE_KVM_IRQ_ROUTING=y
CONFIG_HAVE_KVM_EVENTFD=y
CONFIG_KVM_ASYNC_PF=y
CONFIG_KVM_VFIO=y
CONFIG_KVM_GENERIC_MMU_NOTIFIER=y
CONFIG_VHOST_NET=m
CONFIG_VHOST_VSOCK=m
CONFIG_VHOST=m

# VFIO / IOMMU: passthrough GPU et PCI vers les VMs (RTX du docker/proxy,
# périphériques USB). Sans IOMMU_SUPPORT, VFIO ne se construit pas.
CONFIG_IOMMU_SUPPORT=y
CONFIG_IOMMU_IOVA=y
CONFIG_VFIO=m
CONFIG_VFIO_IOMMU_TYPE1=m
CONFIG_VFIO_VIRQFD=m
CONFIG_VFIO_PCI=m
CONFIG_VFIO_PCI_CORE=m
CONFIG_VFIO_PCI_MMAP=y
CONFIG_VFIO_PCI_INTX=y
