# XanMod-flavoured x86 settings shared by every amd64 flavour — and by BOTH
# kernels in patch parity (owner 2026-11-03): the debian linux-image build
# merges this fragment in-repo, the PVE build (DaemonCores-VE) consumes it by
# pinned commit + sha256.
# CC_OPTIMIZE_FOR_PERFORMANCE activates the XanMod -O3 kbuild patch
# (0001: -O3 + -fivopts, and 0002/0003 add poly-loop/SMS flags).
CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
# XanMod timing: 1000 Hz tick, full preemption (the 500 Hz option of patch
# 0011 stays off — host latency profile, not gaming profile).
CONFIG_HZ_1000=y
CONFIG_PREEMPT=y
CONFIG_PREEMPT_DYNAMIC=y
# Debug noise off (patch 0016 already flips the default).
CONFIG_SYMBOLIC_ERRNAME=n
# Owner pins 2026-11-03 (functional set, gaming + compute; nothing silent):
# both fall on mainline defaults in some configs and would vanish silently.
# io_uring: async I/O is the compute and server hot path — pinned, not
# defaulted. ntsync: in-tree WINNT sync driver (>= 6.14) for the real
# Wine/Proton gaming path — a module. SCHED_BORE: REMOVED 2026-11-04
# (proven) — the bore sibling is DORMANT in patches-shared.yml (CachyOS
# 7.2/7.3 hunks no longer fit any vanilla tree), so the symbol is not
# declared by this kernel: a dead pin kills the gate. Re-pin here when bore
# re-arms.
CONFIG_IO_URING=y
CONFIG_NTSYNC=m
# THP arbitration v2 (owner, 2026-11-03 12:14 revised): THP state is NOT
# shared — the two lanes are the two opposite ends of the hugepage decision.
# DEBIAN = ALWAYS here (embedded AI-opti profile primes, critical). VE =
# NEVER, pinned lane-side in DaemonCores-VE (hypervisor: the hugepage
# decision belongs to the GUEST via PVE memory: hugepages 2M/1G per VM/CT —
# host THP=always double-counts memory around guests that manage their own
# and breaks the balloon; the compute profile is tuned PER-GUEST, never on
# the host). MADVISE is pinned off here so olddefconfig cannot sit between
# the two profiles.
CONFIG_TRANSPARENT_HUGEPAGE=y
CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS=y
CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=n
