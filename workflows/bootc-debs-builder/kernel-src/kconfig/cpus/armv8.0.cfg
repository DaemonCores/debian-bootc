# armv8.0 flavour: the arm64 baseline (kernel default codegen, GC-only,
# no LSE atomics requirement). The build passes KCFLAGS="" here ON
# PURPOSE (owner mandate ARM OPTI 2026-11-09): the flavour spans the
# Cortex-A53 AND Cortex-A72 classes, a -mcpu=<core> pin would mis-tune
# one of the two — the bare armv8-a tree default is the honest level
# floor. The build script passes KCFLAGS="" via kernel_flavour_kcflags.
CONFIG_LOCALVERSION="-armv8.0-default1"