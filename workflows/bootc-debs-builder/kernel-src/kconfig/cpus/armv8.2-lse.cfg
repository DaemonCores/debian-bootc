# armv8.2-lse flavour: armv8.2-a with LSE atomics required. Owner mandate
# ARM OPTI 2026-11-09: the effective C codegen flag is
# -mcpu=cortex-a76 (kernel_flavour_kcflags, KCFLAGS = the LAST word of
# KBUILD_CFLAGS; the arm64 tree Makefile sets no C -march, only
# -Wa,-march for asm) — the same ISA floor the former
# -march=armv8.2-a+lse carried, PLUS the Cortex-A76 scheduler tuning of
# the level's representative core: the compiler stops emitting the LL/SC
# fallback loops and schedules for the A76 pipelines.
CONFIG_LOCALVERSION="-armv8.2-lse1"