# armv9-sve2 flavour: armv9-a with SVE2 required. Owner mandate ARM OPTI
# 2026-11-09: the effective C codegen flag is -mcpu=neoverse-v2
# (kernel_flavour_kcflags; -Q proof: .arch armv9-a+sve2-bitperm) — the
# same ISA floor the former -march=armv9-a+sve2 carried, PLUS the
# Neoverse V2 scheduler tuning. Scales vector workloads on the v9
# cores (Neoverse V2-class); the baseline arm64 lanes never carry this flag.
CONFIG_LOCALVERSION="-armv9-sve21"