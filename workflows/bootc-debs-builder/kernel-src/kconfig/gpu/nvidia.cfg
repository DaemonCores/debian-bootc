# kernel/kconfig-shared/gpu/nvidia.cfg
#
# NVIDIA in-kernel prerequisites. NVRM (the proprietary NVIDIA kernel module)
# is OUT-OF-TREE and can never be merged into the kernel build: it builds as
# a DKMS package against the installed kernel (GO-gated lane, see the wiki
# GPU-Support page). What the kernel build must provide is the infrastructure
# NVRM (and nouveau, its free counterpart, for the default path) depends on.
# Everything is transverse: ONE kernel build serves every vendor.

CONFIG_DRM=m
CONFIG_DRM_NOUVEAU=m
# NOUVEAU_LEGACY_CTX_SUPPORT REMOVED 2026-11-04 (proven): the symbol no longer
# exists upstream (removed from the nouveau driver) — a dead pin kills the
# kconfig gate on any current tree.
CONFIG_MMU_NOTIFIER=m
CONFIG_FW_LOADER=y
CONFIG_FW_LOADER_USER_HELPER=n
CONFIG_DRM_GPUVM=m
CONFIG_DRM_TTM=m
CONFIG_DRM_TTM_HELPER=m
