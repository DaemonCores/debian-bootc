# kernel/kconfig-shared/gpu/amd.cfg
#
# AMD GPU support, transverse modules (Gabriel 30/10: ONE optimised kernel
# build carries every vendor; no per-vendor build matrix). amdgpu with DC
# (Display Core), KFD/HSA for ROCm compute (the HSA userptr path the ROCm
# runtime expects), and the ACP audio controller. Modules (m) where the
# PVE packaging already builds DRM drivers as modules; olddefconfig resolves
# everything the fragment does not list, so only deltas live here.

# Dead symbols REMOVED 2026-11-04 (proven, check_kconfig gate on the real
# 7.2.15 tree): DRM_AMD and DRM_AMD_CIK are pre-amdgpu names that vanished
# years ago; DRM_AMD_DC_HDCP and DRM_AMD_DC_DSC are not declared by the
# display/Kconfig of the 7.2/7.3 trees (DC_DSC lives at another path, and
# olddefconfig resolves defaults) — any dead pin here kills the build, so
# only live deltas stay in this fragment.

CONFIG_DRM_AMDGPU=m
CONFIG_DRM_AMDGPU_USERPTR=y
CONFIG_DRM_AMD_DC=y
CONFIG_DRM_AMD_DC_SI=y
CONFIG_HSA_AMD=y
CONFIG_HSA_AMD_SVM=y
CONFIG_DRM_AMD_ACP=y
CONFIG_DRM_AMD_DC_FP=y
