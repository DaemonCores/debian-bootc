# kernel/patches.yml
#
# Manifest of the patches applied to the kernel.org tarball at build time.
# The patch files themselves are never committed: each entry names the URL of
# the file in its official upstream repository, and lib/kernel-patches.sh
# downloads it. A patch that cannot be downloaded or does not apply fails the
# kernel build, so the last-good published deb is kept.
#
# Fields:
#   name   unique label used in logs
#   url    official upstream location; {series} is replaced by the kernel
#          series (7.2 for 7.2.11) and {version} by the full kernel version
#   stage  common (every architecture) or an architecture (amd64, arm64);
#          common patches are applied first, then the architecture ones
#   license  SPDX licence of the patch
#   class  kernel (applied to the kernel tree) or module (shipped as a module);
#          the rule is in docs/kernel-patches.md
#
# Official sources:
#   CachyOS    https://github.com/CachyOS/kernel-patches (one directory per series)
#   XanMod     https://gitlab.com/xanmod/linux-patches (one directory per series)
#   ROCKNIX    https://github.com/ROCKNIX/distribution (mainline device patches)
#   Raspberry  https://github.com/raspberrypi/linux (one branch per series)
patches:
  # Burst-Oriented Response Enhancer, a CFS/EEVDF scheduler tweak for
  # interactive latency. The scheduler core cannot be a module, so it goes in
  # the kernel; it is the only scheduler patch (no competing variant is applied).
  - name: bore
    url: https://raw.githubusercontent.com/CachyOS/kernel-patches/master/{series}/sched/0001-bore.patch
    stage: common
    license: GPL-2.0-only
    class: kernel

  # ROCKNIX mainline device patches (https://github.com/ROCKNIX/distribution).
  # Each file only touches tristate drivers or headers, so all are modules. They
  # apply in this order on 7.2.11; the {series} directory follows the kernel.
  # pwm_set_period helper (header) used by the handheld drivers
  - name: rocknix-0003-pwm-add-pwm_set_period
    url: https://raw.githubusercontent.com/ROCKNIX/distribution/next/projects/ROCKNIX/packages/linux/patches/mainline/0003-pwm-add-pwm_set_period.patch
    stage: arm64
    license: GPL-2.0-only
    class: module
