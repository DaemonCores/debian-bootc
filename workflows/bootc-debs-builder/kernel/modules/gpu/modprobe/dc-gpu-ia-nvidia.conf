# kernel/modules/gpu/modprobe/dc-gpu-ia-nvidia.conf
# Loader policy of the gpu-ia-nvidia set (GPU FINAL, owner 2026-11-03),
# shipped at /etc/modprobe.d/dc-gpu-ia-nvidia.conf by the gpu-ia-nvidia deb.
#
# This package carries ONLY the loader policy: its in-tree modules come from
# the gpu-ia deb (same compute build) and the NVIDIA open kernel modules
# (nvidia.ko, nvidia_uvm, nvidia_drm, nvidia_modeset, nvidia_peermem) from
# the linux-modules-nvidia base deb the entry depends on — the MIT
# open-gpu-kernel-modules built once in CI (nothing compiles on the target).
# The in-tree build is not rebuilt a second time (one modules-only build per
# profile, one NVIDIA base, four sets — the deb metadata of gpu-ia-nvidia
# pins that choice).
#
# Compute profile + NVIDIA open modules: nouveau must stay away from the
# device, the NVIDIA modules own it; nvidia_drm display is NOT activated
# (headless compute) — dc-gpu loads nvidia/nvidia_uvm through its
# modules-load fragment when the profile and the consent allow it.
#
# GSP OFF (owner 04/11, validated knob on the PVE host): the proprietary
# GSP firmware path stays disabled in favour of the bare computation the
# compute profile runs. The knob is the deb's payload, never a host tweak.
#
# VRAM RESERVE (owner 04/11, after the lmganon16/nvidia-vram-research sweep):
# RMInstLoc2=0x1 moves the compression-tag backing store to coherent system
# memory (measured ~50 MiB VRAM recovered, stable on GA104). Registry knob
# documented in nvrm_registry.h — reversible by removing the option.
blacklist nouveau
options nvidia NVreg_EnableGpuFirmware=0 NVreg_RegistryDwords=RMInstLoc2=0x00000001