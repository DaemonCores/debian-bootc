---
# kernel-pve patch data — the CANONICAL patch list of the PVE kernel lane
# (the XanMod set applied over the Proxmox kernel packaging at build time)
# AND the debian linux-image build: PATCH PARITY (owner, 2026-11-03). The
# debian kernel applies this same set in addition to its own anchor patches
# (packages.yml linux-image); the PVE kernel build (DaemonCores-VE) consumes
# this exact file by pinned commit + sha256 — one list, two consumers, no
# copy outside this repository. {seriesdir}/{topic} placeholders resolve
# inside kernel_patch_list (DaemonCores-CI): each lane resolves its own
# kernel series (PVE tracks 7.0.x -> eol/linux-7.0.y-xanmod; the debian
# kernel resolves its tracked series). Source reviewed 2026-10-29 (series
# 7.0): 17 xanmod + 3 clearlinux entries + bore (which travels with the
# shared set so the SCHED_BORE pin of kconfig/x86-common.cfg resolves on
# both kernels); 0004-ata-before-graphics removed (no
# longer applies to the 7.0.x tree); 0003-kbuild-sms-pipelining retired
# (dry-run fails on both series variants). A patch that cannot be downloaded
# or applied fails the consumer build (dry-run all-or-nothing).
patches:
      - name: 0001-x86-cflags
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0001-XANMOD-x86-build-Add-more-CFLAGS-optimizations.patch
        topic: xanmod
        stage: common
      # 0002-kbuild-llvm-plo: PINNED to the active 7.3 file: the EOL 7.0
      # sibling does not apply to the 7.0.x tree; the absolute URL keeps a
      # series bump from silently moving it.
      - name: 0002-kbuild-llvm-plo
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/linux-7.3.y-xanmod/xanmod/0002-XANMOD-kbuild-Add-LLVM-polyhedral-loop-optimizer-fla.patch
        topic: xanmod
        stage: common
      - name: 0004-kbuild-debpkg-dbg
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0004-XANMOD-kbuild-deb-pkg-Create-dbg-when-make-DEB_DEBUG.patch
        topic: xanmod
        stage: common
      - name: 0005-kbuild-sign-external-cfg
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0005-kbuild-Re-add-.config-file-required-to-sign-external.patch
        topic: xanmod
        stage: common
      - name: 0006-fair-unscaled-tunables
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0006-XANMOD-fair-Set-scheduler-tunable-latencies-to-unsca.patch
        topic: xanmod
        stage: common
      - name: 0007-mq-deadline-write-prio
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0007-XANMOD-block-mq-deadline-Increase-write-priority-to-.patch
        topic: xanmod
        stage: common
      - name: 0008-mq-deadline-front-merges
