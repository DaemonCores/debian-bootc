# kernel-pve/modprobe/dc-gpu-ia-nvidia.conf
# Loader policy of the gpu-ia-nvidia-pve wrapper — ported from the
# debian-bootc lane (kernel/modules/gpu/modprobe, verbatim): the PVE tree
# wrapper ships the SAME policy, paired to the linux-modules-nvidia-pve
# module pair of the kernel-pve packaging.
#
# Compute profile + NVIDIA open modules: nouveau must stay away from the
# device, the NVIDIA modules own it; nvidia_drm display is NOT activated
# (headless compute).
blacklist nouveau