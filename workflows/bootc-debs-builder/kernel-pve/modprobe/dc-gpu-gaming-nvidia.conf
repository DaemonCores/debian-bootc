# kernel-pve/modprobe/dc-gpu-gaming-nvidia.conf
# Loader policy of the gpu-gaming-nvidia-pve wrapper — ported from the
# debian-bootc lane (kernel/modules/gpu/modprobe, verbatim): the PVE tree
# wrapper ships the SAME policy, paired to the linux-modules-nvidia-pve
# module pair of the kernel-pve packaging.
#
# Display profile + NVIDIA open modules: nouveau must stay away from the
# device, the NVIDIA modules own it; the KMS modeset of nvidia_drm is
# enabled so the display path works.
blacklist nouveau
options nvidia-drm modeset=1