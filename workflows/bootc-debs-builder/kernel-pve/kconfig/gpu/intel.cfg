# kernel-pve/kconfig/gpu/intel.cfg
#
# Intel GPU support, transverse modules (Gabriel 30/10: ONE optimised kernel
# build carries every vendor; no per-vendor build matrix). i915 with force
# probe (covering the newer client SKUs the distro config gates), the new xe
# driver, and the GuC/HuC firmware paths (loading itself is a runtime switch
# via i915.guc_firmware_load style settings, the build only enables the
# plumbing). Modules (m) matching the PVE packaging's DRM layout;
# olddefconfig resolves everything the fragment does not list, so only
# deltas live here.

CONFIG_DRM_I915=m
CONFIG_DRM_I915_FORCE_PROBE="*"
CONFIG_DRM_I915_USERPTR=y
CONFIG_DRM_I915_PXP=y
CONFIG_DRM_XE=m
CONFIG_DRM_I915_REQUEST_TIMEOUT=20000
