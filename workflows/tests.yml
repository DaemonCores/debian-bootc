# Exhaustive image tests, run on a real boot of the built image (bootc install
# to a virtual disk + QEMU/KVM), executed over SSH before the image is pushed.
# A failing test blocks the push.
#
#   boot_timeout   seconds to wait for the VM to answer SSH
#   tests[].name   label shown in the CI log
#   tests[].run    command executed on the VM; passes on exit 0
#   tests[].expect optional: pass instead when this string is in the output
#   tests[].diag   REQUIRED: command run over SSH when this test fails, to
#                  capture the runtime state behind the failure. The harness
#                  refuses to run (fails the build) if any test lacks a diag,
#                  so a failure can never be undiagnosable.
#   tests[].arch   optional: `amd64` or `arm64` to run the test ONLY on that
#                  arch. Absent = run on both. Used for UEFI/GRUB/shim tests
#                  that are x86_64-only, and for U-Boot tests that are
#                  arm64-only. The harness skips a test whose arch does not
#                  match the running arch (reports SKIP, not FAIL).
#   categories     optional: one entry per class of image, picked from the tag
#                  (minus its `_<arch>`) by the longest `suffix` that ends it,
#                  among the entries of the running arch. Each has `name`,
#                  `arch`, `suffix` ("" = the plain tags), `secure_boot` (0|1:
#                  how the VM is booted) and `reference: true` on exactly one
#                  entry per arch. A manifest without `categories` runs every
#                  test with Secure Boot off.
#   tests[].category optional block list of category names: the test runs ONLY
#                  on those. Absent = global test, run on the reference
#                  category only (the most complete and most secured image).
#   tests[].variant optional: `main` or `minimal` to run the test ONLY on that
#                  image variant. Absent = run on all variants. Used for tests
#                  that target packages present only in the full (main) image,
#                  such as ifupdown2 or firstboot-user-setup. The harness skips
#                  a test whose variant does not match (reports SKIP, not FAIL).

boot_timeout: 60
# Timeout for the VM to come back after the rollback reboot (shorter than
# boot_timeout since the image is already installed — no dracut rebuild).
reboot_timeout: 60

# The signed image is the reference: the most complete and the most secured, so
# the global tests run there once. The other categories boot with their own
# security profile and run only the tests listed for them.
categories:
  - name: signed
    arch: amd64
    suffix: ""
    secure_boot: 1
    reference: true
  - name: unsigned-kernel
    arch: amd64
    suffix: "-nosign"
    secure_boot: 0
  - name: signed
    arch: arm64
    suffix: ""
    secure_boot: 1
    reference: true
  # U-Boot devices have no secure boot (see packages.yml, kernel -4k).
  - name: uboot
    arch: arm64
    suffix: "-4k"
    secure_boot: 0
  - name: unsigned-kernel
    arch: arm64
    suffix: "-nosign"
    secure_boot: 0

tests:
  # ── bootc / ostree / immutability ──────────────────────────────────────
  - name: booted through bootc
    run: bootc status --format=json
    expect: booted
    diag: |
      bootc status 2>&1 | head -n 30
      echo "--- boot journal tail ---"
      journalctl -b --no-pager 2>&1 | tail -n 30
  - name: bootc binary works
    run: bootc --version
    diag: |
      bootc --version 2>&1; ldd "$(command -v bootc)" 2>&1 | head -n 15
  # One image per tag: automatic updates are on by default and switched off
  # at run time by a symlink to /dev/null in /etc (what the installer writes
  # when the user unticks them).
  - name: automatic updates are on by default
    run: test "$(systemctl is-enabled bootc-fetch-apply-updates.timer)" = enabled
    diag: |
      systemctl status bootc-fetch-apply-updates.timer --no-pager 2>&1 | head -n 15
      ls -la /etc/systemd/system/bootc-fetch-apply-updates.timer 2>&1
  - name: a symlink in /etc switches automatic updates off
    run: |
      unit=/etc/systemd/system/bootc-fetch-apply-updates.timer
      cleanup() { rm -f "${unit}"; systemctl daemon-reload; }
      trap cleanup EXIT
      ln -s /dev/null "${unit}"
      systemctl daemon-reload
      [ "$(systemctl is-enabled bootc-fetch-apply-updates.timer 2>&1)" = masked ]
      rm -f "${unit}"
      systemctl daemon-reload
      [ "$(systemctl is-enabled bootc-fetch-apply-updates.timer)" = enabled ]
      # Unmasking leaves the timer's last activation state "failed" behind: a
      # masked unit never ran, so systemd keeps its failed activation until
      # explicitly cleared. Without this, the later "no failed systemd units"
      # test fails on a state the mask cycle itself created (replayed boot-test
      # 2026-10-30).
      systemctl reset-failed bootc-fetch-apply-updates.timer 2>&1 || true
    diag: |
      ls -la /etc/systemd/system/bootc-fetch-apply-updates.timer 2>&1
      systemctl is-enabled bootc-fetch-apply-updates.timer 2>&1
  - name: the autoupdate command switches automatic updates off and on
    run: |
      cleanup() { autoupdate enable; }
      trap cleanup EXIT
      autoupdate disable
      [ "$(systemctl is-enabled bootc-fetch-apply-updates.timer 2>&1)" = masked ]
      autoupdate status | grep -q disabled
      autoupdate enable
      [ "$(systemctl is-enabled bootc-fetch-apply-updates.timer)" = enabled ]
      autoupdate status | grep -q enabled
      # Clear the activation state the mask cycle left behind (see the symlink
      # test above): the later "no failed systemd units" check must not inherit it.
      systemctl reset-failed bootc-fetch-apply-updates.timer 2>&1 || true
    diag: |
      command -v autoupdate 2>&1
      ls -la /etc/systemd/system/bootc-fetch-apply-updates.timer 2>&1
  - name: ostree deployment present
    run: test -d /ostree/deploy
    diag: |
      ls -la /ostree/deploy 2>&1
      ostree admin status 2>&1 | head -n 20
  - name: root is a composefs/overlay mount
    run: findmnt -no FSTYPE / | grep -qiE 'overlay|composefs'
    diag: |
      findmnt / 2>&1; echo '--- cmdline ---'; cat /proc/cmdline 2>&1
  - name: /usr is read-only
    run: "! touch /usr/.rw-probe 2>/dev/null"
    diag: |
      findmnt /usr 2>&1; mount 2>&1 | grep -i ' /usr '
  - name: /etc is writable
    run: touch /etc/.rw-probe && rm -f /etc/.rw-probe
    diag: |
      findmnt /etc 2>&1; ls -ld /etc 2>&1
  - name: /var is writable
    run: touch /var/.rw-probe && rm -f /var/.rw-probe
    diag: |
      findmnt /var 2>&1; ls -ld /var 2>&1
  - name: no failed systemd units
    run: test "$(systemctl --failed --no-legend | wc -l)" -eq 0
    diag: |
      systemctl --failed --no-pager 2>&1
      echo '--- networking.service status ---'
      systemctl status networking.service --no-pager -l 2>&1 | tail -20
      echo '--- networking.service journal ---'
      journalctl -u networking.service --no-pager -b 2>&1 | tail -30
  - name: systemd-logind not masked
    run: "! (systemctl is-enabled systemd-logind 2>&1 | grep -q masked)"
    diag: |
      systemctl is-enabled systemd-logind 2>&1
      systemctl status systemd-logind --no-pager -l 2>&1 | tail -20
      cat /etc/systemd/system/systemd-logind.service.d/headless.conf 2>&1 || echo "drop-in absent"
  - name: systemd-logind FailureAction=none
    run: systemctl show systemd-logind | grep -q '^FailureAction=none'
    diag: |
      systemctl show systemd-logind | grep FailureAction 2>&1
      cat /etc/systemd/system/systemd-logind.service.d/headless.conf 2>&1 || echo "drop-in absent"

  # ── bootloader / secure boot ───────────────────────────────────────────
  - name: bootupd present
    # bootupd is x86_64-only in this repo's build (the grub-efi-amd64-signed
    # package gates it). On arm64 the minimal image uses U-Boot, not bootupd.
    arch: amd64
    run: command -v bootupctl
    diag: |
      command -v bootupctl 2>&1 || echo absent; dpkg -l 2>&1 | grep -i bootupd
  - name: bootupd metadata readable
    arch: amd64
    run: bootupctl status
    diag: |
      bootupctl status 2>&1 | head -n 20
      ls -la /usr/lib/bootupd/updates/ 2>&1
  - name: signed GRUB EFI staged
    arch: amd64
    run: test -e /usr/lib/efi/grub2/*/EFI/debian/grubx64.efi
    diag: |
      ls -laR /usr/lib/efi/grub2/ 2>&1 | head -n 30
  - name: shim staged for firmware
    arch: amd64
    run: test -e /usr/lib/efi/shim/*/EFI/BOOT/BOOTX64.EFI
    diag: |
      ls -laR /usr/lib/efi/shim/ 2>&1 | head -n 30
  - name: Secure Boot signing cert shipped
    arch: amd64
    run: test -f /usr/share/debian-bootc/sb_signing.crt
    diag: |
      ls -la /usr/share/debian-bootc/ 2>&1
  # Per-category boot profile: the VM must have been booted the way the category
  # states (SecureBoot is the last byte of the UEFI global variable).
  - name: booted with UEFI Secure Boot enforced
    category:
      - signed
    run: |
      v=/sys/firmware/efi/efivars/SecureBoot-8be4df61-93ca-11d2-aa0d-00e098032b8c
      [ "$(tail -c1 "${v}" | od -An -tu1 | tr -d ' ')" = 1 ]
    diag: |
      ls -la /sys/firmware/efi/efivars/ 2>&1 | head -n 20
      od -An -tu1 /sys/firmware/efi/efivars/SecureBoot-* 2>&1
      dmesg 2>&1 | grep -i 'secure boot' | head -n 5
  - name: booted with UEFI Secure Boot off
    category:
      - unsigned-kernel
    run: |
      v=/sys/firmware/efi/efivars/SecureBoot-8be4df61-93ca-11d2-aa0d-00e098032b8c
      [ "$(tail -c1 "${v}" | od -An -tu1 | tr -d ' ')" = 0 ]
    diag: |
      ls -la /sys/firmware/efi/efivars/ 2>&1 | head -n 20
      od -An -tu1 /sys/firmware/efi/efivars/SecureBoot-* 2>&1
  - name: signed kernel enforces module signatures
    category:
      - signed
    run: '[ "$(cat /sys/module/module/parameters/sig_enforce)" = Y ]'
    diag: |
      cat /sys/module/module/parameters/sig_enforce 2>&1
      dpkg-query -W 'daemoncores-kernel-*' 2>&1
      cat /proc/cmdline 2>&1
  - name: unsigned-kernel variant does not enforce module signatures
    category:
      - unsigned-kernel
    run: '[ "$(cat /sys/module/module/parameters/sig_enforce)" = N ]'
    diag: |
      cat /sys/module/module/parameters/sig_enforce 2>&1
      dpkg-query -W 'daemoncores-kernel-*' 2>&1
  # arm64: U-Boot tooling replaces GRUB/shim. Verify mkimage is present on an
  # arm64 build. Skipped on amd64 where the image uses GRUB instead.
  # Note: Debian Trixie's u-boot-tools ships ONLY mkimage; fw_printenv and
  # fw_setenv are not in the package (no /usr/bin/fw_printenv in the filelist).
  - name: u-boot-tools present (arm64 boot stack)
    arch: arm64
    category:
      - signed
      - uboot
    run: command -v mkimage
    diag: |
      command -v mkimage 2>&1 || echo absent
      dpkg -l 2>&1 | grep -i u-boot

  # ── kernel / initramfs / dracut ────────────────────────────────────────
  - name: kernel modules tree present
    run: test -d /usr/lib/modules
    diag: |
      ls -la /usr/lib/modules/ 2>&1
  # ── module signing (an optional CI feature: all signed or nothing) ─────
  # The VM cannot know whether the CI signed this build, so each test derives
  # it from the modules themselves and checks the matching behaviour.
  - name: kernel modules are all signed or none is
    run: |
      signed=0; unsigned=0
      for m in $(find /usr/lib/modules -name '*.ko*'); do
        if [ -n "$(modinfo -F signer "$m" 2>/dev/null)" ]; then
          signed=$((signed + 1))
        else
          unsigned=$((unsigned + 1))
        fi
      done
      echo "signed=${signed} unsigned=${unsigned}"
      [ $((signed + unsigned)) -gt 0 ] && { [ "${signed}" -eq 0 ] || [ "${unsigned}" -eq 0 ]; }
    diag: |
      modinfo -F signer "$(find /usr/lib/modules -name '*.ko*' | head -1)" 2>&1
      find /usr/lib/modules -name '*.ko*' | wc -l
  # The kernel exists in a signed (enforcing) and an unsigned twin, both
  # installed from the same APT suite; the modules are the same signed package.
  # The installed kernel package tells which one this image carries.
  - name: signature enforcement follows the installed kernel
    run: |
      m=$(find /usr/lib/modules -name '*.ko*' | head -1)
      enforce=$(cat /sys/module/module/parameters/sig_enforce 2>/dev/null || echo absent)
      if dpkg-query -W -f '${Package}\n' 'daemoncores-kernel-*' | grep -q -- '-nosign$'; then
        echo "unsigned kernel, sig_enforce=${enforce}"
        [ "${enforce}" = N ]
      elif [ -n "$(modinfo -F signer "$m" 2>/dev/null)" ]; then
        echo "signed kernel, sig_enforce=${enforce}"
        [ "${enforce}" = Y ] && grep -q '\.machine' /proc/keys
      else
        echo "no signing key in this build, sig_enforce=${enforce}"
        [ "${enforce}" != Y ]
      fi
    diag: |
      dpkg-query -W 'daemoncores-kernel-*' 2>&1
      cat /sys/module/module/parameters/sig_enforce 2>&1
      cat /proc/keys 2>&1 | head -n 20
      cat /proc/cmdline 2>&1
  - name: a signed module loads on either kernel
    run: |
      m=$(find /usr/lib/modules -name 'dummy.ko*' | head -1)
      [ -n "${m}" ] || m=$(find /usr/lib/modules -name '*.ko*' -size -20k | head -1)
      if [ -z "$(modinfo -F signer "${m}" 2>/dev/null)" ]; then
        echo "no signing key in this build: no signed module to load"
        exit 0
      fi
      name=$(basename "${m}" | sed 's/\.ko.*//')
      insmod "${m}"
      lsmod | grep -q "^${name} "
      rmmod "${name}"
    diag: |
      dmesg 2>&1 | tail -n 15
      modinfo "$(find /usr/lib/modules -name 'dummy.ko*' | head -1)" 2>&1
      cat /sys/module/module/parameters/sig_enforce 2>&1
  - name: an unsigned module is refused when signing is enforced
    run: |
      m=$(find /usr/lib/modules -name 'dummy.ko*' | head -1)
      [ -n "${m}" ] || m=$(find /usr/lib/modules -name '*.ko*' -size -20k | head -1)
      if [ "$(cat /sys/module/module/parameters/sig_enforce 2>/dev/null)" != Y ]; then
        echo "signature enforcement is off on this kernel: nothing to refuse"
        exit 0
      fi
      case "${m}" in
        *.zst) dec="zstd -dc" ;;
        *.xz) dec="xz -dc" ;;
        *.gz) dec="gzip -dc" ;;
        *) dec=cat ;;
      esac
      ${dec} "${m}" >/tmp/signed.ko
      perl -e 'local $/; open F, "<", $ARGV[0]; binmode F; $d = <F>;
        $t = "~Module signature appended~\n";
        die "no signature\n" unless substr($d, -length $t) eq $t;
        $d = substr($d, 0, -length $t);
        $l = unpack("N", substr($d, -4));
        open O, ">", $ARGV[1]; binmode O;
        print O substr($d, 0, length($d) - 12 - $l)' /tmp/signed.ko /tmp/unsigned.ko
      if insmod /tmp/unsigned.ko 2>/tmp/insmod.err; then
        rmmod "$(basename "${m}" | sed 's/\.ko.*//')" 2>/dev/null
        echo "unsigned module was LOADED"
        exit 1
      fi
      dmesg | grep -qi 'unsigned module is rejected'
    diag: |
      cat /tmp/insmod.err 2>&1
      dmesg 2>&1 | tail -n 15
  - name: initramfs generated (bootc-finalize ran)
    run: test -e /usr/lib/modules/*/initramfs.img
    diag: |
      ls -la /usr/lib/modules/*/ 2>&1 | head -n 30
      echo "--- bootc-finalize log if present ---"; cat /tmp/bootc-finalize.log 2>&1 | tail -n 20
  - name: ostree dracut module baked into initramfs
    run: lsinitrd "$(ls /usr/lib/modules/*/initramfs.img | head -1)" | grep -qi ostree
    diag: |
      f=$(ls /usr/lib/modules/*/initramfs.img 2>/dev/null | head -1)
      echo "initramfs = ${f:-NONE}"
      [ -n "$f" ] && lsinitrd "$f" 2>&1 | grep -i ostree | head -n 10
  - name: btrfs dracut module baked into initramfs
    run: lsinitrd "$(ls /usr/lib/modules/*/initramfs.img | head -1)" | grep -qi btrfs
    diag: |
      f=$(ls /usr/lib/modules/*/initramfs.img 2>/dev/null | head -1)
      echo "initramfs = ${f:-NONE}"
      [ -n "$f" ] && lsinitrd "$f" 2>&1 | grep -i btrfs | head -n 10

  # ── filesystems ────────────────────────────────────────────────────────
  # btrfs-progs is installed in the MAIN image (x86_64) but NOT in the minimal
  # image (omitted to hit the RAM target). Gate to amd64 (main is x86_64-only).
  - name: btrfs-progs present
    arch: amd64
    run: command -v mkfs.btrfs
    diag: |
      command -v mkfs.btrfs 2>&1 || echo absent; dpkg -l 2>&1 | grep -i btrfs-progs
  - name: btrfs kernel module loads
    arch: amd64
    # Use /proc/filesystems instead of lsmod: lsmod omits built-in modules
    # (CONFIG_BTRFS_FS=y), so the check passes for both module and built-in.
    run: modprobe btrfs 2>/dev/null; grep -qw btrfs /proc/filesystems
    diag: |
      modprobe btrfs 2>&1 || echo "modprobe FAILED (may be built-in)"
      grep btrfs /proc/filesystems 2>&1 || echo "not in /proc/filesystems"
      lsmod 2>&1 | grep btrfs || echo "not in lsmod (may be built-in)"
      ls /usr/lib/modules/*/kernel/fs/btrfs/ 2>&1 || echo "no btrfs.ko (may be built-in)"

  # ── podman (bootc imgstorage on upgrade) ───────────────────────────────
  # podman is installed in the MAIN image (x86_64) but NOT in the minimal
  # image (omitted to hit the RAM target). Gate to amd64: the main image is
  # x86_64-only today, and the minimal image (both arches) ships no podman.
  - name: podman present
    arch: amd64
    run: command -v podman
    diag: |
      command -v podman 2>&1 || echo absent; dpkg -l 2>&1 | grep -i podman
  - name: podman graph driver resolvable
    arch: amd64
    run: podman info --format '{{.Store.GraphDriverName}}'
    diag: |
      podman info 2>&1 | head -n 40

  # ── networking / repacked packages ─────────────────────────────────────
  # ifupdown2 is repacked and installed in the MAIN image only; the minimal
  # image uses systemd-networkd instead.
  - name: ifupdown2 repacked (+bootc)
    variant: main
    run: dpkg-query -W -f='${Version}' ifupdown2
    expect: +bootc
    diag: |
      dpkg-query -W -f='${Version}\n' ifupdown2 2>&1; apt-cache policy ifupdown2 2>&1 | head -n 6
  - name: systemd-timesyncd repacked (+bootc)
    run: dpkg-query -W -f='${Version}' systemd-timesyncd
    expect: +bootc
    diag: |
      dpkg-query -W -f='${Version}\n' systemd-timesyncd 2>&1; apt-cache policy systemd-timesyncd 2>&1 | head -n 6
  - name: DNS resolution works
    run: getent hosts deb.debian.org
    diag: |
      cat /etc/resolv.conf 2>&1
      getent hosts deb.debian.org 2>&1 || echo "resolution failed"
      systemctl status systemd-resolved --no-pager -l 2>&1 | tail -n 8
  # sshd is installed in the MAIN image (x86_64) but NOT in the minimal image
  # (omitted to hit the RAM target). Gate to amd64.
  - name: sshd active
    arch: amd64
    run: systemctl is-active ssh
    diag: |
      systemctl status ssh --no-pager -l 2>&1 | tail -n 15
      journalctl -b -u ssh --no-pager 2>&1 | tail -n 15
  - name: SSH host keys regenerated at first boot
    run: test -f /etc/ssh/ssh_host_ed25519_key
    diag: |
      ls -la /etc/ssh/ssh_host_* 2>&1 || echo "no host keys found"
      systemctl status ssh-host-keygen --no-pager -l 2>&1 | tail -20
      journalctl -u ssh-host-keygen --no-pager -b 2>&1 | tail -10
  - name: ifupdown2-autoconf marker present
    variant: main
    run: grep -q '^# ifupdown2-autoconf' /etc/network/interfaces
    diag: |
      cat /etc/network/interfaces 2>&1
      ls -la /etc/network/ 2>&1
  - name: main image interface has routable IP
    variant: main
    run: ip -4 addr show scope global | grep -q inet
    diag: |
      ip addr 2>&1
      cat /etc/network/interfaces 2>&1
      systemctl status networking.service --no-pager -l 2>&1 | tail -20
      journalctl -u networking.service --no-pager -b 2>&1 | tail -30
  - name: systemd-networkd active (minimal)
    variant: minimal
    run: systemctl is-active systemd-networkd
    diag: |
      systemctl status systemd-networkd --no-pager -l 2>&1 | tail -20
      journalctl -u systemd-networkd --no-pager -b 2>&1 | tail -20
      ip addr 2>&1
  - name: minimal image interface has routable IP
    variant: minimal
    run: ip -4 addr show scope global | grep -q inet
    diag: |
      ip addr 2>&1
      networkctl 2>&1 | head -20
      systemctl status systemd-networkd --no-pager -l 2>&1 | tail -20
      journalctl -u systemd-networkd --no-pager -b 2>&1 | tail -20

  # ── first-boot tooling shipped ─────────────────────────────────────────
  # firstboot-user-setup is installed in the MAIN image only; the minimal image
  # omits it to hit the RAM target.
  - name: firstboot wizard present
    variant: main
    run: test -x /usr/local/bin/firstboot-user-setup
    diag: |
      ls -la /usr/local/bin/firstboot-user-setup 2>&1
  - name: bootc-finalize helper present
    run: test -x /usr/local/bin/bootc-finalize
    diag: |
      ls -la /usr/local/bin/bootc-finalize 2>&1

  # ── rollback preparation (pre-reboot — must pass before the reboot phase) ─
  - name: two deployments staged for rollback test
    # ostree names the first deployment <rev>.0 and the next <rev>.1: the
    # staging step in install-fs.sh creates exactly two, so count the serial
    # suffixes rather than hunting entries whose name "ends in .0" — the
    # replayed boot-test (2026-10-30) shows only ONE such entry and the
    # original pattern could never reach 2 on a healthy two-slot install.
    run: test "$(ls -d /ostree/deploy/*/deploy/*.0 /ostree/deploy/*/deploy/*.1 2>/dev/null | wc -l)" -ge 2
    diag: |
      ls -la /ostree/deploy/*/deploy/ 2>&1
      ostree admin status 2>&1

  - name: /var rollback marker written
    run: touch /var/rollback-test-marker
    diag: |
      ls -la /var/ 2>&1 | head -n 20
      findmnt /var 2>&1

  - name: bootc rollback queues prior deployment
    # No jq: the image ships deliberately minimal tooling and the test must be
    # self-sufficient (the replayed boot-test 2026-10-30 fails "jq: command
    # not found" though bootc rollback itself queues the deployment).
    run: |
      bootc rollback &&
      bootc status --format json | grep -q '"rollbackQueued" *: *true'
    diag: |
      bootc status 2>&1
      ostree admin status 2>&1

reboot_tests:
  # ── post-rollback verification (runs after VM reboots into rollback slot) ─
  - name: /var marker preserved across rollback reboot
    run: test -f /var/rollback-test-marker
    diag: |
      ls -la /var/rollback-test-marker 2>&1 || echo absent
      findmnt /var 2>&1

  - name: rollback consumed after reboot (rollbackQueued is false)
    # No jq either (see the rollback-queue test above).
    run: |
      bootc status --format json | grep -q '"rollbackQueued" *: *false'
    diag: |
      bootc status 2>&1
      ostree admin status 2>&1

  - name: no failed systemd units after rollback reboot
    run: test "$(systemctl --failed --no-legend | wc -l)" -eq 0
    diag: |
      systemctl --failed --no-pager 2>&1
      echo '--- networking.service status ---'
      systemctl status networking.service --no-pager -l 2>&1 | tail -20
      echo '--- networking.service journal ---'
      journalctl -u networking.service --no-pager -b 2>&1 | tail -30

  - name: booted through bootc after rollback
    run: bootc status --format json
    expect: booted
    diag: |
      bootc status 2>&1 | head -n 30
      journalctl -b --no-pager 2>&1 | tail -n 20
