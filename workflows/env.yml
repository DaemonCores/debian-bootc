# Build-environment recipe for this repo's .deb builder.
#
# Consumed by the generic build-env reusable workflow, which assembles the image
# with buildah (no Containerfile) and pushes it to this repo's own GHCR as
# ghcr.io/<owner>/<repo>-buildenv. Rebuilt once a month; the per-package build
# jobs run inside it, so they start instantly instead of installing a toolchain.
#
#   base     base image to start from
#   env      environment variables baked into the image
#   phases   ordered list, each either `apt: [pkgs]` or `run: |script`, run in
#            order. SSL/clone deps MUST come first: the base image has no
#            ca-certificates, so any HTTPS step (curl, https apt) fails until
#            they are installed over the base HTTP sources.

base: debian:trixie

env:
  DEBIAN_FRONTEND: noninteractive
  CARGO_HOME: /build/rust
  RUSTUP_HOME: /build/rust

phases:
  # 1. Clone/SSL deps first, so HTTPS works for everything below.
  - apt:
      - ca-certificates
      - openssl
      - git
      - curl
      - wget

  # 2. Build deps for the from-source packages (grub, bootupd, libcomposefs,
  #    ostree, bootc) plus dpkg-dev/binutils/jq for packaging.
  - apt:
      - zstd
      - make
      - build-essential
      - go-md2man
      - libzstd-dev
      - pkgconf
      - autoconf
      - automake
      - libtool
      - libglib2.0-dev
      - libcurl4-openssl-dev
      - libgpgme-dev
      - libarchive-dev
      - libmount-dev
      - libfuse3-dev
      - libssl-dev
      - libsystemd-dev
      - gobject-introspection
      - libgirepository1.0-dev
      - libsoup-3.0-dev
      - bison
      - gperf
      - flex
      - gettext
      - python3
      - autopoint
      - gawk
      - meson
      - ninja-build
      - libfreetype6-dev
      - sbsigntool
      - dpkg-dev
      - binutils
      - jq

  # 3. yq for the manifest-driven build jobs. Download the binary matching
  # the runner's native arch so the buildenv image works on both amd64 and
  # arm64 runners (the previous hardcoded `yq_linux_amd64` fails on an arm64
  # runner with a wrong-binary-arch exec error). dpkg --print-architecture
  # returns `amd64` or `arm64` on the Debian-based buildenv base.
  - run: |
      _arch=$(dpkg --print-architecture)
      _ver=v4.54.1
      case "${_arch}" in
        amd64) _sha=8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f ;;
        arm64) _sha=189088da0c6429ec5178dfaab1a114805f6cab0b61b165ab236efedf1d57a71b ;;
        *) echo "unsupported arch ${_arch}" >&2; exit 1 ;;
      esac
      curl -fsSL \
        "https://github.com/mikefarah/yq/releases/download/${_ver}/yq_linux_${_arch}" \
        -o /usr/local/bin/yq
      printf '%s  /usr/local/bin/yq\n' "${_sha}" | sha256sum -c -
      chmod +x /usr/local/bin/yq
      # Content check: the binary actually runs on this arch (not a silent
      # wrong-arch download). A failing exec here aborts the buildenv build
      # rather than producing a broken image that fails every downstream job.
      /usr/local/bin/yq --version

  # 3.5. gh (GitHub CLI) — installed here because the reusable
  #     build-one-deb workflow runs `gh api ... DELETE` inside this
  #     container during the "Delete old artifacts" step. The GH_TOKEN
  #     env var is injected by the caller; only the binary is needed.
  - run: |
      _arch=$(dpkg --print-architecture)
      _ver=v2.102.0
      case "${_arch}" in
        amd64) _sha=bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386 ;;
        arm64) _sha=7862c86c72f43df3a2d93ddde6f473285b4e2af61b494849846827e513ef6484 ;;
        *) echo "unsupported arch ${_arch}" >&2; exit 1 ;;
      esac
      curl -fsSL "https://github.com/cli/cli/releases/download/${_ver}/gh_${_ver#v}_linux_${_arch}.tar.gz" \
        -o /tmp/gh.tgz
      printf '%s  /tmp/gh.tgz\n' "${_sha}" | sha256sum -c -
      tar -xzf /tmp/gh.tgz -C /tmp
      install -m 755 "/tmp/gh_${_ver#v}_linux_${_arch}/bin/gh" /usr/local/bin/gh
      rm -rf /tmp/gh.tgz "/tmp/gh_${_ver#v}_linux_${_arch}"
      /usr/local/bin/gh --version

  # 4. Rust (minimal) at CARGO_HOME/RUSTUP_HOME=/build/rust.
  - run: |
      _ver=1.29.1
      case "$(dpkg --print-architecture)" in
        amd64) _triple=x86_64-unknown-linux-gnu
               _sha=dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71 ;;
        arm64) _triple=aarch64-unknown-linux-gnu
               _sha=15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433 ;;
        *) echo "unsupported arch" >&2; exit 1 ;;
      esac
      curl --proto '=https' --tlsv1.2 -fsSL \
        "https://static.rust-lang.org/rustup/archive/${_ver}/${_triple}/rustup-init" \
        -o /tmp/rustup-init
      printf '%s  /tmp/rustup-init\n' "${_sha}" | sha256sum -c -
      chmod +x /tmp/rustup-init
      /tmp/rustup-init --profile minimal -y
      rm -f /tmp/rustup-init
