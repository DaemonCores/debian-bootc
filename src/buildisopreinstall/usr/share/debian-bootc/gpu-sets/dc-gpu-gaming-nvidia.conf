# kernel/modules/gpu/modprobe/dc-gpu-gaming-nvidia.conf
# Loader policy of the gpu-gaming-nvidia set (GPU FINAL, owner 2026-11-03),
# shipped at /etc/modprobe.d/dc-gpu-gaming-nvidia.conf by the
# gpu-gaming-nvidia deb.
#
# This package carries ONLY the loader policy: its in-tree modules come from
# the gpu-gaming deb (same display build) and the NVIDIA open kernel modules
# from the linux-modules-nvidia base deb the entry depends on — the MIT
# open-gpu-kernel-modules built once in CI (nothing compiles on the target).
#
# Display profile + NVIDIA open modules: nouveau must stay away from the
# device, the NVIDIA modules own it; the KMS modeset of nvidia_drm is
# enabled so the display path works the way dc-gpu expects it (dc-gpu
# loads nvidia_drm through its modules-load fragment for the gaming+NVIDIA
# profile).
blacklist nouveau
options nvidia-drm modeset=1