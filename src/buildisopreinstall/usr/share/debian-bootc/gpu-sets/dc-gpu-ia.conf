# kernel/modules/gpu/modprobe/dc-gpu-ia.conf
# Loader policy of the gpu-ia set (GPU FINAL, owner 2026-11-03), shipped at
# /etc/modprobe.d/dc-gpu-ia.conf by the gpu-ia deb — installed alone (the
# in-tree GPU sets conflict with each other; the NVIDIA variant relies on the
# same in-tree build).
#
# Compute profile: amdgpu is built WITHOUT Display Core (the overlay
# kernel/modules/gpu/ia), so the module provides KFD/HSA compute only —
# exactly what the ROCm/HIP runtime loads. The open NVIDIA display driver is
# blacklisted: an ia machine has no display job for it, and the NVIDIA
# compute path belongs to the -nvidia variant (gpu-ia-nvidia), which ships
# its own policy file dc-gpu-ia-nvidia.conf.
blacklist nouveau