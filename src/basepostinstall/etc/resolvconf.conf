# openresolv resolver configuration — the generic base layout.
#
# openresolv collects the nameservers declared per interface (dns-nameservers
# in /etc/network/interfaces) and writes the resulting resolver file. Without
# this file the default openresolv conffile serves the same single line; it is
# baked explicitly so the resolver contract of the base is declared here, not
# implied by the package default.
#
# Image-specific resolvers (a local dnsmasq cache, the ddns chain) extend this
# file in their own layer; the base ships no resolver of its own.
resolv_conf=/etc/resolv.conf