[Unit]
After=ostree-remount.service
# Clear the two conditions from the base unit that both break on a bootc/ostree
# deployment:
#
#   ConditionFirstBoot=yes         -- unreliable on ostree (firstboot detection
#                                     depends on /etc/machine-id state that may
#                                     not match what the unit expects)
#
#   ConditionPathIsReadWrite=/etc/ssh -- fails in two ways:
#     1. before ostree-remount, /etc is still ro (fixed by After= above)
#     2. in the minimal image, openssh-server is NOT baked in, so /etc/ssh
#        does not exist in the ostree deployment at all (a missing path is
#        never ReadWrite)
#
# Clearing a Condition key in a drop-in removes all earlier values (systemd
# semantics). ssh-keygen -A is already idempotent (never overwrites existing
# keys), so removing ConditionFirstBoot does not cause key rotation on
# subsequent boots.
ConditionFirstBoot=
ConditionPathIsReadWrite=
ConditionPathIsSymbolicLink=

[Service]
# Ensure /etc/ssh exists before ssh-keygen -A tries to write into it.
# Required for the minimal image where the directory is absent from the
# deployment (openssh-server is added by the CI harness, not baked in).
ExecStartPre=mkdir -p /etc/ssh
