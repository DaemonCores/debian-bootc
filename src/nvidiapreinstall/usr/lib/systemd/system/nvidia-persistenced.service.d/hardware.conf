# The persistence daemon exits with an error when no NVIDIA device is present,
# which leaves the whole system "degraded" on a machine without an NVIDIA GPU
# (one image serves every GPU vendor). ExecCondition exit codes 1-254 skip the
# unit without marking it failed; the PCI vendor ids are enumerated before
# userspace starts, so this does not depend on the kernel module being loaded.
[Service]
ExecCondition=/bin/sh -c 'cat /sys/bus/pci/devices/*/vendor 2>/dev/null | grep -qx 0x10de'
