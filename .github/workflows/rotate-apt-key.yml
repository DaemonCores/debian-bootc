name: Rotate APT signing key

# Generates a fresh APT signing key in CI, stores it as the APT_GPG_KEY secret,
# republishes the APT repository with it, then pins the SHA-256 of the newly
# published gpg.key in the Containerfiles (BOOTC_GPG_SHA256) and rebuilds the
# images.  The private key never leaves scripts/rotate-apt-key.sh other than
# through a pipe into `gh secret set`: it is not logged, not exported as an
# output and not uploaded as an artifact.
#
# Requires the PAT_SECRETS secret (secrets:write on this repository), the same
# token module signing already uses.  Installed hosts are not affected: they
# update through the bootc image, not through APT.

on:
  schedule:
    - cron: '0 3 1 */3 *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rotate-apt-key
  cancel-in-progress: false

jobs:
  rotate:
    if: github.repository == 'DaemonCores/debian-bootc'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Generate key and update the APT_GPG_KEY secret
        id: rotate
        env:
          GH_TOKEN: ${{ secrets.PAT_SECRETS }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN}" ] || { echo "::error::PAT_SECRETS is not set"; exit 1; }
          fpr=$(scripts/rotate-apt-key.sh rotate)
          echo "fingerprint=${fpr}" >>"$GITHUB_OUTPUT"
          echo "New signing key fingerprint: ${fpr}"

      - name: Republish the APT repository with the new key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run pipeline.yml --ref main \
            -f rebuild_env=false -f run_debs=true \
            -f run_image=false -f run_iso=false
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow pipeline.yml --branch main \
              --event workflow_dispatch --created ">=${start}" \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "${run_id}" ] && break
            sleep 10
          done
          [ -n "${run_id}" ] || { echo "::error::dispatched run not found"; exit 1; }
          gh run watch "${run_id}" --exit-status

      - name: Pin the published key hash
        run: scripts/rotate-apt-key.sh publish-hash "${{ steps.rotate.outputs.fingerprint }}"

      - name: Commit and push the new hash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Containerfile Containerfile.minimal
          git commit -m "chore(apt): rotate signing key and update BOOTC_GPG_SHA256"
          git push origin HEAD:main

      - name: Rebuild images and ISO with the new pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pipeline.yml --ref main
