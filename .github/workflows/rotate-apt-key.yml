name: Rotate APT signing key

# Thin caller: the rotation logic lives in the shared reusable workflow
# DaemonCores-CI/.github/workflows/rotate-apt-key.yml (every distribution of the
# organisation rotates its APT key the same way).  This repo only declares the
# quarterly schedule and the manual trigger.  Needs the PAT_SECRETS secret.

on:
  schedule:
    - cron: '0 3 1 */3 *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rotate-apt-key
  cancel-in-progress: false

jobs:
  rotate:
    uses: DaemonCores/DaemonCores-CI/.github/workflows/rotate-apt-key.yml@main
    secrets: inherit
