name: Lint

# Thin caller: the toolchain setup and the gate run in the shared reusable
# workflow DaemonCores-CI/.github/workflows/lint.yml, which runs this repo's
# `make admission check docs-check` (same entry point as local runs).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs'
      - '**.md'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: DaemonCores/DaemonCores-CI/.github/workflows/lint.yml@main
