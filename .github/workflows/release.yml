name: Release

# Thin caller: versioning lives in DaemonCores-CI.  Versions come from
# Conventional Commits.  An `edge` pre-release is cut ONLY for a commit whose
# Full Pipeline run finished 100% green (push or scheduled run: a manual run
# may be filtered to a few packages, so it never counts); a push whose pipeline
# is red, cancelled or still running gets no tag.  A `stable` release is only
# ever published by running this workflow by hand.

on:
  workflow_run:
    workflows: [Full Pipeline]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edge:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event != 'workflow_dispatch'
    uses: DaemonCores/DaemonCores-CI/.github/workflows/release.yml@main
    with:
      channel: edge
      ref: ${{ github.event.workflow_run.head_sha }}
  stable:
    if: github.event_name == 'workflow_dispatch'
    uses: DaemonCores/DaemonCores-CI/.github/workflows/release.yml@main
    with:
      channel: stable
