name: Full Pipeline

# Thin caller: this repo only declares its triggers and concurrency. The whole
# job graph (change plan / auto-skip, env, debs, image, iso) lives in the shared
# reusable workflow DaemonCores-CI/.github/workflows/full-pipeline.yml.
#
# Triggers:
#   push (main)        full pipeline, but untouched stages auto-skip (the plan
#                      job diffs the push) on top of the per-deb content cache.
#   workflow_dispatch  the checkboxes decide, verbatim.
#   schedule (monthly) rebuild everything.
#
# concurrency cancels an in-progress run when a newer push arrives (triggers and
# concurrency must live in the caller — GitHub evaluates them here, not in the
# reusable workflow). `update_base` (rebuild the debian-bootc base) is a
# manual-dispatch-only knob; a push never triggers it.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs'
      - '**.md'
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      update_base:
        description: 'Rebuild debian-bootc base image first (triggers its pipeline and waits)'
        type: boolean
        default: false
      rebuild_env:
        description: 'Rebuild the :buildenv toolchain image first (needed once to seed it, or after editing env.yml)'
        type: boolean
        default: false
      run_debs:
        description: 'Build .deb packages'
        type: boolean
        default: true
      run_iso:
        description: 'Build ISO'
        type: boolean
        default: true
      only_deb:
        description: 'Scoped-cycle validation: build only the .deb whose name is <only_deb> or starts with <only_deb>- (empty = the normal plan)'
        type: string
        default: ''
      run_image:
        description: 'Build container image'
        type: boolean
        default: true
      run_img_rpi:
        description: 'Build Raspberry Pi .img (arm64 only)'
        type: boolean
        default: false
      run_img_gallium:
        description: 'Build Linux Gallium .img (arm64 only) — disabled for this repo'
        type: boolean
        default: false
      sign_modules:
        description: 'Module signing override: nosign | sign | both | "" (use config.yml default)'
        type: string
        default: ''

permissions:
  actions: write
  contents: write
  packages: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: DaemonCores/DaemonCores-CI/.github/workflows/full-pipeline.yml@main
    with:
      enable_base: true
      update_base: ${{ inputs.update_base }}
      rebuild_env: ${{ inputs.rebuild_env }}
      run_debs: ${{ inputs.run_debs }}
      run_image: ${{ inputs.run_image }}
      run_iso: ${{ inputs.run_iso }}
      # Scoped-cycle passthrough: the 11/12 modules-lane fix cycles on one
      # consumer deb at a time (minutes), the kernel wave stays cached.
      only_deb: ${{ inputs.only_deb }}
      # Forward the rpi disk-image opt-in to the shared workflow.
      # run_img_gallium is intentionally NOT forwarded: this repo
      # (debian-bootc) does not ship a Gallium phone target, so the
      # Gallium .img build is disabled here. The shared workflow
      # keeps its own default ('false') for run_img_gallium.
      run_img_rpi: ${{ inputs.run_img_rpi }}
      sign_modules: ${{ inputs.sign_modules }}
    secrets: inherit
