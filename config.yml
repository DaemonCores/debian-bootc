signing:
  modules:
    # Default module signing mode for this distribution.
    # nosign — modules are built unsigned.
    # sign   — modules are signed with the persistent MODULE_SIGNING_KEY secret.
    # both   — kept for compatibility: behaves as `sign`. There is ONE image
    #          per kernel variant; module-signature enforcement is chosen at
    #          install by the bootc-installer (`module.sig_enforce=1` karg,
    #          default on), never by a second image or kernel.
    #
    # Can be overridden per-run via the sign_modules workflow_dispatch input.
    # On the first run with sign/both, the key is auto-generated and stored as
    # a GitHub secret; signing becomes active from the second run onward.
    default: both
